<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fixture shadow</title>
<style>body { font-family:monospace; background:#fef; }</style>
</head>
<body>
<h1>FIXTURE-SHADOW</h1>
<p>&lt;video&gt; lives inside an <b>open shadow root</b> — document.querySelectorAll("video") will NOT find it.</p>
<div id="host"></div>
<script>
const root = document.getElementById('host').attachShadow({ mode: 'open' });
root.innerHTML = `
  <style>video{display:block;width:640px;height:360px;background:#000}canvas{display:none}</style>
  <video id="v" autoplay muted playsinline></video>
  <canvas id="c" width="640" height="360"></canvas>`;
const ctx = root.getElementById('c').getContext('2d');
let t = 0;
function draw() {
  t++;
  ctx.fillStyle = '#301828'; ctx.fillRect(0, 0, 640, 360);
  ctx.fillStyle = '#0af'; ctx.fillRect((t * 3) % 600, 240, 44, 44);
  ctx.fillStyle = '#fff'; ctx.font = '28px monospace';
  ctx.fillText('FIXTURE-SHADOW video', 40, 80);
  ctx.font = '20px monospace';
  ctx.fillText('frame=' + String(t).padStart(6, '0'), 40, 130);
  ctx.fillText(new Date().toISOString().slice(11, 19) + '.' + (t % 10), 40, 165);
}
draw();
const v = root.getElementById('v');
v.srcObject = root.getElementById('c').captureStream(10);
v.play().catch(() => {});
setInterval(draw, 100);
</script>
</body>
</html>
