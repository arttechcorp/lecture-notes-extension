name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 미디어 디먹스(ffmpeg 픽스처)와 사용량 DB(로컬 Postgres) 테스트는 바이너리가 없으면 건너뛴다 — CI에서는 실제로 돌린다.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg postgresql
      - run: node --test lib/*.test.js server/*.test.js tools/*.test.mjs
      - run: node tools/package-cws.mjs --dry-run --skip-tests
