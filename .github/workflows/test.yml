name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test lib/*.test.js server/*.test.js tools/*.test.mjs
      - run: node tools/package-cws.mjs --dry-run --skip-tests
