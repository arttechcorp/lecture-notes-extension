<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보관함</title>
<style>
  :root{--canvas:#F7F7F4;--surface:#FFFFFF;--ink:#18181B;--muted:#64646D;--line:#DCDCD8;--accent:#FF5600;--accentText:#A63700;--sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Pretendard,"Apple SD Gothic Neo",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 var(--sans);color:var(--ink);background:var(--canvas)}
  .page-head{max-width:760px;margin:0 auto;padding:28px 20px 16px;border-bottom:1px solid var(--line)}
  .page-head h1{margin:0;font-size:22px;font-weight:600}
  .page-head .sub{margin:.3em 0 0;font-size:12px;color:var(--muted)}
  main{max-width:760px;margin:0 auto;padding:16px 20px 40px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
  .card h2{margin:0 0 4px;font-size:15px;font-weight:600}
  .card .meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:var(--muted)}
  .card .badge{color:var(--accentText);border:1px solid var(--accent);border-radius:999px;padding:0 8px;font-size:11px}
  .card .row-actions{display:flex;gap:8px;margin-top:10px}
  button,.open-link{min-height:36px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:13px var(--sans);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  button:hover,.open-link:hover{border-color:var(--accentText)}
  .open-link{color:var(--accentText);border-color:var(--accent)}
  .danger{color:var(--accentText)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #empty,#error{max-width:760px;margin:24px auto;padding:0 20px;color:var(--muted);font-size:13px}
  #error{color:var(--accentText)}
</style>
</head>
<body>
<header class="page-head">
  <h1>보관함</h1>
  <p class="sub">이 기기에 암호화되어 저장된 강의 노트</p>
</header>
<main id="list"></main>
<p id="empty" hidden>아직 저장된 강의가 없습니다. 사이드 패널에서 강의를 처리하면 여기에 쌓입니다.</p>
<p id="error" role="alert" hidden></p>
<script src="lib/package-store.js"></script>
<script src="lib/library.js"></script>
<script src="library-page.js"></script>
</body>
</html>
