<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>엔진 디버그 — Summrizei</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
<style>
.ed-main{max-width:1280px;width:100%;margin:0 auto;padding:36px 16px 120px}
.ed-account{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted)}
.ed-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:36px;max-width:420px;margin:72px auto;text-align:center}
.ed-card h1{font:600 22px var(--sans);letter-spacing:-.01em;margin-bottom:12px}
.ed-card p{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:24px}
#edStatus{font-size:13px;color:var(--muted);min-height:1.5em}
.ed-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;margin-top:20px}
.ed-list{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 160px);overflow-y:auto}
.ed-run{display:block;text-decoration:none;padding:8px 10px;border:1px solid transparent;border-radius:8px;font-size:12.5px}
.ed-run:hover{border-color:var(--line)}
.ed-run.sel{background:var(--paper);border-color:var(--line)}
.ed-run .r1{display:flex;align-items:center;gap:8px;font-weight:600}
.ed-run .r2{color:var(--muted);font-size:11.5px;margin-top:2px;font-family:var(--mono)}
.ed-detail{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px;min-width:0}
.ed-detail h2{font:600 18px var(--sans);display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ed-detail h3{font:600 14px var(--sans);margin:26px 0 8px}
.ed-meta{font-size:12px;color:var(--muted);font-family:var(--mono)}
.badge{font-size:11px;padding:2px 8px;border-radius:9999px;font-weight:600}
.badge.ok{background:#dcfce7;color:#166534}
.badge.fail{background:#fee2e2;color:#991b1b}
.badge.running{background:#fef9c3;color:#854d0e}
.badge.skip{background:var(--soft);color:var(--muted)}
td.st-ok{color:#166534}td.st-fail,td.st-error{color:#991b1b;font-weight:600}td.st-skip{color:var(--muted)}
tr.errrow td{background:#fef2f2}
td.detail{white-space:normal;max-width:520px;word-break:break-all;font-size:11.5px}
.ed-pre{border:1px solid var(--line);border-radius:8px;background:var(--ground);padding:10px 12px;font:11.5px/1.6 var(--mono);max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.ed-md{font-size:13px;line-height:1.8}
.ed-md h2,.ed-md h3,.ed-md h4{font:600 15px var(--sans);margin:16px 0 6px}
.ed-md p{margin-block:8px}
.ed-md ul{padding-left:20px;margin-block:6px}
.ed-md code,.ed-pre code{font-family:var(--mono);font-size:11.5px;background:var(--soft);padding:0 4px;border-radius:4px}
.ed-md pre{border:1px solid var(--line);border-radius:8px;background:var(--ground);padding:10px 12px;overflow:auto}
@media(max-width:860px){.ed-layout{grid-template-columns:1fr}.ed-list{max-height:240px}}
</style>
</head>
<body>
<header class="site-header wrap">
  <a class="brand" href="/" aria-label="Summrizei 홈">Summr<span>i</span>zei<span class="brand-dot">.</span></a>
  <div class="ed-account" id="edAccount" hidden><span id="edEmail"></span><button class="small-button" id="logoutButton" type="button">로그아웃</button></div>
</header>
<main class="ed-main">
  <p id="edStatus" role="status" aria-live="polite"></p>

  <section id="gateView" hidden>
    <div class="ed-card">
      <h1>엔진 디버그</h1>
      <p>비밀번호를 입력하세요.</p>
      <form id="gateForm">
        <input type="password" id="gateInput" autocomplete="current-password" aria-label="비밀번호" style="width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:12px">
        <button class="button dark" type="submit" style="width:100%">확인</button>
      </form>
    </div>
  </section>

  <section id="loginView" hidden>
    <div class="ed-card">
      <h1>관리자 로그인</h1>
      <p>엔진 e2e 실행 모니터입니다. 관리자 계정으로 로그인하세요.</p>
      <button class="button dark" id="googleLoginButton" type="button">Google로 로그인</button>
    </div>
  </section>

  <section id="deniedView" hidden>
    <div class="ed-card">
      <h1>권한이 없습니다</h1>
      <p>로그인은 되었지만 이 계정은 관리자로 등록되어 있지 않습니다.</p>
      <button class="button quiet" id="deniedLogoutButton" type="button">로그아웃</button>
    </div>
  </section>

  <section id="dashboardView" hidden>
    <div class="ed-layout">
      <nav class="ed-list" id="runList" aria-label="run 목록"></nav>
      <div class="ed-detail" id="runDetail"><p class="ed-meta">run을 선택하세요.</p></div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="engine-debug.js"></script>
</body></html>
