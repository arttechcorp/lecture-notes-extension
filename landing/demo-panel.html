<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Summrizei 제품 체험</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="product-panel.css?v=20260912-1">
<style>
  /* 제품 UI는 product-panel.css를 그대로 사용한다. 아래는 체험 안내에만 적용한다. */
  html, body { height: 100%; }
  html { overflow: hidden; }
  body { min-height: 0; overflow: hidden; }
  /* 고정된 목업 프레임 안에서 노트 영역을 스크롤한다. */
  #stageLive, #stageDone { min-height: 0; }
  #stageDone { flex: 1; gap: 6px; }
  #stageDone .result-title { font-size: 13.5px; margin: 0; }
  #stageDone .statusline { margin-bottom: 0; }
  #stageDone .note-toolbar { margin: 2px 0 4px; }
  #stageDone .note-surface { flex: 1; min-height: 0; max-height: none; }
  #stageDone .note-document {
    font-size: 11.5px;
    line-height: 1.55;
    padding: 2px 4px 14px;
  }
  #stageDone .note-document h1 { font-size: 15px; margin: 0.7em 0 0.25em; }
  #stageDone .note-document h2 { font-size: 13.5px; margin: 0.75em 0 0.25em; }
  #stageDone .note-document h3 { font-size: 12px; margin: 0.7em 0 0.2em; }
  #stageDone .note-document p { margin: 0 0 0.45em; }
  #stageDone .note-document blockquote { margin: 0 0 0.5em; padding: 5px 8px; font-size: 11px; line-height: 1.5; }
  #stageDone .note-document table { font-size: 10.5px; margin: 0.35em 0 0.5em; }
  #stageDone .note-document th, #stageDone .note-document td { padding: 3px 5px; }
  #stageDone .note-document ul, #stageDone .note-document ol { margin: 0 0 0.45em; padding-left: 1.15em; }
  #stageDone .note-document li + li { margin-top: 0.15em; }
  #stageDone .note-document hr { margin: 0.6em 0; }
  #stageDone .detail.result-help { font-size: 10px; margin-top: 3px; }
  /* 제품의 export-row를 데모용으로 축소한 스타일. PDF 출력만 실제로 눌린다. */
  .export-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .export-row button {
    height: 30px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--rule-solid, var(--rule)); border-radius: var(--r-md);
    background: var(--paper); color: var(--ink);
  }
  .export-row button.is-pressed { background: var(--sunk); transform: translateY(1px); }
  /* 부모의 모바일 모드에서만 적용: 데스크톱 제품 패널에는 영향이 없다. */
  html.mobile-demo { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  .mobile-demo body { padding: 8px 12px; gap: 6px; overflow: hidden; }
  .mobile-demo .topbar h1 { font-size: 19px; }
  .mobile-demo .stage-steps span { padding: 4px 2px; font-size: 10px; }
  .mobile-demo #stageLive { flex: 1; min-height: 0; gap: 6px; }
  .mobile-demo #stageLive .statusline { margin-bottom: 0; }
  .mobile-demo #stageLive .pill { font-size: 11px; padding: 3px 9px; }
  .mobile-demo #stageLive .sub { font-size: 11px; }
  .mobile-demo .counters { flex-shrink: 0; border-radius: var(--r-sm); }
  .mobile-demo .counter { padding: 6px 4px 5px; }
  .mobile-demo .counter b { font-size: 16px; line-height: 1.15; }
  .mobile-demo .counter span { font-size: 10px; line-height: 1.2; margin-top: 1px; display: block; white-space: nowrap; }
  .mobile-demo .feed { flex: 1; min-height: 0; padding: 8px 10px; gap: 4px; border-radius: var(--r-md); }
  .mobile-demo .feed .head { font-size: 10px; padding-bottom: 3px; margin-bottom: 2px; }
  .mobile-demo #feedLines { gap: 3px; min-height: 0; }
  .mobile-demo #feedLines div { font-size: 10.5px; line-height: 1.35; gap: 6px; }
  .mobile-demo #feedLines .t { font-size: 10px; }
  .mobile-demo #stageDone { gap: 4px; flex: 1; min-height: 0; }
  .mobile-demo #stageDone .result-title { font-size: 13px; margin: 0; }
  .mobile-demo #stageDone .statusline { margin-bottom: 0; }
  .mobile-demo #stageDone .note-toolbar { margin: 1px 0 2px; }
  .mobile-demo .note-toolbar button { height: 28px; min-height: 28px; min-width: 44px; font-size: 12px; padding: 0 10px; }
  .mobile-demo #stageDone .note-surface { flex: 1; min-height: 0; max-height: 145px; }
  .mobile-demo #stageDone .note-document { font-size: 12px; line-height: 1.55; padding: 2px 2px 8px; }
  .mobile-demo #stageDone .note-document h1 { font-size: 13.5px; margin: 0.4em 0 0.15em; }
  .mobile-demo #stageDone .note-document h2 { font-size: 12.5px; margin: 0.4em 0 0.15em; }
  .mobile-demo #stageDone .note-document h3 { font-size: 11.5px; margin: 0.4em 0 0.15em; }
  .mobile-demo #stageDone .note-document blockquote,
  .mobile-demo #stageDone .note-document table { font-size: 11px; }
  .mobile-demo #stageDone .detail.result-help { font-size: 10px; margin-top: 1px; }
  .mobile-demo #result { font-size: 12px; }
  .mobile-demo .export-row button { height: 26px; font-size: 11px; }
</style>
</head>
<body>
<div class="topbar">
  <div><h1>Summr<span>i</span>zei<span class="brand-dot">.</span></h1></div>
</div>
<nav class="stage-steps" aria-label="노트 만들기 단계"><span id="stepLive" class="active" aria-current="step">02 캡처</span><i aria-hidden="true"></i><span id="stepDone">03 노트</span></nav>

<div id="stageLive" hidden>
  <div class="statusline"><span class="pill live"><span class="pulse"></span>캡처 중</span><span class="sub" id="elapsed">00:00</span></div>
  <div class="counters">
    <div class="counter"><b id="cntSlides">0</b><span>슬라이드</span></div>
    <div class="counter"><b id="cntVoice">0</b><span>음성 줄</span></div>
    <div class="counter"><b id="cntQueue">0</b><span>처리 대기</span></div>
  </div>
  <div class="feed"><div class="head"><span>지금 인식 중</span><span>최근 3줄</span></div><div id="feedLines"><div class="empty">아직 인식된 내용이 없습니다.</div></div></div>
</div>

<div id="stageDone" hidden>
  <div class="statusline"><span class="pill ok" id="donePill">노트 생성 중</span><span class="sub" id="doneSummary"></span></div>
  <h2 class="result-title" id="resultTitle" tabindex="-1">NPV and IRR explained</h2>
  <div class="note-toolbar">
    <div class="note-modes" role="group" aria-label="노트 보기 방식">
      <button id="noteReadBtn" type="button" aria-pressed="true" aria-controls="notePreview">읽기</button>
      <button id="noteEditBtn" type="button" aria-pressed="false" aria-controls="result">편집</button>
    </div>
    <button class="note-copy" id="copyBtn" type="button" disabled>복사</button>
  </div>
  <div class="note-surface" id="noteSurface">
    <article class="note-document" id="notePreview" aria-label="강의 노트" tabindex="0"></article>
    <textarea id="result" aria-label="강의 노트 Markdown 편집" readonly hidden></textarea>
  </div>
  <div class="export-row" id="exportRow" hidden>
    <button id="pdfBtn" type="button" disabled>PDF 출력</button>
    <button id="notionBtn" type="button" disabled>노션으로 복사</button>
  </div>
  <p class="detail result-help">AI가 작성한 예시 초안입니다. 자동 재생을 멈추고 읽거나 복사할 수 있습니다.</p>
</div>
</body>
</html>
