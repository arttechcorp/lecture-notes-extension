<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Summrizei 제품 체험</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="product-panel.css?v=20260912-1">
<style>
  /* 제품 UI는 product-panel.css를 그대로 사용한다. 아래는 체험 안내에만 적용한다. */
  html, body { height: 100%; }
  html { overflow: hidden; }
  body { min-height: 0; overflow: hidden; }
  /* 고정된 목업 프레임 안에서 노트 영역을 스크롤한다. */
  #stageLive, #stageDone { min-height: 0; }
  #stageDone { flex: 1; gap: 6px; }
  #stageDone .result-title { font-size: 13.5px; margin: 0; }
  #stageDone .statusline { margin-bottom: 0; }
  #stageDone .note-toolbar { margin: 2px 0 4px; }
  #stageDone .note-surface { flex: 1; min-height: 0; max-height: none; }
  #stageDone .note-document {
    font-size: 11.5px;
    line-height: 1.55;
    padding: 2px 4px 14px;
  }
  #stageDone .note-document h1 { font-size: 15px; margin: 0.7em 0 0.25em; }
  #stageDone .note-document h2 { font-size: 13.5px; margin: 0.75em 0 0.25em; }
  #stageDone .note-document h3 { font-size: 12px; margin: 0.7em 0 0.2em; }
  #stageDone .note-document p { margin: 0 0 0.45em; }
  #stageDone .note-document blockquote { margin: 0 0 0.5em; padding: 5px 8px; font-size: 11px; line-height: 1.5; }
  #stageDone .note-document table { font-size: 10.5px; margin: 0.35em 0 0.5em; }
  #stageDone .note-document th, #stageDone .note-document td { padding: 3px 5px; }
  #stageDone .note-document ul, #stageDone .note-document ol { margin: 0 0 0.45em; padding-left: 1.15em; }
  #stageDone .note-document li + li { margin-top: 0.15em; }
  #stageDone .note-document hr { margin: 0.6em 0; }
  #stageDone .detail.result-help { font-size: 10px; margin-top: 3px; }
</style>
</head>
<body>
<div class="topbar">
  <div><h1>Summr<span>i</span>zei<span class="brand-dot">.</span></h1><p class="brand-caption">강의의 흐름을, 나의 노트로.</p></div>
</div>
<nav class="stage-steps" aria-label="노트 만들기 단계"><span id="stepLive" class="active" aria-current="step">02 캡처</span><i aria-hidden="true"></i><span id="stepDone">03 노트</span></nav>

<div id="stageLive" hidden>
  <div class="statusline"><span class="pill live"><span class="pulse"></span>캡처 중</span><span class="sub" id="elapsed">00:00</span></div>
  <p class="detail">화면과 음성이 인식되는 과정을 예시로 보여드립니다.</p>
  <div class="counters">
    <div class="counter"><b id="cntSlides">0</b><span>슬라이드</span></div>
    <div class="counter"><b id="cntVoice">0</b><span>음성 줄</span></div>
    <div class="counter"><b id="cntQueue">0</b><span>처리 대기</span></div>
  </div>
  <div class="feed"><div class="head"><span>지금 인식 중</span><span>최근 3줄</span></div><div id="feedLines"><div class="empty">아직 인식된 내용이 없습니다.</div></div></div>
</div>

<div id="stageDone" hidden>
  <div class="statusline"><span class="pill ok" id="donePill">노트 생성 중</span><span class="sub" id="doneSummary"></span></div>
  <h2 class="result-title" id="resultTitle" tabindex="-1">NPV and IRR explained</h2>
  <div class="note-toolbar">
    <div class="note-modes" role="group" aria-label="노트 보기 방식">
      <button id="noteReadBtn" type="button" aria-pressed="true" aria-controls="notePreview">읽기</button>
      <button id="noteEditBtn" type="button" aria-pressed="false" aria-controls="result">편집</button>
    </div>
    <button class="note-copy" id="copyBtn" type="button" disabled>복사</button>
  </div>
  <div class="note-surface" id="noteSurface">
    <article class="note-document" id="notePreview" aria-label="강의 노트" tabindex="0"></article>
    <textarea id="result" aria-label="강의 노트 Markdown 편집" readonly hidden></textarea>
  </div>
  <p class="detail result-help">AI가 작성한 예시 초안입니다. 자동 재생을 멈추고 읽거나 복사할 수 있습니다.</p>
</div>
</body>
</html>
