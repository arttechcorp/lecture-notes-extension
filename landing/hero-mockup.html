<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>히어로 목업 작업용 미리보기 — Summrizei</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
<link rel="stylesheet" href="hero-mockup.css">
</head>
<body>
<p class="mock-preview-note">작업용 미리보기 페이지입니다. 검토 후 이 목업 마크업을 <code>index.html</code> 히어로로 이식합니다.</p>

<header class="site-header wrap">
  <a class="brand" href="index.html" aria-label="Summrizei 홈">Summr<span>i</span>zei<span class="brand-dot">.</span></a>
  <nav aria-label="주 메뉴"><a href="index.html#preview">노트 미리보기</a><a href="index.html#plans">플랜</a><button class="small-button" type="button">무료로 시작 <span aria-hidden="true">↗</span></button></nav>
</header>

<main>
<section class="hero hero-stacked wrap">
  <div class="hero-copy">
    <p class="eyebrow">LESS TRANSCRIBING. MORE UNDERSTANDING.</p>
    <h1>강의는 듣고,<br>복습은 노트로.</h1>
    <p class="lead">놓치기 쉬운 설명부터 중요한 슬라이드까지.<br>강의의 화면과 말소리를 모아, 다시 읽고 싶은 학습 노트로 만드세요.</p>
    <div class="hero-actions"><button class="button dark" type="button">Summrizei 무료로 시작 <span aria-hidden="true">↗</span></button><a class="text-link" href="index.html#preview">먼저 결과 살펴보기 <span aria-hidden="true">↓</span></a></div>
    <p class="micro">Chrome 확장 프로그램 · Free는 API 키 없이 사용</p>
  </div>

  <!-- 강의 탭 옆에 사이드패널이 열린 실제 사용 화면. 전부 CSS로 그린 목업이며 실제 강의 캡처는 쓰지 않는다. -->
  <figure class="mock" aria-labelledby="mockCaption">
    <!-- 창 안은 전부 장식이다. 설명은 figcaption 이 맡는다. -->
    <div class="mock-window" aria-hidden="true">
      <div class="mock-titlebar">
        <span class="mock-lights" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="mock-title">LetsLearn</span>
      </div>
      <div class="mock-urlbar">
        <span class="mock-url-icon" aria-hidden="true"></span>
        <span class="mock-url"><b>letslearn.org</b>/mod/vod/viewer.php?id=4522284</span>
      </div>

      <div class="mock-body">
        <div class="lecture">
          <div class="lec-topbar">
            <span class="lec-course">Engineering economic decisions</span>
            <span class="lec-div" aria-hidden="true"></span>
            <span class="lec-time">09:00</span>
            <span class="lec-div" aria-hidden="true"></span>
            <span class="lec-chapter">투자안 평가 구간</span>
            <span class="lec-topbar-actions" aria-hidden="true"><i class="lec-help">?</i><i class="lec-close">×</i></span>
          </div>

          <div class="lec-stage">
            <div class="lec-slide">
              <p class="slide-title">Investment Decision Flow</p>
              <div class="slide-cycles" aria-hidden="true">
                <span>추정<br>Cycle</span><span>할인<br>Cycle</span><span>비교<br>Cycle</span><span>선택<br>Cycle</span>
              </div>
              <div class="slide-arcs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
              <div class="slide-nodes">
                <span>현금흐름<br>추정</span><span>할인율<br>적용</span><span>현재가치<br>산출</span><span>기준별<br>비교</span><span>투자<br>결정</span>
              </div>
              <div class="slide-bars">
                <span class="bar-npv">NPV · 금액 기준</span>
                <span class="bar-irr">IRR · 비율 기준</span>
              </div>
              <span class="slide-page" aria-hidden="true">2</span>
            </div>
            <div class="lec-presenter" aria-hidden="true">
              <span class="presenter-figure"></span>
            </div>
          </div>

          <div class="lec-controls" aria-hidden="true">
            <span class="lec-icon lec-play"></span>
            <span class="lec-icon lec-volume"></span>
            <span class="lec-progress"><i class="lec-buffer"></i><i class="lec-knob"></i></span>
            <span class="lec-remain">-10:13</span>
            <span class="lec-icon lec-list"></span>
            <span class="lec-rate">1x</span>
            <span class="lec-icon lec-full"></span>
          </div>
        </div>

        <!-- 실제 sidepanel.html 의 '캡처 중' 단계를 그대로 재현한다. 제품 UI가 바뀌면 memory.md 참고. -->
        <aside class="panel">
          <div class="panel-topbar">
            <span class="panel-brand">Summrizei</span>
            <span class="panel-pill"><i class="panel-pulse"></i>캡처 중</span>
            <span class="panel-elapsed">12:07</span>
          </div>
          <p class="panel-detail">화면과 음성이 인식되면 아래에 쌓입니다. 원하는 구간까지 캡처한 뒤 노트를 열어보세요.</p>

          <div class="panel-counters">
            <div class="panel-counter"><b>24</b><span>슬라이드</span></div>
            <div class="panel-counter"><b data-count="voice">186</b><span>음성 줄</span></div>
            <div class="panel-counter"><b>2</b><span>처리 대기</span></div>
          </div>

          <div class="panel-feed">
            <div class="panel-feed-head"><span>지금 인식 중</span><span>최근 3줄</span></div>
            <div class="panel-feed-lines">
              <div class="feed-line"><time>09:12</time><p>NPV는 금액의 증가분을, IRR은 수익률을 보여 줍니다.</p></div>
              <div class="feed-line"><time>09:31</time><p>상호배타적 투자안에서는 두 기준의 순위가 달라질 수 있습니다.</p></div>
              <div class="feed-line"><time>09:44</time><p>투자 규모가 다르면 NPV를 기준으로 비교합니다.</p></div>
            </div>
          </div>

          <button class="panel-stop" type="button" tabindex="-1">캡처 마치고 노트 보기</button>
          <div class="panel-foot"><span>무료 플랜</span><span>기기 안에서 처리</span></div>
        </aside>
      </div>
    </div>
    <figcaption id="mockCaption" class="mock-caption">강의 탭 옆에서 사이드패널이 화면과 말소리를 모으는 모습입니다. 실제 강의 화면이 아닌 예시입니다.</figcaption>
  </figure>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="hero-mockup.js"></script>
</body>
</html>
