<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>사전 예약 완료 — Summrizei</title>
<meta name="description" content="Summrizei 사전 예약이 완료되었습니다.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F7F7F4">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css?v=20260919-mobile-fix">
</head>
<body>
<a class="skip" href="#main">본문으로 이동</a>
<header class="site-header wrap">
  <a class="brand" href="/" aria-label="Summrizei 홈">Summr<span>i</span>zei<span class="brand-dot">.</span></a>
</header>
<main id="main" class="thanks-main">
  <div class="thanks-body wrap">
    <div class="thanks-card">
      <p class="thanks-check" aria-hidden="true">✓</p>
      <h1>사전 예약이 완료됐어요.</h1>
      <p id="thanksEmail">출시되면 가장 먼저 알려드릴게요.<br>강의 영상이 노트가 되는 순간을 놓치지 마세요.</p>
      <div class="thanks-next">
        <p><b>다음 순서</b></p>
        <p>· Chrome 웹 스토어 등록이 완료되면 이메일과 문자로 안내드립니다.</p>
        <p>· 기다리는 동안 메인 페이지에서 노트 예시와 데모를 볼 수 있어요.</p>
      </div>
      <div class="thanks-actions">
        <button class="button dark" id="shareCopy" type="button">친구에게 공유 링크 복사</button>
        <a class="button quiet" href="/">메인으로 돌아가기</a>
        <p class="thanks-share-status" id="shareStatus" role="status"></p>
      </div>
    </div>
  </div>
</main>
<script>
(() => {
  try {
    const saved = JSON.parse(sessionStorage.getItem('summrizei.reserved') || 'null');
    if (saved?.email) {
      document.getElementById('thanksEmail').innerHTML =
        '<strong>' + saved.email.replace(/[<>&"]/g, '') + '</strong>' +
        (saved.plan ? ' · ' + saved.plan + ' 플랜' : '') +
        '으로 등록했어요.<br>출시되면 이 이메일로 가장 먼저 알려드릴게요.';
      sessionStorage.removeItem('summrizei.reserved');
    }
  } catch {}
  document.getElementById('shareCopy').addEventListener('click', async event => {
    const status = document.getElementById('shareStatus');
    const url = new URL('/', location.href).href;
    try {
      await navigator.clipboard.writeText(url);
      status.textContent = '링크를 복사했어요. 친구에게 공유해 보세요.';
    } catch {
      status.textContent = url;
    }
    event.target.blur();
  });
})();
</script>
</body>
</html>
