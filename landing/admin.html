<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>어드민 — Summrizei</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
<style>
.admin-main{max-width:900px;margin:0 auto;padding:48px 16px 120px}
.admin-account{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted)}
.admin-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:36px;max-width:420px;margin:72px auto;text-align:center}
.admin-card h1{font:600 22px var(--sans);letter-spacing:-.01em;margin-bottom:12px}
.admin-card p{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:24px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:36px}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.stat-card .label{font-size:12px;color:var(--muted)}
.stat-card .value{font:600 26px var(--mono);font-variant-numeric:tabular-nums;margin-top:8px}
.stat-card .caption{font-size:11px;color:var(--muted);margin-top:4px}
.mint-panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px}
.mint-panel h2{font:600 16px var(--sans);margin-bottom:16px}
.mint-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.mint-row label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.mint-row input[type=number]{width:100px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
.mint-row button{min-height:44px}
#mintOutput{width:100%;min-height:140px;margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:8px;font:12px var(--mono);resize:vertical}
.mint-actions{display:flex;gap:12px;margin-top:12px}
#adminStatus{font-size:13px;color:var(--muted);min-height:1.5em}
.codes-panel{margin-top:24px}
.codes-panel .table-wrap{max-height:360px;overflow-y:auto}
.codes-panel td:first-child{font-family:var(--mono)}
.codes-panel h2{display:flex;align-items:center;justify-content:space-between;gap:12px}
.codes-panel h2 span{display:flex;gap:8px}
/* 스크롤해도 어느 열인지 알 수 있어야 한다 */
.codes-panel thead th{position:sticky;top:0;z-index:1}
@media(max-width:760px){.stat-grid{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.stat-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header wrap">
  <a class="brand" href="/" aria-label="Summrizei 홈">Summr<span>i</span>zei<span class="brand-dot">.</span></a>
  <div class="admin-account" id="adminAccount" hidden><span id="adminEmail"></span><button class="small-button" id="logoutButton" type="button">로그아웃</button></div>
</header>
<main class="admin-main">
  <p id="adminStatus" role="status" aria-live="polite"></p>

  <section id="loginView" hidden>
    <div class="admin-card">
      <h1>관리자 로그인</h1>
      <p>Summrizei 사전예약 코드 관리 페이지입니다. 관리자 계정으로 로그인하세요.</p>
      <button class="button dark" id="googleLoginButton" type="button">Google로 로그인</button>
    </div>
  </section>

  <section id="deniedView" hidden>
    <div class="admin-card">
      <h1>권한이 없습니다</h1>
      <p>로그인은 되었지만 이 계정은 관리자로 등록되어 있지 않습니다.</p>
      <button class="button quiet" id="deniedLogoutButton" type="button">로그아웃</button>
    </div>
  </section>

  <section id="dashboardView" hidden>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">구독 중인 이용자</div><div class="value" id="statSubscribers">—</div><div class="caption" id="statSubscribersCaption">출시 후 집계</div></div>
      <div class="stat-card"><div class="label">사전예약 완료</div><div class="value" id="statReservations">—</div></div>
      <div class="stat-card"><div class="label">발급된 코드</div><div class="value" id="statCodesIssued">—</div></div>
      <div class="stat-card"><div class="label">사용된 코드</div><div class="value" id="statCodesUsed">—</div></div>
    </div>
    <div class="mint-panel">
      <h2>시드 코드 생성</h2>
      <div class="mint-row">
        <div><label for="mintCount">개수</label><input type="number" id="mintCount" min="1" max="100" value="10"></div>
        <button class="button dark" id="mintButton" type="button">시드 코드 생성</button>
      </div>
      <textarea id="mintOutput" readonly aria-label="생성된 코드 목록" placeholder="생성된 코드가 여기 나열됩니다"></textarea>
      <div class="mint-actions"><button class="button quiet" id="copyButton" type="button">전체 복사</button></div>
    </div>
    <div class="mint-panel codes-panel">
      <h2>생성된 코드
        <span><button class="button quiet" id="reloadCodesButton" type="button">새로고침</button><button class="button quiet" id="copyCodesButton" type="button">전체 복사</button></span>
      </h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>코드</th><th>종류</th><th>발급자</th><th>사용자</th><th>상태</th><th>생성일</th></tr></thead>
          <tbody id="codesBody"><tr><td colspan="6">아직 생성된 코드가 없습니다</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>
</body></html>
