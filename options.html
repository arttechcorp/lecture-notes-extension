<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Summrizei 설정</title>
<style>
  :root {
    --paper: #ffffff; --ground: #f6f6f6; --ink: #000000; --ash: #6e6e6e;
    --faint: #9a9a9a; --rule: #e4e4e4; --sunk: #f1f1f1;
    --r-lg: 14px; --r-md: 10px;
    --lift-1: 0 1px 2px rgba(0,0,0,.06), 0 1px 6px rgba(0,0,0,.04);
    --lift-2: 0 2px 5px rgba(0,0,0,.07), 0 10px 26px rgba(0,0,0,.09);
    --inset: inset 0 1px 3px rgba(0,0,0,.07);
    --btn-face: linear-gradient(180deg, #2a2a2a, #000000);
    --btn-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121212; --ground: #0a0a0a; --ink: #ffffff; --ash: #9d9d9d;
      --faint: #6b6b6b; --rule: #2a2a2a; --sunk: #1a1a1a;
      --lift-1: 0 1px 2px rgba(0,0,0,.6);
      --lift-2: 0 2px 6px rgba(0,0,0,.6), 0 10px 26px rgba(0,0,0,.5);
      --inset: inset 0 1px 3px rgba(0,0,0,.5);
      --btn-face: linear-gradient(180deg, #ffffff, #d9d9d9);
      --btn-text: #000000;
    }
  }
  * { box-sizing: border-box; }
  body {
    font: 14.5px/1.65 system-ui, sans-serif; max-width: 560px; margin: 0 auto;
    padding: 40px 20px 72px; color: var(--ink); background: var(--ground);
  }
  h2 { font-size: 15px; font-weight: 600; letter-spacing: .03em; margin: 0 0 6px; }
  h2 + p { margin-top: 0; color: var(--ash); font-size: 13.5px; }
  hr { border: none; border-top: 1px solid var(--rule); margin: 28px 0; }
  a { color: var(--ink); text-underline-offset: 3px; }

  input[type="text"], input[type="password"], select {
    width: 100%; padding: 9px 10px; font: inherit; border-radius: var(--r-md);
    border: 1px solid var(--rule); background: var(--sunk); color: var(--ink);
    box-shadow: var(--inset);
  }
  select { width: auto; min-width: 260px; max-width: 100%; }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 2px;
  }
  input[type="checkbox"] { width: auto; accent-color: var(--ink); }

  button {
    margin-top: 10px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
    border-radius: 100px; border: 1px solid transparent;
    background: var(--btn-face); color: var(--btn-text); box-shadow: var(--lift-2);
    transition: transform 140ms ease, box-shadow 140ms ease;
  }
  button:hover { transform: translateY(-1px); }
  @media (prefers-reduced-motion: reduce) { button:hover { transform: none } }

  #saved { color: var(--ash); margin-left: 10px; font-size: 13px; }
  .note { color: var(--ash); font-size: 12.5px; margin-top: 12px; }
  .card {
    background: var(--paper); border-radius: var(--r-lg); padding: 14px 15px;
    box-shadow: var(--lift-1);
  }
</style>
</head>
<body>
  <h2>노트 생성용 API 설정</h2>
  <p>요약 작성을 위해 사용할 AI 제공자와 API 키를 입력하세요.</p>
  <div style="margin-bottom: 8px;">
    <select id="provider">
      <option value="gemini">Gemini (Google AI Studio)</option>
      <option value="anthropic">Claude (Anthropic)</option>
    </select>
    <a id="keyLink" href="#" target="_blank" rel="noreferrer" style="font-size: 13px; margin-left: 8px;">키 발급받기 →</a>
  </div>
  <input id="apiKey" type="password" placeholder="API 키 입력..." />
  <div style="margin-top: 8px;">
    <label><input type="checkbox" id="revealCb"> 키 보이기</label>
    <label style="margin-left: 12px;"><input type="checkbox" id="syncCb"> 이 키를 크롬 계정에 동기화 (다른 컴퓨터에서도 사용)</label>
  </div>
  <button id="saveBtn">저장</button>
  <span id="saved" hidden>저장됨</span>
  <p class="note">키가 유출되면 본인 계정으로 과금될 수 있습니다. 안전하게 보관하세요.</p>
  
  <hr  />

  <h2>화면 인식 (OCR)</h2>
  <div class="card">
    <strong>Tesseract.js (온디바이스, 무료)</strong>
    <p class="note" style="margin-top: 4px;">사양 제약 없이 100% 기기 안에서만 화면 글자를 인식합니다. 화면 이미지는 어떤 외부 서버로도 전송되지 않습니다.</p>
  </div>

  <hr  />

  <h2>음성 인식 (STT) 설정</h2>
  <div class="card">
    <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer;">
      <input type="checkbox" id="whisperCb" style="width: auto; margin-top: 4px;">
      <div>
        <strong style="display: block;">로컬 음성 인식 (Local Whisper) 사용</strong>
        <span class="note" style="display: block; margin-top: 4px;">재생 중인 영상의 소리를 기기 안에서만 분석합니다. (외부 유출 없음)</span>
      </div>
    </label>

    <div style="margin-top: 14px;">
      <label for="whisperModel" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">인식 모델 크기</label>
      <select id="whisperModel" style="min-width: 100%;">
        <option value="tiny">Tiny 모델 (약 40MB, RAM 150MB — 권장, 저사양 및 빠른 시작)</option>
        <option value="base">Base 모델 (약 200MB, RAM 800MB — 고사양 데스크탑용)</option>
      </select>
    </div>
  </div>
  
  <script src="options.js"></script>
</body>
</html>
