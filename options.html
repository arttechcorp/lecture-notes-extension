<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>강의 필기 도우미 - 설정</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
  button { margin-top: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  #saved { color: #1a5fb4; margin-left: 8px; }
  .note { color: #666; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
  <h2>노트 생성용 API 설정</h2>
  <p>요약 작성을 위해 사용할 AI 제공자와 API 키를 입력하세요.</p>
  <div style="margin-bottom: 8px;">
    <select id="provider" style="padding: 6px; font: inherit;">
      <option value="gemini">Gemini (Google AI Studio)</option>
      <option value="anthropic">Claude (Anthropic)</option>
    </select>
    <a id="keyLink" href="#" target="_blank" rel="noreferrer" style="font-size: 13px; color: #1a5fb4; margin-left: 8px;">키 발급받기 →</a>
  </div>
  <input id="apiKey" type="password" placeholder="API 키 입력..." />
  <div style="margin-top: 8px;">
    <label><input type="checkbox" id="revealCb"> 키 보이기</label>
    <label style="margin-left: 12px;"><input type="checkbox" id="syncCb"> 이 키를 크롬 계정에 동기화 (다른 컴퓨터에서도 사용)</label>
  </div>
  <button id="saveBtn">저장</button>
  <span id="saved" hidden>저장됨</span>
  <p class="note">키가 유출되면 본인 계정으로 과금될 수 있습니다. 안전하게 보관하세요.</p>
  <script src="options.js"></script>
</body>
</html>
