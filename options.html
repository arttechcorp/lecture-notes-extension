<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>강의 필기 도우미 - 설정</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
  button { margin-top: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  #saved { color: #1a5fb4; margin-left: 8px; }
  .note { color: #666; font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
  <h2>Claude API 키</h2>
  <p>console.anthropic.com에서 발급한 본인 소유의 API 키를 입력하세요. 이 브라우저에만 로컬 저장되며 다른 서버로 전송되지 않습니다.</p>
  <input id="apiKey" type="password" placeholder="sk-ant-..." />
  <button id="saveBtn">저장</button>
  <span id="saved" hidden>저장됨</span>
  <p class="note">키가 유출되면 본인 계정으로 과금될 수 있습니다. 안전하게 보관하세요.</p>
  <script src="options.js"></script>
</body>
</html>
