<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>노트 서식 미리보기</title>
  <link rel="stylesheet" href="lib/vendor/katex/katex.min.css">
  <style>
    /* NoteSpec.css 외에 필요한 것만 둔다: iframe 본문 보정과 빈 안내. */
    body { margin: 0; padding: 0; background: #F7F7F4; }
    #content { display: flow-root; }
    .empty-notice { color: #64646D; text-align: center; padding: 40px 12px; font: 13px/1.6 ui-sans-serif, system-ui, sans-serif; }
    .recog-note { color: #64646D; padding: 20px 28px 0; font: 12px/1.6 ui-sans-serif, system-ui, sans-serif; }
    .recog { font: 13px/1.7 ui-sans-serif, system-ui, sans-serif; color: #18181B; max-width: 760px; margin: 0 auto; padding: 20px 28px; }
    .recog h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
    .recog .row { border-top: 1px solid #DCDCD8; padding: 6px 0; display: flex; gap: 12px; }
    .recog .t { flex: none; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #64646D; padding-top: 2px; }
  </style>
  <script src="lib/vendor/katex/katex.min.js"></script>
  <script src="lib/note-contract.js"></script>
  <script src="lib/note-spec.js"></script>
  <script src="lib/note-render.js"></script>
</head>
<body>
  <div id="content"><div class="empty-notice">노트가 완성되면 서식·수식이 여기에 렌더링됩니다.</div></div>
  <script>
    // 노트 양식 CSS는 한 번만 넣는다 — 렌더러가 만드는 DOM은 항상 라이트 종이 토큰이다(테마 무시).
    (() => {
      const style = document.createElement('style');
      style.textContent = NoteSpec.css;
      document.head.appendChild(style);
    })();

    const content = document.getElementById('content');
    let lastSentHeight = 0;
    let lastWidth = window.innerWidth;

    function notifyParentHeight() {
      const rect = content.getBoundingClientRect();
      const height = Math.max(Math.ceil(rect.height + 32), 140);
      if (Math.abs(height - lastSentHeight) >= 2) {
        lastSentHeight = height;
        window.parent.postMessage({ type: 'RENDER_HEIGHT', height }, '*');
      }
    }

    // 렌더러 반환 HTML은 모델 문자열이 이미 이스케이프된 것이라 innerHTML로 둔다.
    // 인식 결과는 계약 밖의 문자열이라 innerHTML로 넣지 않는다 — textContent만.
    function renderNote(note, crops, options) {
      const { html, warnings } = NoteRender.renderNote(note, { katex, crops: crops || {}, options: { ...(options || {}), medium: 'web' } });
      content.innerHTML = html;
      notifyParentHeight();
      requestAnimationFrame(notifyParentHeight);
      window.parent.postMessage({ type: 'RENDER_WARNINGS', warnings }, '*');
    }

    const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
    function renderRecognition(recognition) {
      content.textContent = '';
      const note = document.createElement('p');
      note.className = 'recog-note';
      note.textContent = '요약 없이 인식 결과만 있습니다.';
      content.append(note);
      const list = document.createElement('div');
      list.className = 'recog';
      const h = document.createElement('h2');
      h.textContent = '인식 결과';
      list.append(h);
      for (const s of recognition?.slides || []) {
        const row = document.createElement('div');
        row.className = 'row';
        const t = document.createElement('span');
        t.className = 't';
        t.textContent = fmt(s.t0);
        row.append(t, document.createTextNode(s.text || ''));
        list.append(row);
      }
      for (const s of recognition?.segments || []) {
        const row = document.createElement('div');
        row.className = 'row';
        const t = document.createElement('span');
        t.className = 't';
        t.textContent = `${fmt(s.t0)}–${fmt(s.t1)}`;
        row.append(t, document.createTextNode(s.text || ''));
        list.append(row);
      }
      content.append(list);
      notifyParentHeight();
      requestAnimationFrame(notifyParentHeight);
    }

    async function printNote(note, crops, options) {
      try {
        const { html } = NoteRender.renderNote(note, { katex, crops: crops || {}, options: { ...(options || {}), medium: 'print' } });
        content.innerHTML = html;
        await document.fonts.ready;
        await Promise.all([...content.querySelectorAll('img')].map(img => img.decode().catch(() => {})));
        window.focus();
        window.print();
      } catch (err) {
        window.parent.postMessage({ type: 'PRINT_ERROR', error: String(err && err.message ? err.message : err) }, '*');
      }
    }

    window.addEventListener('message', (event) => {
      const d = event.data;
      if (!d) return;
      if (d.type === 'RENDER_NOTE') renderNote(d.note, d.crops, d.options);
      else if (d.type === 'PRINT_NOTE') printNote(d.note, d.crops, d.options);
      else if (d.type === 'RENDER_RECOGNITION') renderRecognition(d.recognition);
    });

    window.addEventListener('afterprint', () => {
      window.parent.postMessage({ type: 'PRINT_COMPLETE' }, '*');
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth !== lastWidth) {
        lastWidth = window.innerWidth;
        notifyParentHeight();
      }
    });
    window.parent.postMessage({ type: 'RENDERER_READY' }, '*');
  </script>
</body>
</html>
