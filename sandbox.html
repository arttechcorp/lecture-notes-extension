<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>노트 서식 미리보기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lib/vendor/katex/katex.min.css">
  <!-- 노트 타이포그래피는 제품 패널과 같은 디자인 시스템(#stageDone .note-document)을 그대로 쓴다.
       iframe이라 부모 CSS가 상속되지 않으므로 같은 파일을 여기서도 읽는다. 중복 정의하지 말 것. -->
  <link rel="stylesheet" href="landing/product-panel.css">
  <style>
    /* product-panel.css 가 주지 않는 것만 남긴다: 렌더러 전용 상자(수식·도식), iframe 본문 보정, 인쇄. */
    :root {
      --bg: var(--paper);
      --text: var(--ink);
      --sub: var(--ash);
      --border: var(--rule-solid);
      --code-bg: var(--sunk);
      --accent: var(--brand);
    }
    /* 패널 본문용 body 규칙(flex·여백·배경)을 렌더러 문서에 맞게 되돌린다. */
    body {
      display: block;
      padding: 12px 14px 20px;
      background: var(--paper);
      word-break: break-word;
    }
    #stageDone { display: block; }
    #content { display: flow-root; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--sub); }
    #stageDone .note-document th,
    #stageDone .note-document td {
      border: 1px solid var(--border);
      text-align: center;
      vertical-align: middle;
    }
    #stageDone .note-document th {
      background: var(--code-bg);
      color: var(--ink);
      font-size: 12px;
      text-transform: none;
      letter-spacing: 0;
    }
    /* marked 의 GFM 체크박스 항목 — 랜딩 예시의 복습 질문과 같은 모양. */
    #stageDone .note-document li:has(> input[type="checkbox"]) { list-style: none; }
    .katex-display {
      margin: 14px 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 0;
    }
    .mermaid-box {
      margin: 16px 0;
      padding: 14px 10px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      overflow-x: auto;
      text-align: center;
    }
    .mermaid-box svg {
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
    .empty-notice {
      color: var(--sub);
      text-align: center;
      padding: 40px 12px;
      font-size: 13px;
    }
    .workflow-card {
      margin: 14px 0;
      padding: 14px 16px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      font-size: 12.5px;
      text-align: left;
    }
    .workflow-group { margin-bottom: 12px; }
    .workflow-group:last-child { margin-bottom: 0; }
    .workflow-title {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
      font-size: 13px;
    }
    .workflow-steps {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .workflow-step {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 6px 12px;
      font-weight: 500;
      color: var(--text);
    }
    .workflow-arrow {
      color: var(--sub);
      font-weight: bold;
      user-select: none;
    }
    /* 인쇄. 색은 토큰으로만 두고 다크 여부에 따라 값만 갈아끼운다 — 규칙을 두 벌 쓰지 않기 위해서.
       @page 여백과 본문 여백은 CSS 조건으로 못 나눠서 applyPrintRatio() 가 테마를 보고 만든다. */
    @media print {
      :root {
        --print-bg: #ffffff;
        --print-ink: #111827;
        --print-head: #000000;
        --print-rule: #999999;
        --print-th-bg: #f3f4f6;
        --print-box-bg: #ffffff;
        --print-box-rule: #dddddd;
      }
      :root[data-theme="dark"] {
        --print-bg: #18181B;
        --print-ink: #F4F4F5;
        --print-head: #ffffff;
        --print-rule: #52525B;
        --print-th-bg: #27272A;
        --print-box-bg: #1F1F23;
        --print-box-rule: #3F3F46;
      }
      /* 배경을 실제로 찍으려면 exact 가 필요하다. 없으면 브라우저가 형광펜·표머리 배경을 통째로 빼버린다. */
      html, body {
        margin: 0 !important;
        background: var(--print-bg) !important;
        color: var(--print-ink) !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      h1, h2, h3, h4 {
        color: var(--print-head) !important;
        page-break-after: avoid;
      }
      table, pre, blockquote, .mermaid-box {
        page-break-inside: avoid !important;
      }
      /* 화면에선 표만 가로로 스크롤시키는 래퍼가, 종이에선 넘친 열을 잘라먹는다. */
      #stageDone .note-document .note-table-scroll { overflow: visible !important; }
      #stageDone .note-document table {
        border-collapse: collapse !important;
        width: 100% !important;
        min-width: 0 !important;
        display: table !important;
      }
      /* 화면용 칸 최소 너비(96px)를 그대로 두면 열이 많은 표가 종이 밖으로 나간다. 종이에선 줄바꿈으로 맞춘다. */
      #stageDone .note-document th,
      #stageDone .note-document td {
        min-width: 0 !important;
        border: 1px solid var(--print-rule) !important;
        padding: 6px 10px !important;
      }
      #stageDone .note-document th {
        background-color: var(--print-th-bg) !important;
      }
      #stageDone .note-document mark {
        background-color: var(--brand-highlight) !important;
        color: var(--print-ink) !important;
      }
      /* 콜아웃 바탕도 exact 없이는 통째로 빠진다. 형광펜과 같은 처리. */
      #stageDone .note-document blockquote {
        background-color: var(--brand-subtle) !important;
        color: var(--print-ink) !important;
      }
      .mermaid-box, pre, code {
        background: var(--print-box-bg) !important;
        border-color: var(--print-box-rule) !important;
      }
    }
  </style>
  <script src="lib/vendor/marked.min.js"></script>
  <script src="lib/vendor/katex/katex.min.js"></script>
  <script src="lib/vendor/mermaid/mermaid.min.js"></script>
</head>
<body>
  <div id="stageDone"><div id="content" class="note-document"><div class="empty-notice">노트가 완성되면 서식·수식·다이어그램이 여기에 렌더링됩니다.</div></div></div>
  <script>
    // ==형광펜== — 노트에서 critical 로 표시된 곳(sidepanel.js noteText)만 이 문법으로 온다.
    // marked 인라인 확장으로 넣어야 코드 펜스 안의 == 를 건드리지 않고, 강조 안의 **굵게** 도 같이 렌더된다.
    // 여는 == 뒤와 닫는 == 앞의 공백을 막아 `a == b == c` 같은 비교 연산자는 걸리지 않는다.
    if (typeof marked !== 'undefined' && typeof marked.use === 'function') {
      marked.use({ extensions: [{
        name: 'highlight',
        level: 'inline',
        start(src) { const i = src.indexOf('=='); return i < 0 ? undefined : i; },
        tokenizer(src) {
          const m = /^==(?!\s)([\s\S]+?)(?<!\s)==/.exec(src);
          if (!m) return;
          return { type: 'highlight', raw: m[0], tokens: this.lexer.inlineTokens(m[1]) };
        },
        renderer(token) { return '<mark>' + this.parser.parseInline(token.tokens) + '</mark>'; }
      }] });
    }

    // 용지 비율과 테마는 같은 인쇄 스타일을 만든다. 라이트는 @page 여백을, 다크는 본문 여백을 쓴다 —
    // 다크에서 @page 여백을 남기면 종이 가장자리가 흰 테두리로 남는다(브라우저는 여백에 배경을 찍지 않는다).
    const PRINT_PAGE = {
      'a4': { size: 'A4 portrait', margin: '12mm 15mm', body: '11pt', line: '1.6', h1: '18pt', h2: '14pt', h3: '12pt', table: '10pt', cell: '6px 10px' },
      '16:9': { size: '297mm 167.06mm', margin: '10mm 14mm', body: '10pt', line: '1.55', h1: '16pt', h2: '13pt', h3: '11pt', table: '9.5pt', cell: '5px 8px' },
    };

    let lastPrintRatio = 'a4';

    // 샌드박스 iframe 은 chrome.storage 를 못 읽는다. 테마는 부모가 메시지에 실어 보낸다(lib/theme.js 의 결과값).
    function applyTheme(theme) {
      const dark = theme === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (typeof mermaid !== 'undefined') {
        mermaid.initialize({
          startOnLoad: false,
          theme: dark ? 'dark' : 'default',
          securityLevel: 'loose',
          fontFamily: 'inherit'
        });
      }
      applyPrintRatio(lastPrintRatio); // 인쇄 여백이 테마에 따라 갈린다
    }
    applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

    let renderSeq = 0;

    async function renderMarkdown(markdown) {
      const target = document.getElementById('content');
      if (!markdown || !markdown.trim()) {
        target.innerHTML = '<div class="empty-notice">노트 내용이 없습니다.</div>';
        notifyParentHeight();
        return;
      }

      const curSeq = ++renderSeq;

      // 1. Mermaid code block 추출 및 컨테이너 플레이스홀더 변환
      const mermaidBlocks = [];
      const codeFence = String.fromCharCode(96, 96, 96);
      const mermaidRegex = new RegExp(codeFence + 'mermaid\\s*([\\s\\S]*?)' + codeFence, 'gi');
      let sanitized = markdown.replace(mermaidRegex, (_, code) => {
        const idx = mermaidBlocks.length;
        mermaidBlocks.push(code.trim());
        return '<div class="mermaid-box" id="mermaid-wrap-' + idx + '"></div>';
      });

      // 2. Display Math ($$ ... $$) 플레이스홀더 변환
      const displayMath = [];
      const displayMathRegex = new RegExp('\\$\\$\\s*([\\s\\S]*?)\\s*\\$\\$', 'g');
      sanitized = sanitized.replace(displayMathRegex, (_, math) => {
        const idx = displayMath.length;
        displayMath.push(math.trim());
        return '@@MATH_DISPLAY_' + idx + '@@';
      });

      // 3. Inline Math ($ ... $) 플레이스홀더 변환
      const inlineMath = [];
      const inlineMathRegex = new RegExp('\\$([^$\\n]+)\\$', 'g');
      // 한 줄에 통화 표기가 두 번 나오면($20,000 ... $10) 첫 $부터 둘째 $까지를 통째로 삼켜 그 사이 한글이 수식으로 오염된다.
      // LaTeX 기호가 있으면 수식, 없어도 한글 산문이나 천 단위 콤마(1,234)를 담고 있지 않으면 대부분 수식이다(실측 282건 중 오탐 1건).
      // ponytail: 문자 기반 판별이라 한글이 섞인 백슬래시 없는 수식($합격률$ 등)은 놓친다. 오탐 신고가 오면 넓힌다.
      const looksLikeMath = s => /[\\^_{}]/.test(s) || !(/[가-힣]/.test(s) || /\d,\d/.test(s));
      sanitized = sanitized.replace(inlineMathRegex, (full, math) => {
        if (!looksLikeMath(math)) return full;
        const idx = inlineMath.length;
        inlineMath.push(math.trim());
        return '@@MATH_INLINE_' + idx + '@@';
      });

      // 4. Marked 마크다운 파싱
      let html = marked.parse(sanitized);

      // 5. Math 수식 원복 — 3단계가 이미 무엇이 수식인지 판정했으므로, 여기서는 판정을 다시 하지 않고
      // 렌더링된 KaTeX HTML을 바로 꽂는다. (예전엔 여기서 문자열 $...$로 되돌린 뒤 6단계에서 renderMathInElement가
      // DOM 전체를 다시 스캔해 3단계의 판정을 뒤집었다 — 소비자가 둘이라 하나가 다른 하나를 무효화하던 버그.)
      const renderMathSafe = (src, displayMode) => {
        try {
          return (typeof katex !== 'undefined') ? katex.renderToString(src, { displayMode, throwOnError: false }) : src;
        } catch (err) {
          const esc = String(src || '').replace(/[&<>"'$]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '$': '&#36;' }[m]));
          return displayMode ? '$$' + esc + '$$' : '$' + esc + '$';
        }
      };
      html = html.replace(/@@MATH_DISPLAY_(\d+)@@/g, (_, idx) => renderMathSafe(displayMath[idx] || '', true));
      html = html.replace(/@@MATH_INLINE_(\d+)@@/g, (_, idx) => renderMathSafe(inlineMath[idx] || '', false));

      target.innerHTML = html;

      // 좁은 패널에서 표가 넘치면 문서가 아니라 표만 가로로 스크롤되게 한다.
      // product-panel.css 가 기대하는 래퍼이며, 랜딩 뷰어(note-viewer.js)도 같은 마크업을 만든다.
      for (const table of target.querySelectorAll('table')) {
        const wrap = document.createElement('div');
        wrap.className = 'note-table-scroll';
        table.replaceWith(wrap);
        wrap.append(table);
      }

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
      }

      function sanitizeMermaid(code) {
        if (!code) return '';
        let s = code.trim();
        // 0. gemini-2.5-flash-lite가 첫 줄 전체를 따옴표로 감싸 내보낸다("flowchart TD") — 노드 라벨의 따옴표는 건드리지 않도록 첫 줄만 검사.
        s = s.replace(/^(["'])(.+)\1/, '$2');
        // 1. graph TD -> flowchart TD (subgraph direction 지원)
        s = s.replace(/^graph\s+([A-Za-z]+)/m, 'flowchart $1');
        // 2. subgraph 공백 및 대괄호 문법 보정
        s = s.replace(/^(\s*subgraph\s+)(.+)$/gm, (match, prefix, rest) => {
          rest = rest.trim();
          if (/^"[^"]+"$/.test(rest) || /^\w+\s*\["[^"]+"\]$/.test(rest)) return match;
          const bracketMatch = rest.match(/^(.+?)\s*\[(.*)\]$/);
          if (bracketMatch) {
            const rawId = bracketMatch[1].trim();
            const rawTitle = bracketMatch[2].trim();
            const safeId = rawId.replace(/[^a-zA-Z0-9_]/g, '_');
            const safeTitle = (rawId + (rawTitle ? ' (' + rawTitle + ')' : '')).replace(/"/g, "'");
            return `${prefix}${safeId} ["${safeTitle}"]`;
          }
          if (/\s/.test(rest)) {
            const safeId = rest.replace(/[^a-zA-Z0-9_]/g, '_');
            const safeTitle = rest.replace(/"/g, "'");
            return `${prefix}${safeId} ["${safeTitle}"]`;
          }
          return match;
        });
        // 3. 노드 라벨 따옴표 누락 보정
        s = s.replace(/(\b\w+)\s*\[([^"\n\[\]]+)\]/g, (match, id, label) => {
          if (!label.startsWith('"') && !label.endsWith('"')) {
            const safe = label.replace(/"/g, "'");
            return `${id}["${safe}"]`;
          }
          return match;
        });

        // 4. 라벨 안 홑달러 수식을 mermaid 가 아는 이중달러로 바꾼다.
        // mermaid 번들은 /\$\$(.*)\$\$/g 에 걸리는 것만 KaTeX 로 넘기고, 홑달러는 글자 그대로 남긴다.
        // 1단계에서 mermaid 블록을 먼저 떼어내므로 본문 인라인 수식 처리(3단계)도 이 안을 보지 못한다 —
        // 두 경로 모두에서 새던 자리다.
        // mermaid 는 throwOnError:true 로 KaTeX 를 부르므로 파싱되지 않는 것을 바꾸면 도식 전체가 폴백으로
        // 떨어진다. 그래서 먼저 katex 로 검증하고 통과한 것만 바꾼다.
        // ponytail: mermaid 의 탐지 정규식이 greedy 라 한 줄에 수식이 둘이면 통째로 묶인다. 실사용에서
        // 라벨 한 줄에 수식 둘이 나오는 경우를 못 봤으므로 두고 본다.
        // mermaid 는 라벨을 HTML 이스케이프한 뒤 KaTeX 에 넘긴다. 그래서 수식 안의 < 는 &lt; 가 되어
        // "Expected 'EOF', got '&'" 로 터지고, 그 순간 도식 전체가 폴백으로 떨어진다. 부등호를 미리
        // LaTeX 명령으로 바꿔 이스케이프될 문자를 아예 남기지 않는다.
        const forMermaid = src => src.replace(/(?<!\\)&/g, '\\&').replace(/</g, '\\lt ').replace(/>/g, '\\gt ');
        const mathParses = src => {
          if (typeof katex === 'undefined') return false;
          try { katex.renderToString(src, { throwOnError: true, displayMode: true }); return true; } catch { return false; }
        };
        s = s.replace(/(?<!\$)\$([^$\n]+)\$(?!\$)/g, (full, math) => {
          // 통화 판별은 원문으로, 파싱 검증은 변환 후 문자열로 한다 — mermaid 가 실제로 KaTeX 에 넘기는 게 후자다.
          const src = forMermaid(math.trim());
          return looksLikeMath(math) && mathParses(src) ? '$$' + src + '$$' : full;
        });
        return s;
      }

      function renderFallbackWorkflow(code) {
        const nodeLabels = new Map();
        const nodeRegex = /(\b\w+)\s*\["?(.*?)"?\]/g;
        let m;
        while ((m = nodeRegex.exec(code)) !== null) {
          if (!nodeLabels.has(m[1]) && m[2].trim()) nodeLabels.set(m[1], m[2].trim());
        }
        const subgraphs = [];
        const lines = code.split('\n');
        let curSub = null;
        for (const line of lines) {
          const subMatch = line.match(/subgraph\s+\w+\s*\["?(.*?)"?\]/i) || line.match(/subgraph\s+"?(.*?)"?$/i);
          if (subMatch) {
            curSub = { title: subMatch[1].trim(), steps: [] };
            subgraphs.push(curSub);
          } else if (/^\s*end\b/i.test(line)) {
            curSub = null;
          } else {
            for (const [id, label] of nodeLabels) {
              if (line.includes(id) && curSub && !curSub.steps.includes(label)) curSub.steps.push(label);
            }
          }
        }
        if (!subgraphs.length && nodeLabels.size > 0) {
          subgraphs.push({ title: '단계별 흐름', steps: Array.from(nodeLabels.values()) });
        }
        if (!subgraphs.length) {
          return `<pre style="font-size:11px; text-align:left; background:var(--code-bg); padding:10px; border-radius:6px;">${escapeHtml(code)}</pre>`;
        }
        let html = '<div class="workflow-card">';
        for (const sub of subgraphs) {
          html += `<div class="workflow-group"><div class="workflow-title">📌 ${escapeHtml(sub.title)}</div><div class="workflow-steps">`;
          sub.steps.forEach((step, idx) => {
            if (idx > 0) html += '<span class="workflow-arrow">➔</span>';
            html += `<span class="workflow-step">${escapeHtml(step)}</span>`;
          });
          html += '</div></div>';
        }
        html += '</div>';
        return html;
      }

      // 7. Mermaid 다이어그램 렌더링
      if (typeof mermaid !== 'undefined' && mermaidBlocks.length > 0) {
        for (let i = 0; i < mermaidBlocks.length; i++) {
          if (curSeq !== renderSeq) return;
          const el = document.getElementById('mermaid-wrap-' + i);
          if (el) {
            const rawCode = mermaidBlocks[i];
            const cleanCode = sanitizeMermaid(rawCode);
            try {
              const svgId = 'mermaid-svg-' + curSeq + '-' + i;
              const { svg } = await mermaid.render(svgId, cleanCode);
              el.innerHTML = svg;
            } catch (err) {
              console.warn('Mermaid render error after sanitization:', err);
              // 붉은색 에러 대신 품격있는 카드형 워크플로우로 자동 폴백
              el.innerHTML = renderFallbackWorkflow(cleanCode || rawCode);
            }
          }
        }
      }

      notifyParentHeight();
      requestAnimationFrame(() => notifyParentHeight());
    }

    let lastSentHeight = 0;
    let lastWidth = window.innerWidth;

    function notifyParentHeight() {
      const target = document.getElementById('content');
      if (!target) return;
      const rect = target.getBoundingClientRect();
      const actualHeight = Math.ceil(rect.height + 32);
      const height = Math.max(actualHeight, 140);

      if (Math.abs(height - lastSentHeight) >= 2) {
        lastSentHeight = height;
        window.parent.postMessage({ type: 'RENDER_HEIGHT', height }, '*');
      }
    }

    function applyPrintRatio(ratio) {
      lastPrintRatio = ratio === '16:9' ? '16:9' : 'a4';
      const page = PRINT_PAGE[lastPrintRatio];
      const dark = document.documentElement.dataset.theme === 'dark';
      let styleEl = document.getElementById('print-ratio-style');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'print-ratio-style';
        document.head.appendChild(styleEl);
      }
      document.documentElement.setAttribute('data-print-ratio', lastPrintRatio === '16:9' ? '16-9' : 'a4');
      const wide = lastPrintRatio === '16:9';
      styleEl.textContent = `
        @page {
          size: ${page.size};
          margin: ${dark ? '0' : page.margin};
        }
        @media print {
          body {
            padding: ${dark ? page.margin : '0'} !important;
            font-size: ${page.body} !important;
            line-height: ${page.line} !important;
          }
          h1 {
            font-size: ${page.h1} !important;
            border-bottom: 2px solid var(--print-head) !important;
            margin-top: 0 !important;
            ${wide ? 'padding-bottom: 4px !important;' : ''}
          }
          h2 {
            font-size: ${page.h2} !important;
            border-bottom: 1px solid var(--print-rule) !important;
            ${wide ? 'margin-top: 14px !important; padding-bottom: 3px !important;' : ''}
          }
          h3 {
            font-size: ${page.h3} !important;
            ${wide ? 'margin-top: 10px !important;' : ''}
          }
          table {
            font-size: ${page.table} !important;
            ${wide ? 'margin: 8px 0 !important;' : ''}
          }
          th, td { padding: ${page.cell} !important; }
          ${wide ? `
          .katex-display { margin: 8px 0 !important; }
          .mermaid-box {
            margin: 10px auto !important;
            padding: 8px !important;
            max-height: 105mm !important;
          }
          .mermaid-box svg {
            max-height: 100mm !important;
            width: auto !important;
          }
          pre {
            font-size: 9pt !important;
            padding: 6px 10px !important;
            margin: 8px 0 !important;
          }` : ''}
        }
      `;
    }
    applyPrintRatio('a4');

    window.addEventListener('message', (event) => {
      if (event.data) {
        if (event.data.theme) applyTheme(event.data.theme);
        if (event.data.type === 'THEME') return;
        if (event.data.type === 'RENDER') {
          renderMarkdown(event.data.markdown || '');
        } else if (event.data.type === 'PRINT') {
          if (event.data.ratio) {
            applyPrintRatio(event.data.ratio);
          }
          const executePrint = () => {
            try {
              window.focus();
              window.print();
            } catch (err) {
              console.error('Print execution error:', err);
              window.parent.postMessage({ type: 'PRINT_ERROR', error: String(err && err.message ? err.message : err) }, '*');
            }
          };
          if (typeof event.data.markdown === 'string') {
            renderMarkdown(event.data.markdown).then(() => {
              // 수식(KaTeX) 및 다이어그램(Mermaid) 렌더링 안정화 후 인쇄창 호출
              setTimeout(executePrint, 250);
            });
          } else {
            executePrint();
          }
        }
      }
    });

    window.addEventListener('afterprint', () => {
      window.parent.postMessage({ type: 'PRINT_COMPLETE' }, '*');
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth !== lastWidth) {
        lastWidth = window.innerWidth;
        notifyParentHeight();
      }
    });
    window.parent.postMessage({ type: 'RENDERER_READY' }, '*');
  </script>
</body>
</html>
