<template id="B07"><div class="study-notes" data-asset="B07"><section><span class="role">논증</span><h3>자료가 결론을 어디까지 지지하는가</h3><ol class="chain"><li><strong>01 관찰</strong>가상 자료 A의 응답자는 통근이 편해졌다고 말한다.</li><li class="relation">↓ 지지하는 범위를 한정</li><li><strong>02 해석</strong>이 응답자에게 이동 편의가 개선되었다고 읽을 수 있다.</li><li class="relation">↓ 추가 근거가 필요한 경계</li><li><strong>03 보류</strong>모든 주민의 삶이 개선되었다는 결론은 이 자료만으로 확정할 수 없다.</li></ol></section></div></template>
<template id="B08"><div class="study-notes" data-asset="B08"><section><span class="role apply">적용</span><h3>회의 시간에 늦지 않는 이유</h3><div class="case-box"><h4>이해를 위한 가상 사례</h4><p><span class="point">P1</span>팀은 지각에 대한 감점 규정을 운영한다.</p><p><span class="point">P2</span>한 구성원은 동료에게 신뢰받는 사람으로 보이고 싶어 일찍 도착한다.</p></div><div class="analysis-box"><h4>단서에 근거한 해석</h4><p><span class="point">P1</span>감점 규정은 제도적 제약에 주목하는 설명의 단서다.</p><p><span class="point">P2</span>동료의 기대와 자기 이미지는 상황의 의미에 주목하는 설명의 단서다.</p><p><strong>범위</strong> · 하나의 행동에 여러 설명이 함께 적용될 수 있다.</p></div></section></div></template>
<template id="B09"><div class="study-notes" data-asset="B09"><section class="material-block"><span class="role material">자료 읽기</span><div class="material-inner"><h3>도시 정책을 기록한 자료 A</h3><p class="source">직접 작성한 가상 자료 · 실제 사료나 인용문이 아닙니다.</p><p>자료 요지: 한 주민은 교통망 확충 뒤 통근이 편해졌다고 평가한다. 다른 생활 조건이나 다른 주민의 경험은 제시되지 않는다.</p><div class="interpretation"><h4>해석</h4><p><strong>말할 수 있는 것:</strong> 이 화자가 교통 정책을 이동 편의와 연결해 긍정적으로 평가한다.</p><p><strong>확인할 것:</strong> 화자의 위치, 자료 작성 목적, 다른 주민의 경험이 필요하다.</p></div></div></section></div></template>
<template id="B10"><div class="study-notes" data-asset="B10"><section><span class="role">계산</span><h3>얼마를 팔아야 고정비를 회수하는가?</h3><p class="source">작성 예시 · 단일 제품, 가격·단위 변동비 일정, 판매량 기준</p><div class="equation">손익분기 판매량 = 고정비 ÷ 단위당 공헌이익</div><table class="compare"><thead><tr><th scope="col">항목</th><th scope="col">예시 값</th><th scope="col">의미</th></tr></thead><tbody><tr><th scope="row">가격</th><td>12,000원/개</td><td>판매 1개당 수입</td></tr><tr><th scope="row">변동비</th><td>7,000원/개</td><td>판매 1개당 변동비</td></tr><tr><th scope="row">고정비</th><td>1,000,000원</td><td>분석 기간의 고정비</td></tr></tbody></table><p>공헌이익 = 12,000 − 7,000 = <strong>5,000원/개</strong><br>손익분기 판매량 = 1,000,000 ÷ 5,000 = <strong>200개</strong></p><div class="common">해석 · 예시의 가정 안에서 200개를 판매하면 영업이익이 0원이 된다. 현금 회수 시점과는 구분해야 한다.</div></section></div></template>
<template id="B11"><div class="study-notes" data-asset="B11"><aside class="warning"><h4>[주의] 같은 행동이 같은 원인을 뜻하지는 않는다</h4><p><strong>오해:</strong> 두 사람이 모두 규칙을 지키면 행동의 이유도 같다.</p><p><strong>구분:</strong> 관찰된 행동이 같더라도 제재를 피하려는 이유와 타인의 기대에 응답하려는 이유는 다를 수 있다.</p></aside></div></template>
<template id="B12"><div class="study-notes" data-asset="B12"><div class="with-aside"><aside class="aside-note"><strong>곁설명 · 설명의 초점</strong>같은 현상을 다른 렌즈로 보는 것에 비유할 수 있다. 이 비유만으로 두 이론의 양립 가능성이 증명되는 것은 아니다.</aside><div class="note-body"><h3>비교 전에 질문을 맞춘다</h3><p>이론의 이름이 다르다는 사실보다 어떤 대상을 설명하고 어떤 단서를 사용하는지가 중요하다. 공통 질문을 먼저 적고, 각 이론의 답을 같은 기준으로 나란히 놓는다.</p><p>적용 조건처럼 판단에 필수인 내용은 이 본문에 남긴다.</p></div></div></div></template>
<template id="B13"><div class="study-notes" data-asset="B13"><section class="synthesis"><h3>연결 정리</h3><ol><li><strong>공통:</strong> 두 설명은 같은 조직 행동을 다룰 수 있다.</li><li><strong>차이:</strong> 제도적 조건과 상황의 의미 중 어디에 초점을 두는지가 다르다.</li><li><strong>조건:</strong> 실제 사례에 적용하려면 행동만 아니라 관련 단서도 확인해야 한다.</li></ol></section></div></template>
<template id="B14"><div class="study-notes" data-asset="B14"><section class="review"><span class="role review">점검</span><h3>내 말로 설명해 보기</h3><div class="question"><span class="qno">01</span><div><strong>구분</strong><p>행동이 같다는 사실만으로 두 사람의 행동 이유도 같다고 볼 수 있는가? 이유를 적어 보자.</p><div class="answer-space" aria-hidden="true"></div></div></div><div class="question"><span class="qno">02</span><div><strong>적용</strong><p>감점 규정과 동료의 기대가 함께 있는 사례에서, 두 설명이 각각 주목할 단서를 적어 보자.</p><div class="answer-space" aria-hidden="true"></div></div></div></section></div></template>
<template id="B15"><div class="study-notes" data-asset="B15"><details class="answer"><summary>01번 해설과 답안 기준 보기</summary><div class="answer-content"><p><strong>답:</strong> 행동만으로 이유가 같다고 확정할 수 없다.</p><p><strong>이유:</strong> 제도적 제약과 상황에 부여한 의미가 서로 다를 수 있기 때문이다.</p><p><strong>좋은 답의 조건:</strong> 관찰된 행동과 행동의 설명을 구분하고, 서로 다른 단서를 한 가지 이상 제시한다.</p><p class="source">복습 위치 · 개념 설명 / 사례와 적용</p></div></details></div></template>
