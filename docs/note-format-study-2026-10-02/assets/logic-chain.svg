<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc"><title id="title">관찰에서 판단 범위로</title><desc id="desc">관찰 사실에서 그 사실이 지지하는 해석을 도출하고, 일반화에 필요한 추가 근거를 분리한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#18181B"/></marker></defs><g fill="#F7F7F4" stroke="#DCDCD8"><rect x="20" y="70" width="240" height="130" rx="0"/><rect x="330" y="70" width="240" height="130" rx="0"/><rect x="640" y="70" width="240" height="130" rx="0"/></g><g stroke="#18181B" stroke-width="1" marker-end="url(#arrow)"><path d="M267 135H320"/><path d="M577 135H630"/></g><g text-anchor="middle" font-family="system-ui, -apple-system, Pretendard, Apple SD Gothic Neo, sans-serif" fill="#18181B" font-size="20"><text x="140" y="122">01 관찰 사실</text><text x="450" y="122">02 지지되는 해석</text><text x="760" y="122">03 판단의 경계</text><g font-size="16" fill="#64646D"><text x="140" y="158">자료가 직접 말하는 것</text><text x="450" y="158">왜 이 결론을 지지하나</text><text x="760" y="158">무엇을 더 알아야 하나</text><text x="295" y="57">해석</text><text x="605" y="57">범위 확인</text></g></g></svg>