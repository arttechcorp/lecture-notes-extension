<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc"><title id="title">설명의 초점 분류</title><desc id="desc">규칙 준수라는 질문을 구조와 제도, 상황의 의미라는 두 초점으로 나눈 작성 예시.</desc><g fill="none" stroke="#315d91" stroke-width="2"><path d="M450 90V125H230V160M450 125H670V160"/></g><g fill="#eaf1fa" stroke="#ccd5e1"><rect x="270" y="20" width="360" height="70" rx="4"/><rect x="60" y="160" width="340" height="90" rx="4"/><rect x="500" y="160" width="340" height="90" rx="4"/></g><g fill="#202b3a" text-anchor="middle" font-family="sans-serif" font-size="22"><text x="450" y="64">왜 규칙을 따르는가?</text><text x="230" y="211">구조와 제도</text><text x="670" y="211">상황의 의미</text></g><text x="463" y="121" fill="#536174" font-family="sans-serif" font-size="14">분석 초점의 분류</text></svg>