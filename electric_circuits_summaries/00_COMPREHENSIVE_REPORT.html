    const models = [{"name":"DeepSeek V4 Flash 0731","id":"deepseek/deepseek-v4-flash-0731","slug":"01_deepseek_v4_flash","elapsed":"67.7","charCount":14588,"content":"# DeepSeek V4 Flash 0731 강의 요약 노트\n\n- 모델 ID: `deepseek/deepseek-v4-flash-0731`\n- 소요 시간: 67.7초\n- 생성 글자 수: 14588자\n- 기준 강의 파일: `electric_circuits_note_example.md`\n- 특징: 확실한 그림 자료(Mermaid + SVG) 적용 완료, 제외 내용 완전 제거\n\n---\n\n# DeepSeek V4 Flash 0731 강의 요약 노트\n\n- 모델 ID: `deepseek/deepseek-v4-flash-0731`\n- 소요 시간: 67.7초\n- 생성 글자 수: 14373자\n- 기준 강의 파일: `electric_circuits_note_example.md`\n- 특징: 확실한 그림 자료(Mermaid + SVG) 적용 완료, 제외 내용 완전 제거\n\n---\n\n# 학습 보조 노트: Basic Semiconductor Physics (EEE2050 Lecture 3)\n\n---\n\n## 📌 [시험 전 최우선 요약]\n\n1. **반도체 정의**: 전도체와 절연체 사이의 중간 저항률(resistivity)을 갖는 물질\n2. **에너지 밴드 갭(Eg)**: Silicon ≈ 1.1 eV (전자 볼트) → Si 선호 이유\n3. **밴드(Band)**: 고체 내 전자가 점유 가능한 허용 에너지 상태들의 집합\n4. **전도대(Conduction Band)**: 높은 에너지, 전자가 자유롭게 이동 가능\n5. **원자가대(Valence Band)**: 낮은 에너지, 전자가 완전히 점유\n6. **트랜지스터 정의**: 저항을 변조(modulate)할 수 있는 소자 = Transfer + Resistor\n7. **Si 원자 구조**: 3s²3p² 전자가 SP³ 혼성 오비탈 형성 → 4개의 결합 생성\n8. **정공(Hole)**: 전자가 결합에서 이탈 시 생성되는 빈자리\n9. **항복 전압(Breakdown Voltage)**: Si가 Ge보다 높음 → 높은 신뢰성\n10. **결정질 반도체**: IC 제작에 필수 (전자 거동 예측 가능)\n\n---\n\n## 1. 수업 개요 및 공지사항\n\n| 구분 | 내용 |\n|------|------|\n| **강의 주제** | Basic Semiconductor Physics (반도체 물리 기초) |\n| **진행 방식** | 회로 이론 → 반도체 내부 동작 원리로 전환 |\n| **녹화 강의** | 복습용으로만 업로드, 출석 수업 시 필수 시청 아님 |\n| **보강 강의(Make-up)** | 다음 수업 전 시청 필수 → 출석 인정 |\n\n> **예외 사항**: 국제 학회 참석 등으로 결석 시, 보강 강의를 다음 수업 전까지 시청해야 출석 인정\n\n---\n\n## 2. 에너지 밴드 이론\n\n### 2.1 밴드(Band)의 정의\n- **정의**: 고체 내 전자가 점유할 수 있는 허용 에너지 상태들의 집합\n- **에너지 상태(Energy State)**: 전자가 이용 가능한 상태\n\n### 2.2 에너지 밴드 구조 비교\n\n\n### 📊 [확실한 그림 자료 1] 물질별 에너지 밴드 구조 비교 (Energy Band Diagram)\n> 근거 ID: [07:39], [15:08]~[18:28] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Insulator [\"절연체 (Insulator)\"]\n        direction TB\n        CB1[\"전도대 (Conduction Band)<br/>전자가 거의 없음 (비어있음)\"]\n        GAP1[\"에너지 밴드갭 (Bandgap)<br/>Eg > 5 eV (매우 큼: 전자 이동 불가)\"]\n        VB1[\"원자가대 (Valence Band)<br/>원자핵에 강하게 구속, 전자 가득 참\"]\n        CB1 --- GAP1 --- VB1\n    end\n\n    subgraph Semiconductor [\"반도체 (Semiconductor)\"]\n        direction TB\n        CB2[\"전도대 (Conduction Band)<br/>외부 에너지 공급 시 전자 전이\"]\n        GAP2[\"에너지 밴드갭 (Bandgap)<br/>Eg ≈ 1.1 eV (Si) / 0.67 eV (Ge)\"]\n        VB2[\"원자가대 (Valence Band)<br/>상온에서 전자가 쉽게 이탈 가능\"]\n        CB2 --- GAP2 --- VB2\n    end\n\n    subgraph Conductor [\"도체 (Conductor)\"]\n        direction TB\n        OVL[\"전도대 (CB) & 원자가대 (VB)<br/>서로 겹침 (Overlap, Eg = 0 eV)<br/>상온에서도 무수한 자유전자가 이동\"]\n    end\n\n    style Insulator fill:#1e293b,stroke:#ef4444,stroke-width:2px,color:#fff\n    style Semiconductor fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style Conductor fill:#1e293b,stroke:#10b981,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"260\" viewBox=\"0 0 720 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0;\">\n  <!-- 제목 -->\n  <text x=\"360\" y=\"25\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"15\" font-weight=\"bold\">물질별 에너지 밴드 구조 비교 (Energy Band Structure)</text>\n  \n  <!-- 절연체 -->\n  <g transform=\"translate(40, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"13\" font-weight=\"bold\">절연체 (Insulator)</text>\n    <!-- 전도대 -->\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"35\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"12\">전도대 (Conduction Band)</text>\n    <!-- 밴드갭 화살표 & 레이블 -->\n    <line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"128\" stroke=\"#f87171\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n    <polygon points=\"90,52 86,60 94,60\" fill=\"#f87171\"/>\n    <polygon points=\"90,128 86,120 94,120\" fill=\"#f87171\"/>\n    <rect x=\"45\" y=\"80\" width=\"90\" height=\"22\" rx=\"3\" fill=\"#450a0a\" stroke=\"#ef4444\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"95\" text-anchor=\"middle\" fill=\"#fca5a5\" font-size=\"11\" font-weight=\"bold\">Eg > 5 eV (거대함)</text>\n    <!-- 원자가대 -->\n    <rect x=\"10\" y=\"130\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"155\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"12\">원자가대 (Valence Band)</text>\n  </g>\n\n  <!-- 반도체 -->\n  <g transform=\"translate(270, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\">반도체 (Semiconductor)</text>\n    <!-- 전도대 -->\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"35\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"12\">전도대 (Conduction Band)</text>\n    <!-- 밴드갭 화살표 & 레이블 -->\n    <line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"88\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n    <polygon points=\"90,52 86,58 94,58\" fill=\"#38bdf8\"/>\n    <polygon points=\"90,88 86,82 94,82\" fill=\"#38bdf8\"/>\n    <rect x=\"40\" y=\"60\" width=\"100\" height=\"22\" rx=\"3\" fill=\"#082f49\" stroke=\"#38bdf8\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"75\" text-anchor=\"middle\" fill=\"#7dd3fc\" font-size=\"11\" font-weight=\"bold\">Eg ≈ 1.1 eV (Si)</text>\n    <!-- 원자가대 -->\n    <rect x=\"10\" y=\"90\" width=\"160\" height=\"80\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"135\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"12\">원자가대 (Valence Band)</text>\n  </g>\n\n  <!-- 전도체 -->\n  <g transform=\"translate(500, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\">도체 (Conductor)</text>\n    <!-- 겹침 밴드 -->\n    <rect x=\"10\" y=\"20\" width=\"160\" height=\"150\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n    <rect x=\"10\" y=\"60\" width=\"160\" height=\"40\" fill=\"#047857\" opacity=\"0.6\"/>\n    <text x=\"90\" y=\"45\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"12\">전도대 (CB)</text>\n    <text x=\"90\" y=\"83\" text-anchor=\"middle\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\">Overlap (Eg = 0 eV)</text>\n    <text x=\"90\" y=\"145\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"12\">원자가대 (VB)</text>\n  </g>\n</svg>\n</div>\n\n\n| 물질 유형 | 밴드 갭 크기 | 전도 특성 |\n|-----------|-------------|-----------|\n| 절연체(Insulator) | 매우 큼(Huge) | 전도 어려움 |\n| 반도체(Semiconductor) | 중간 (~1.1 eV) | 제어 가능한 전도 |\n| 전도체(Conductor) | 없음(0) | 자유 전도 |\n\n### 2.3 전자의 구속 상태\n- **원자핵 근접 전자**: 인력(Attraction force) > 반발력 → 강하게 결속\n- **원자핵 원거리 전자**: 인력 ≈ 반발력 (평형) → 약하게 결속\n- **원자가대(VB)**: 전자가 완전히 점유 (Full)\n- **전도대(CB)**: 초기 전자 없음 → 전류 흐름 없음\n\n### 2.4 전도 메커니즘\n- 외부 에너지 인가 → 원자가대 전자가 전도대로 이동\n- 전도대에서 전자는 자유롭게 이동 가능 → 전류 흐름 발생\n- **절연체**: 밴드 갭이 매우 커서 전도 어려움\n- **전도체**: 밴드 갭 없음 → 항상 전도 가능\n\n---\n\n## 3. 반도체 물성 (Property of Semiconductor)\n\n### 3.1 저항률(Resistivity) 기준 분류\n\n| 구분 | 저항률 |\n|------|--------|\n| 전도체(Conductor) | 낮음 (Low) |\n| 절연체(Insulator) | 높음 (High) |\n| 반도체(Semiconductor) | 중간 (Intermediate) |\n\n### 3.2 결정 구조\n\n```\n단결정(Crystalline)  다결정(Polycrystalline)  비정질(Amorphous)\n   [규칙적 배열]       [결정립 + 결정립계]        [불규칙 배열]\n```\n\n- **결정(Crystal)**: 원자가 잘 조직된 구조\n- **다결정**: 여러 결정 구조가 결합 (경계 = 결정립계, Grain Boundary)\n- **결정립계(Grain Boundary)**: 서로 다른 결정립(grain) 사이의 경계\n\n### 3.3 결정 구조의 중요성\n- **IC 제작 필수 조건**: 단결정 실리콘 필요\n- **최신 기술**: 수 나노미터(nm) 수준 (수십 nm 이하)\n- **비정질 실리콘 문제**: 원자 배열 불규칙 → 전자 거동 예측 불가능\n- **예외**: 최근 비정질 반도체도 상업적으로 중요해짐\n\n---\n\n## 4. 반도체 재료 분류\n\n### 4.1 주기율표 기준 분류 (전기공학 관점)\n\n| 족(Group) | 원소 | 특징 |\n|-----------|------|------|\n| 4족 (대표) | Si, Ge | 단일 원소 반도체 |\n| 3족 | (화합물 구성) | 3-5족 화합물 반도체 (예: GaAs) |\n| 5족 | (화합물 구성) | 3-5족 화합물 반도체 |\n| 2족 | (화합물 구성) | 2-6족 화합물 반도체 |\n| 6족 | (화합물 구성) | 2-6족 화합물 반도체 |\n\n> **참고**: 현대 화학에서는 '14족'이지만, 반도체 산업에서는 '4족'으로 표기 (전기공학 관례)\n\n### 4.2 주요 반도체 재료\n\n| 재료 | 용도/특징 |\n|------|-----------|\n| **Silicon (Si)** | 대표적 반도체, 현대 반도체 산업의 주축 |\n| **Germanium (Ge)** | 최초 트랜지스터에 사용, 이후 문제로 Si로 대체 |\n| **GaAs** | SpaceX 위성 태양전지(고성능 솔라셀)에 사용 |\n| **Carbon (C)** | 논란 있음 → 수업에서 제외 |\n\n### 4.3 Silicon vs Germanium (Si 선호 이유)\n\n| 비교 항목 | Silicon (Si) | Germanium (Ge) |\n|-----------|--------------|----------------|\n| **밴드 갭** | 더 큼 (안정적 제어) | 작음 |\n| **전류 제어** | 용이 | 어려움 (항복 쉽게 발생) |\n| **가격** | 저렴 | 비쌈 |\n| **항복 전압** | 높음 (신뢰성 ↑) | 낮음 |\n\n> **핵심**: Si는 밴드 갭이 더 커서 전류 제어가 용이하고, 온도 변화에 따른 누설 전류가 적음\n\n---\n\n## 5. 트랜지스터의 의미\n\n### 5.1 어원\n- **Transfer(전달) + Resistor(저항)** = Transistor\n- **정의**: 자체 저항을 변조(modulate)할 수 있는 소자\n\n### 5.2 동작 원리\n- I-V 곡선에서 기울기(저항)가 인가 전압에 따라 변화\n- 스위치 역할: On/Off 상태를 명확히 정의 가능\n\n### 5.3 반도체의 중요성\n- 트랜지스터, 다이오드 = 스위치로 사용\n- 스위치의 On/Off 명확성이 핵심 → 온도 영향 최소화 필요\n- **온도 영향**: 높은 온도에서 Si는 열적으로 여기된 전자로 인해 누설 전류 발생 가능\n\n---\n\n## 6. SiO₂ (실리콘 산화막)\n\n- **특성**: 절연체(Insulator)\n- **용도**: 커패시터(Capacitor) 제작 → 트랜지스터 구현의 핵심\n- **재료 가치**: Si 단독만으로도 유용한 소자 제작 가능 (SiO₂ 형성 용이)\n\n---\n\n## 7. 실리콘 원자 구조와 SP³ 혼성 오비탈\n\n### 7.1 전자 배치\n- **Si 원자**: 원자번호 14\n- **전자 배치**: 1s² 2s² 2p⁶ 3s² 3p²\n\n```\n핵(Nucleus)\n  ┌─ 1s² (내부 껍질)\n  ├─ 2s² 2p⁶ (내부 껍질)\n  └─ 3s² 3p² (최외각 전자 4개) ← 원자핵에서 멀리 떨어짐\n```\n\n### 7.2 SP³ 혼성 오비탈의 형성\n- **3s²와 3p² 에너지 준위**: 거의 동일 (에너지 차이 미미)\n- **결과**: 4개의 동일한 에너지 상태 = SP³ 혼성 오비탈\n- **특징**: 최외각 전자가 원자핵에서 멀리 떨어져 있어 약한 결속력\n\n### 7.3 실리콘 격자 구조\n\n```\nSi ─ Si ─ Si     (단일 결정 실리콘)\n │    │    │\nSi ─ Si ─ Si     (4면체 결합 구조)\n │    │    │\nSi ─ Si ─ Si\n```\n\n- 각 Si 원자는 4개의 Si 원자와 공유결합 형성\n- 결합선 = 공유 결합 (SPS 혼성 오비탈)\n- 모든 원자 결합 시: 고체(Solid) 형성\n\n---\n\n## 8. 전자-정공 쌍 생성\n\n### 8.1 에너지 인가 과정\n1. Si 원자들은 결합 형성 → 고체 상태\n2. 외부 에너지(열, 빛 등) 인가\n3. 결합에서 전자가 이탈\n\n### 8.2 생성 과정 전개\n\n\n### 📊 [확실한 그림 자료 4] 실리콘 공유결합 격자 및 전자-정공 쌍(EHP) 생성 메커니즘\n> 근거 ID: [44:28]~[53:08], [50:07] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Step1 [\"(a) 상온 이전: 완전한 공유결합 상태 (Covalent Bonds)\"]\n        S1[\"Si 원자 (최외각 4개 전자, sp³ 혼성 오비탈)<br/>인접한 4개 Si 원자와 2개씩 전자 공유하여 결합<br/>원자 밀도: 5 × 10²² atoms/cm³ | 자유전자 없음\"]\n    end\n\n    subgraph Step2 [\"(b) 외부 에너지 인가 (Thermal Energy / T 상승)\"]\n        S2[\"열 진동에 의해 Si-Si 공유결합 파괴 (Bond Broken)\"]\n    end\n\n    subgraph Step3 [\"(c) 캐리어 쌍 동시 생성 (Carrier Pair Generation)\"]\n        S3A[\"자유 전자 (Free Electron)<br/>결합에서 빠져나와 전도대로 이동<br/>전류 전도 기여\"]\n        S3B[\"정공 (Hole, 빈자리)<br/>전자가 빠져나간 빈 공간<br/>양전하 캐리어로 거동\"]\n    end\n\n    Step1 --> Step2\n    Step2 --> S3A\n    Step2 --> S3B\n\n    style Step1 fill:#0f172a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style Step2 fill:#0f172a,stroke:#f59e0b,stroke-width:1.5px,color:#fff\n    style Step3 fill:#0f172a,stroke:#10b981,stroke-width:1.5px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"230\" viewBox=\"0 0 720 230\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0;\">\n  <text x=\"360\" y=\"24\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"15\" font-weight=\"bold\">실리콘 격자의 전자-정공 쌍(EHP) 생성 메커니즘</text>\n\n  <!-- (a) 완전 공유 결합 격자 -->\n  <g transform=\"translate(40, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"280\" height=\"170\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.2\"/>\n    <text x=\"140\" y=\"22\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\">(a) 완전 공유결합 격자 (저온)</text>\n    \n    <!-- 격자선 -->\n    <path d=\"M60,60 H220 M60,105 H220 M60,150 H220 M60,60 V150 M140,60 V150 M220,60 V150\" stroke=\"#475569\" stroke-width=\"2\"/>\n    \n    <!-- 원자들 -->\n    <g fill=\"#0284c7\">\n      <circle cx=\"60\" cy=\"60\" r=\"14\"/><text x=\"60\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"140\" cy=\"60\" r=\"14\"/><text x=\"140\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"220\" cy=\"60\" r=\"14\"/><text x=\"220\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"60\" cy=\"105\" r=\"14\"/><text x=\"60\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"140\" cy=\"105\" r=\"14\"/><text x=\"140\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"220\" cy=\"105\" r=\"14\"/><text x=\"220\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n    </g>\n    <!-- 공유 전자쌍 -->\n    <g fill=\"#93c5fd\">\n      <circle cx=\"100\" cy=\"60\" r=\"3\"/><circle cx=\"100\" cy=\"105\" r=\"3\"/>\n      <circle cx=\"180\" cy=\"60\" r=\"3\"/><circle cx=\"180\" cy=\"105\" r=\"3\"/>\n      <circle cx=\"140\" cy=\"82\" r=\"3\"/><circle cx=\"60\" cy=\"82\" r=\"3\"/><circle cx=\"220\" cy=\"82\" r=\"3\"/>\n    </g>\n  </g>\n\n  <!-- (b) 열에너지 공급 시 결합 파괴 및 생성 -->\n  <g transform=\"translate(400, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"280\" height=\"170\" rx=\"6\" fill=\"#1e293b\" stroke=\"#10b981\" stroke-width=\"1.2\"/>\n    <text x=\"140\" y=\"22\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"12\" font-weight=\"bold\">(b) 열에너지(kT) 공급 시 EHP 생성</text>\n    \n    <!-- 격자선 -->\n    <path d=\"M60,60 H220 M60,105 H220 M60,150 H220 M60,60 V150 M140,60 V150 M220,60 V150\" stroke=\"#475569\" stroke-width=\"2\"/>\n\n    <!-- 원자들 -->\n    <g fill=\"#0284c7\">\n      <circle cx=\"60\" cy=\"60\" r=\"14\"/><text x=\"60\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"140\" cy=\"60\" r=\"14\"/><text x=\"140\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"220\" cy=\"60\" r=\"14\"/><text x=\"220\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"60\" cy=\"105\" r=\"14\"/><text x=\"60\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"140\" cy=\"105\" r=\"14\"/><text x=\"140\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"220\" cy=\"105\" r=\"14\"/><text x=\"220\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n    </g>\n    <!-- 결합 파괴 및 전자 이탈 -->\n    <circle cx=\"100\" cy=\"60\" r=\"6\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"2\" stroke-dasharray=\"2\"/>\n    <text x=\"100\" y=\"50\" text-anchor=\"middle\" fill=\"#f87171\" font-size=\"9\" font-weight=\"bold\">정공(Hole)</text>\n    \n    <!-- 이탈한 전자 -->\n    <circle cx=\"115\" cy=\"85\" r=\"6\" fill=\"#fbbf24\"/>\n    <text x=\"115\" y=\"89\" text-anchor=\"middle\" fill=\"#000\" font-size=\"8\" font-weight=\"bold\">e⁻</text>\n    <path d=\"M102,64 Q108,75 115,82\" stroke=\"#fbbf24\" stroke-width=\"1.5\" stroke-dasharray=\"2\"/>\n    <text x=\"155\" y=\"90\" fill=\"#fde047\" font-size=\"9\" font-weight=\"bold\">자유전자 (Free e⁻)</text>\n    \n    <text x=\"140\" y=\"155\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"11\" font-weight=\"bold\">생성 법칙: n (자유전자 수) = p (정공 수)</text>\n  </g>\n</svg>\n</div>\n\n\n- **자유 전자**: Si 격자 내에서 자유롭게 이동 가능\n- **정공(Hole)**: 전자가 이탈한 빈자리 → 양전하 띈 입자처럼 동작\n\n> **핵심 규칙**: 전자 생성 시 항상 정공도 함께 생성 (쌍 생성, Pair Generation)\n\n---\n\n## 9. 시험 예상 핵심 질문\n\n1. **\"왜 Silicon이 Germanium보다 선호되는가?\"**\n   - 밴드 갭이 더 큼 → 전류 제어 용이\n   - 저렴한 가격\n   - 높은 항복 전압 (신뢰성)\n\n2. **\"트랜지스터의 정의는?\"**\n   - 저항을 변조할 수 있는 소자 (Transfer + Resistor)\n\n3. **\"밴드(Band)란?\"**\n   - 고체 내 전자가 점유 가능한 허용 에너지 상태들의 집합\n\n4. **\"정공(Hole)이란?\"**\n   - 전자가 결합에서 이탈할 때 생성되는 빈자리 (항상 전자와 쌍으로 생성)\n\n5. **\"왜 단결정 실리콘이 필요한가?\"**\n   - 비정질이면 전자 거동 예측 불가 → IC 제작 불가\n\n6. **\"Si의 밴드 갭 값은?\"**\n   - 약 1.1 eV (전자 볼트)\n\n---\n\n## 📋 주요 공식 및 수치 요약\n\n| 항목 | 값/식 | 비고 |\n|------|-------|------|\n| Si 밴드 갭 | Eg ≈ 1.1 eV | 시험 암기 필수 |\n| 전자 배치 (Si) | 1s² 2s² 2p⁶ 3s² 3p² | 최외각 4개 = SP³ |\n| 저항 분류 | Low→전도체 / High→절연체 / 중간→반도체 | |\n| 트랜지스터 어원 | Transfer + Resistor | 정의 이해 |\n\n---\n"},{"name":"Qwen3.5 122B-A10B","id":"qwen/qwen3.5-122b-a10b","slug":"02_qwen3.5_122b","elapsed":"19.7","charCount":34758,"content":"# Qwen3.5 122B-A10B 강의 요약 노트\n\n- 모델 ID: `qwen/qwen3.5-122b-a10b`\n- 소요 시간: 19.7초\n- 생성 글자 수: 34758자\n- 기준 강의 파일: `electric_circuits_note_example.md`\n- 특징: 확실한 그림 자료(Mermaid + SVG) 적용 완료, 제외 내용 완전 제거\n\n---\n\n# Qwen3.5 122B-A10B 강의 요약 노트\n\n- 모델 ID: `qwen/qwen3.5-122b-a10b`\n- 소요 시간: 19.7초\n- 생성 글자 수: 18519자\n- 기준 강의 파일: `electric_circuits_note_example.md`\n- 특징: 확실한 그림 자료(Mermaid + SVG) 적용 완료, 제외 내용 완전 제거\n\n---\n\n# EEE2050 Lecture 3: Basic Semiconductor Physics (핵심 요약)\n\n### 📌 핵심 결론 및 시험 중요 포인트\n1.  **반도체의 정의**: 전도도 (Conductivity) 가 도체와 부도체 사이이며, 에너지 밴드갭 ($E_g$) 이 약 $1 \\sim 3 \\text{ eV}$인 물질. 실리콘 ($Si$) 의 경우 $E_g \\approx 1.1 \\text{ eV}$.\n2.  **전하 캐리어 생성 원리**: 열에너지 등 외부 에너지를 가해 공유결합을 끊으면 **자유 전자 (Free Electron)**와 정공 (Hole) 이 쌍으로 생성됨. 이때 $n = p$ (본질 반도체).\n3.  **실리콘 ($Si$) 이 게르마늄 ($Ge$) 보다 선호되는 이유 (시험 단골):**\n    *   더 넓은 밴드갭 ($1.12 \\text{ eV}$ vs $0.67 \\text{ eV}$) $\\rightarrow$ 오프 전류 (Leakage current) 작음, 스위칭 특성 우수.\n    *   고온에서 안정적 (Ge 는 고온에서 결정 파괴).\n    *   높은 항복 전압 (Breakdown voltage).\n    *   **가장 중요:** 자연 산화물 ($SiO_2$) 형성 가능 $\\rightarrow$ 우수한 절연체 역할 및 트랜지스터 제조에 필수.\n    *   가격 저렴.\n4.  **결정 구조 중요성**: 집적회로 (IC) 제조에는 원자가 규칙적으로 배열된 **단결정 (Crystalline)** 구조가 필수. 비정질 (Amorphous) 또는 다결정 (Polycrystalline) 은 전자 이동 예측이 어려움.\n\n---\n\n### 📘 상세 학습 노트\n\n#### 1. 물질 분류 및 에너지 밴드 이론\n*   **근거 ID**: [07:09] ~ [18:28], [07:39]\n*   **중요도**: `핵심`\n\n**에너지 밴드 (Energy Band) 개념**\n고체 내 전자가 점유할 수 있는 허용된 에너지 상태들의 집합.\n*   **원자핵과의 거리**:\n    *   **원자가 밴드 (Valence Band)**: 핵에 강하게 결합된 전자들이 채워진 낮은 에너지 준위. 전자가 가득 차 있음 (Full).\n    *   **전도 밴드 (Conduction Band)**: 핵으로부터 멀리 떨어진 loosely bound 전자들이 존재하는 높은 에너지 준위. 초기에는 비어 있음 (Empty). 전류 흐름과 직결됨.\n*   **밴드갭 (Band Gap, $E_g$)**: 전도 밴드 하단과 원자가 밴드 상단 사이의 에너지 차이. **이 영역에는 전자가 존재할 수 있는 상태가 없음.**\n\n| 물질 유형 | 밴드갭 ($E_g$) 특징 | 전도성 설명 |\n| :--- | :--- | :--- |\n| **부도체 (Insulator)** | 매우 큼 ($> 5 \\text{ eV}$) | 전자가 전도대로 이동하기 어려워 전류가 흐르지 않음. |\n| **반도체 (Semiconductor)** | 중간 ($\\approx 1 \\sim 3 \\text{ eV}$) | 적절한 에너지 (열, 빛 등) 를 가하면 전자가 전도대로 넘어갈 수 있음. |\n| **도체 (Conductor)** | 없음 (겹침) | 전도대와 원자가대가 겹쳐 있어 전자가 자유롭게 이동함. |\n\n> **직관적 의미**: 전자가 \"집 (원자가 밴드)\"에서 \"거리 (전도 밴드)\"로 나가려면 일정 금액 (에너지, $E_g$) 을 지불해야 한다. 부도체는 비용이 너무 비싸서 못 나가고, 도체는 문이 없거나 이미 밖으로 나와 있으며, 반도체는 적당한 비용을 내면 나갈 수 있다.\n\n\n\n### 📊 [확실한 그림 자료 1] 물질별 에너지 밴드 구조 비교 (Energy Band Diagram)\n> 근거 ID: [07:39], [15:08]~[18:28] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Insulator [\"절연체 (Insulator)\"]\n        direction TB\n        CB1[\"전도대 (Conduction Band)<br/>전자가 거의 없음 (비어있음)\"]\n        GAP1[\"에너지 밴드갭 (Bandgap)<br/>Eg > 5 eV (매우 큼: 전자 이동 불가)\"]\n        VB1[\"원자가대 (Valence Band)<br/>원자핵에 강하게 구속, 전자 가득 참\"]\n        CB1 --- GAP1 --- VB1\n    end\n\n    subgraph Semiconductor [\"반도체 (Semiconductor)\"]\n        direction TB\n        CB2[\"전도대 (Conduction Band)<br/>외부 에너지 공급 시 전자 전이\"]\n        GAP2[\"에너지 밴드갭 (Bandgap)<br/>Eg ≈ 1.1 eV (Si) / 0.67 eV (Ge)\"]\n        VB2[\"원자가대 (Valence Band)<br/>상온에서 전자가 쉽게 이탈 가능\"]\n        CB2 --- GAP2 --- VB2\n    end\n\n    subgraph Conductor [\"도체 (Conductor)\"]\n        direction TB\n        OVL[\"전도대 (CB) & 원자가대 (VB)<br/>서로 겹침 (Overlap, Eg = 0 eV)<br/>상온에서도 무수한 자유전자가 이동\"]\n    end\n\n    style Insulator fill:#1e293b,stroke:#ef4444,stroke-width:2px,color:#fff\n    style Semiconductor fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style Conductor fill:#1e293b,stroke:#10b981,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"260\" viewBox=\"0 0 720 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0;\">\n  <!-- 제목 -->\n  <text x=\"360\" y=\"25\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"15\" font-weight=\"bold\">물질별 에너지 밴드 구조 비교 (Energy Band Structure)</text>\n  \n  <!-- 절연체 -->\n  <g transform=\"translate(40, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"13\" font-weight=\"bold\">절연체 (Insulator)</text>\n    <!-- 전도대 -->\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"35\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"12\">전도대 (Conduction Band)</text>\n    <!-- 밴드갭 화살표 & 레이블 -->\n    <line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"128\" stroke=\"#f87171\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n    <polygon points=\"90,52 86,60 94,60\" fill=\"#f87171\"/>\n    <polygon points=\"90,128 86,120 94,120\" fill=\"#f87171\"/>\n    <rect x=\"45\" y=\"80\" width=\"90\" height=\"22\" rx=\"3\" fill=\"#450a0a\" stroke=\"#ef4444\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"95\" text-anchor=\"middle\" fill=\"#fca5a5\" font-size=\"11\" font-weight=\"bold\">Eg > 5 eV (거대함)</text>\n    <!-- 원자가대 -->\n    <rect x=\"10\" y=\"130\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"155\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"12\">원자가대 (Valence Band)</text>\n  </g>\n\n  <!-- 반도체 -->\n  <g transform=\"translate(270, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\">반도체 (Semiconductor)</text>\n    <!-- 전도대 -->\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"35\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"12\">전도대 (Conduction Band)</text>\n    <!-- 밴드갭 화살표 & 레이블 -->\n    <line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"88\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n    <polygon points=\"90,52 86,58 94,58\" fill=\"#38bdf8\"/>\n    <polygon points=\"90,88 86,82 94,82\" fill=\"#38bdf8\"/>\n    <rect x=\"40\" y=\"60\" width=\"100\" height=\"22\" rx=\"3\" fill=\"#082f49\" stroke=\"#38bdf8\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"75\" text-anchor=\"middle\" fill=\"#7dd3fc\" font-size=\"11\" font-weight=\"bold\">Eg ≈ 1.1 eV (Si)</text>\n    <!-- 원자가대 -->\n    <rect x=\"10\" y=\"90\" width=\"160\" height=\"80\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"135\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"12\">원자가대 (Valence Band)</text>\n  </g>\n\n  <!-- 전도체 -->\n  <g transform=\"translate(500, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\">도체 (Conductor)</text>\n    <!-- 겹침 밴드 -->\n    <rect x=\"10\" y=\"20\" width=\"160\" height=\"150\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n    <rect x=\"10\" y=\"60\" width=\"160\" height=\"40\" fill=\"#047857\" opacity=\"0.6\"/>\n    <text x=\"90\" y=\"45\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"12\">전도대 (CB)</text>\n    <text x=\"90\" y=\"83\" text-anchor=\"middle\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\">Overlap (Eg = 0 eV)</text>\n    <text x=\"90\" y=\"145\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"12\">원자가대 (VB)</text>\n  </g>\n</svg>\n</div>\n\n\n\n### 📊 [확실한 그림 자료 1] 물질별 에너지 밴드 구조 비교 (Energy Band Diagram)\n> 근거 ID: [07:39], [15:08]~[18:28] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Insulator [\"절연체 (Insulator)\"]\n        direction TB\n        CB1[\"전도대 (Conduction Band)<br/>전자가 거의 없음 (비어있음)\"]\n        GAP1[\"에너지 밴드갭 (Bandgap)<br/>Eg: 5 eV 초과 (거대한 금지대)\"]\n        VB1[\"원자가대 (Valence Band)<br/>원자핵에 구속, 전자 가득 참\"]\n        CB1 --- GAP1\n        GAP1 --- VB1\n    end\n\n    subgraph Semiconductor [\"반도체 (Semiconductor)\"]\n        direction TB\n        CB2[\"전도대 (Conduction Band)<br/>외부 에너지 공급 시 전자 전이\"]\n        GAP2[\"에너지 밴드갭 (Bandgap)<br/>Eg 약 1.1 eV (Si) / 0.67 eV (Ge)\"]\n        VB2[\"원자가대 (Valence Band)<br/>상온에서 전자가 쉽게 이탈 가능\"]\n        CB2 --- GAP2\n        GAP2 --- VB2\n    end\n\n    subgraph Conductor [\"도체 (Conductor)\"]\n        direction TB\n        OVL[\"전도대 (CB) & 원자가대 (VB)<br/>서로 겹침 (Overlap, Eg = 0 eV)<br/>상온에서도 무수한 자유전자 이동\"]\n    end\n\n    style CB1 fill:#1e3a8a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style GAP1 fill:#450a0a,stroke:#ef4444,stroke-width:1.5px,color:#fff\n    style VB1 fill:#312e81,stroke:#818cf8,stroke-width:1.5px,color:#fff\n    style CB2 fill:#1e3a8a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style GAP2 fill:#082f49,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style VB2 fill:#312e81,stroke:#818cf8,stroke-width:1.5px,color:#fff\n    style OVL fill:#064e3b,stroke:#34d399,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\" style=\"margin: 16px 0; page-break-inside: avoid;\">\n<svg width=\"100%\" height=\"auto\" viewBox=\"0 0 720 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:720px; display:block; margin:0 auto; background:#0f172a; border-radius:8px; border:1px solid #334155;\">\n  <rect width=\"100%\" height=\"100%\" fill=\"#0f172a\" rx=\"8\"/>\n  <text x=\"360\" y=\"26\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"14\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">물질별 에너지 밴드 구조 비교 (Energy Band Structure)</text>\n  <g transform=\"translate(40, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">절연체 (Insulator)</text>\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"33\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (Conduction Band)</text>\n    <line x1=\"90\" y1=\"48\" x2=\"90\" y2=\"122\" stroke=\"#f87171\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n    <polygon points=\"90,48 86,56 94,56\" fill=\"#f87171\"/>\n    <polygon points=\"90,122 86,114 94,114\" fill=\"#f87171\"/>\n    <rect x=\"42\" y=\"75\" width=\"96\" height=\"20\" rx=\"3\" fill=\"#450a0a\" stroke=\"#ef4444\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"89\" text-anchor=\"middle\" fill=\"#fca5a5\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Eg &gt; 5 eV (매우 큼)</text>\n    <rect x=\"10\" y=\"125\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"148\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (Valence Band)</text>\n  </g>\n  <g transform=\"translate(270, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">반도체 (Semiconductor)</text>\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"33\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (Conduction Band)</text>\n    <line x1=\"90\" y1=\"48\" x2=\"90\" y2=\"82\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n    <polygon points=\"90,48 86,54 94,54\" fill=\"#38bdf8\"/>\n    <polygon points=\"90,82 86,76 94,76\" fill=\"#38bdf8\"/>\n    <rect x=\"36\" y=\"56\" width=\"108\" height=\"20\" rx=\"3\" fill=\"#082f49\" stroke=\"#38bdf8\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"70\" text-anchor=\"middle\" fill=\"#7dd3fc\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Eg ≈ 1.1 eV (Si)</text>\n    <rect x=\"10\" y=\"85\" width=\"160\" height=\"76\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"130\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (Valence Band)</text>\n  </g>\n  <g transform=\"translate(500, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">도체 (Conductor)</text>\n    <rect x=\"10\" y=\"15\" width=\"160\" height=\"146\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n    <rect x=\"10\" y=\"55\" width=\"160\" height=\"36\" fill=\"#047857\" opacity=\"0.6\"/>\n    <text x=\"90\" y=\"40\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (CB)</text>\n    <text x=\"90\" y=\"77\" text-anchor=\"middle\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Overlap (Eg = 0 eV)</text>\n    <text x=\"90\" y=\"135\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (VB)</text>\n  </g>\n</svg>\n</div>\n\n#### 2. 반도체 물질의 종류 및 결정 구조\n*   **근거 ID**: [20:08] ~ [27:08], [27:19]\n*   **중요도**: `중요`\n\n**결정 구조 (Crystal Structure)**\n*   **단결정 (Crystalline)**: 원자가 완벽하게 규칙적으로 배열됨. 전자 거동 예측이 용이하여 IC(칩) 제조에 필수.\n*   **비정질 (Amorphous)**: 원자 배열이 무질서함.\n*   **다결정 (Polycrystalline)**: 여러 작은 결정립 (Grain) 이 모여있으며, 그 사이에 **결정립계 (Grain Boundary)**가 존재함.\n    *   *주의*: 현대 나노 공정 (예: 3nm) 에서는 원자 배열의 불규칙성이 전자 이동을 방해하므로 단결정 실리콘이 필수임.\n\n**주요 반도체 물질 (Periodic Table 기준)**\n*   **원소 반도체 (Elemental)**: Group 4 (화학에서는 Group 14).\n    *   **Silicon (Si)**: 가장 대표적.\n    *   **Germanium (Ge)**: 최초의 트랜지스터 재료였으나 현재는 사용 제한적.\n    *   Carbon (C): 반도체로 잘 쓰이지 않음 (다이아몬드 형태는 부도체 성향).\n*   **화합물 반도체 (Compound)**:\n    *   III-V족 (GaAs, InP), II-VI족 (CdTe) 등.\n    *   예: SpaceX 위성의 고효율 태양전지는 화합물 반도체 기반.\n\n\n\n### 📊 [확실한 그림 자료 2] 반도체 결정 구조의 3가지 형태 (Crystal Structures)\n> 근거 ID: [20:08], [22:28]~[26:28] `핵심`\n\n```mermaid\nflowchart LR\n    subgraph Crystalline [\"단결정 (Crystalline)\"]\n        direction TB\n        C_DESC[\"• 원자들의 완벽한 주기적 배열<br/>• 결함 및 불연속성 없음<br/>• 전자 이동 거동 정확히 예측 가능<br/>• 최신 3nm 집적회로(IC) 제작에 필수\"]\n    end\n\n    subgraph Polycrystalline [\"다결정 (Polycrystalline)\"]\n        direction TB\n        P_DESC[\"• 여러 개의 작은 단결정립(Grain) 집합체<br/>• 결정립 간 경계: 결정립계(Grain Boundary)<br/>• 계면 결합 불완전으로 전송 저항 발생\"]\n    end\n\n    subgraph Amorphous [\"비정질 (Amorphous)\"]\n        direction TB\n        A_DESC[\"• 원자 배열이 무작위(Random)<br/>• 장거리 규칙성(Long-range order) 부재<br/>• 전자 거동 예측 난해 (상업적 특수 응용)\"]\n    end\n\n    style Crystalline fill:#0f172a,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style Polycrystalline fill:#0f172a,stroke:#f59e0b,stroke-width:2px,color:#fff\n    style Amorphous fill:#0f172a,stroke:#a855f7,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"210\" viewBox=\"0 0 720 210\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0;\">\n  <text x=\"360\" y=\"24\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"15\" font-weight=\"bold\">결정 구조 비교: 단결정 vs 다결정 vs 비정질</text>\n\n  <!-- 단결정 격자 -->\n  <g transform=\"translate(30, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"150\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"22\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\">단결정 (Crystalline)</text>\n    <!-- 격자 점들 -->\n    <g fill=\"#38bdf8\">\n      <circle cx=\"40\" cy=\"50\" r=\"6\"/><circle cx=\"80\" cy=\"50\" r=\"6\"/><circle cx=\"120\" cy=\"50\" r=\"6\"/><circle cx=\"160\" cy=\"50\" r=\"6\"/>\n      <circle cx=\"40\" cy=\"80\" r=\"6\"/><circle cx=\"80\" cy=\"80\" r=\"6\"/><circle cx=\"120\" cy=\"80\" r=\"6\"/><circle cx=\"160\" cy=\"80\" r=\"6\"/>\n      <circle cx=\"40\" cy=\"110\" r=\"6\"/><circle cx=\"80\" cy=\"110\" r=\"6\"/><circle cx=\"120\" cy=\"110\" r=\"6\"/><circle cx=\"160\" cy=\"110\" r=\"6\"/>\n      <!-- 결합선 -->\n      <path d=\"M40,50 H160 M40,80 H160 M40,110 H160 M40,50 V110 M80,50 V110 M120,50 V110 M160,50 V110\" stroke=\"#38bdf8\" stroke-width=\"1\" opacity=\"0.4\"/>\n    </g>\n    <text x=\"100\" y=\"138\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">완벽한 규칙적 주기 격자</text>\n  </g>\n\n  <!-- 다결정 격자 -->\n  <g transform=\"translate(260, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"150\" rx=\"6\" fill=\"#1e293b\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"22\" text-anchor=\"middle\" fill=\"#f59e0b\" font-size=\"12\" font-weight=\"bold\">다결정 (Polycrystalline)</text>\n    <!-- Grain boundary line -->\n    <path d=\"M100,30 L95,70 L115,110 L105,145\" stroke=\"#ef4444\" stroke-width=\"2.5\" stroke-dasharray=\"3\"/>\n    <text x=\"105\" y=\"85\" fill=\"#fca5a5\" font-size=\"9\" font-weight=\"bold\">Grain Boundary</text>\n    <!-- 좌측 결정립 -->\n    <g fill=\"#f59e0b\">\n      <circle cx=\"35\" cy=\"55\" r=\"5\"/><circle cx=\"70\" cy=\"50\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"90\" r=\"5\"/><circle cx=\"75\" cy=\"85\" r=\"5\"/>\n      <circle cx=\"45\" cy=\"125\" r=\"5\"/><circle cx=\"80\" cy=\"120\" r=\"5\"/>\n    </g>\n    <!-- 우측 결정립(기울어짐) -->\n    <g fill=\"#fbbf24\">\n      <circle cx=\"130\" cy=\"50\" r=\"5\"/><circle cx=\"165\" cy=\"65\" r=\"5\"/>\n      <circle cx=\"135\" cy=\"85\" r=\"5\"/><circle cx=\"170\" cy=\"100\" r=\"5\"/>\n      <circle cx=\"140\" cy=\"120\" r=\"5\"/><circle cx=\"175\" cy=\"135\" r=\"5\"/>\n    </g>\n    <text x=\"100\" y=\"138\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">결정립계(경계면) 존재</text>\n  </g>\n\n  <!-- 비정질 -->\n  <g transform=\"translate(490, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"150\" rx=\"6\" fill=\"#1e293b\" stroke=\"#a855f7\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"22\" text-anchor=\"middle\" fill=\"#c084fc\" font-size=\"12\" font-weight=\"bold\">비정질 (Amorphous)</text>\n    <!-- 무작위 원자들 -->\n    <g fill=\"#c084fc\">\n      <circle cx=\"35\" cy=\"45\" r=\"5\"/><circle cx=\"75\" cy=\"60\" r=\"5\"/><circle cx=\"115\" cy=\"40\" r=\"5\"/><circle cx=\"165\" cy=\"55\" r=\"5\"/>\n      <circle cx=\"50\" cy=\"85\" r=\"5\"/><circle cx=\"95\" cy=\"80\" r=\"5\"/><circle cx=\"140\" cy=\"95\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"120\" r=\"5\"/><circle cx=\"80\" cy=\"115\" r=\"5\"/><circle cx=\"125\" cy=\"130\" r=\"5\"/><circle cx=\"170\" cy=\"110\" r=\"5\"/>\n    </g>\n    <text x=\"100\" y=\"138\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">무작위 불규칙 원자 배열</text>\n  </g>\n</svg>\n</div>\n\n\n\n### 📊 [확실한 그림 자료 3] 반도체 물질의 분류 체계 (Semiconductor Materials Hierarchy)\n> 근거 ID: [27:19], [27:48]~[32:28] `중요`\n\n```mermaid\nflowchart TD\n    SEMI[\"반도체 물질군 (Semiconductor Materials)\"]\n    \n    SEMI --> ELEM[\"단일 원소 반도체 (Elemental)<br/>Group 4 (화학 14족)\"]\n    SEMI --> COMP[\"화합물 반도체 (Compound)\"]\n\n    ELEM --> SI[\"★ Silicon (Si)<br/>현대 소자 표준 (Eg ≈ 1.1 eV)\"]\n    ELEM --> GE[\"Germanium (Ge)<br/>최초 트랜지스터 재료 (Eg ≈ 0.67 eV)\"]\n    ELEM --> C[\"Carbon (C)<br/>소자 재료 논쟁적 (다이아몬드 등)\"]\n\n    COMP --> C44[\"IV-IV 족 화합물<br/>• Si-Ge, Si-C\"]\n    COMP --> C35[\"III-V 족 화합물<br/>• GaAs, InP, InGaAsP<br/>• SpaceX 위성 태양전지 고효율 셀\"]\n    COMP --> C26[\"II-VI 족 화합물<br/>• CdTe\"]\n    COMP --> C46[\"IV-VI 족 화합물<br/>• PbS\"]\n\n    style SEMI fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style SI fill:#065f46,stroke:#10b981,stroke-width:2px,color:#fff\n    style GE fill:#7c2d12,stroke:#f97316,stroke-width:1.5px,color:#fff\n    style C35 fill:#1e1b4b,stroke:#818cf8,stroke-width:1.5px,color:#fff\n```\n\n\n\n### 📊 [확실한 그림 자료 2] 반도체 결정 구조의 3가지 형태 (Crystal Structures)\n> 근거 ID: [20:08], [22:28]~[26:28] `핵심`\n\n```mermaid\nflowchart LR\n    subgraph S_Crys [\"단결정 (Crystalline)\"]\n        direction TB\n        C_DESC[\"• 원자들의 완벽한 주기적 배열<br/>• 결함 및 불연속성 없음<br/>• 전자 이동 거동 정확히 예측 가능<br/>• 최신 3nm 집적회로(IC) 제작 필수\"]\n    end\n\n    subgraph S_Poly [\"다결정 (Polycrystalline)\"]\n        direction TB\n        P_DESC[\"• 여러 개의 작은 단결정립(Grain) 집합체<br/>• 결정립 간 경계: 결정립계(Grain Boundary)<br/>• 계면 결합 불완전으로 전송 저항 발생\"]\n    end\n\n    subgraph S_Amor [\"비정질 (Amorphous)\"]\n        direction TB\n        A_DESC[\"• 원자 배열이 무작위(Random)<br/>• 장거리 규칙성 부재<br/>• 전자 거동 예측 난해 (상업적 특수 응용)\"]\n    end\n\n    style C_DESC fill:#0f172a,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style P_DESC fill:#0f172a,stroke:#f59e0b,stroke-width:2px,color:#fff\n    style A_DESC fill:#0f172a,stroke:#a855f7,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\" style=\"margin: 16px 0; page-break-inside: avoid;\">\n<svg width=\"100%\" height=\"auto\" viewBox=\"0 0 720 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:720px; display:block; margin:0 auto; background:#0f172a; border-radius:8px; border:1px solid #334155;\">\n  <rect width=\"100%\" height=\"100%\" fill=\"#0f172a\" rx=\"8\"/>\n  <text x=\"360\" y=\"24\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"14\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">결정 구조 비교: 단결정 vs 다결정 vs 비정질</text>\n  <g transform=\"translate(30, 38)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"144\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"20\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">단결정 (Crystalline)</text>\n    <g fill=\"#38bdf8\">\n      <circle cx=\"40\" cy=\"46\" r=\"5\"/><circle cx=\"80\" cy=\"46\" r=\"5\"/><circle cx=\"120\" cy=\"46\" r=\"5\"/><circle cx=\"160\" cy=\"46\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"76\" r=\"5\"/><circle cx=\"80\" cy=\"76\" r=\"5\"/><circle cx=\"120\" cy=\"76\" r=\"5\"/><circle cx=\"160\" cy=\"76\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"106\" r=\"5\"/><circle cx=\"80\" cy=\"106\" r=\"5\"/><circle cx=\"120\" cy=\"106\" r=\"5\"/><circle cx=\"160\" cy=\"106\" r=\"5\"/>\n      <path d=\"M40,46 H160 M40,76 H160 M40,106 H160 M40,46 V106 M80,46 V106 M120,46 V106 M160,46 V106\" stroke=\"#38bdf8\" stroke-width=\"1\" opacity=\"0.35\"/>\n    </g>\n    <text x=\"100\" y=\"132\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"system-ui, sans-serif\">완벽한 규칙적 주기 격자</text>\n  </g>\n  <g transform=\"translate(260, 38)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"144\" rx=\"6\" fill=\"#1e293b\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"20\" text-anchor=\"middle\" fill=\"#f59e0b\" font-size=\"12\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">다결정 (Polycrystalline)</text>\n    <path d=\"M100,28 L95,65 L115,102 L105,140\" stroke=\"#ef4444\" stroke-width=\"2\" stroke-dasharray=\"3\"/>\n    <text x=\"108\" y=\"80\" fill=\"#fca5a5\" font-size=\"9\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Grain Boundary</text>\n    <g fill=\"#f59e0b\">\n      <circle cx=\"35\" cy=\"50\" r=\"5\"/><circle cx=\"70\" cy=\"46\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"82\" r=\"5\"/><circle cx=\"75\" cy=\"78\" r=\"5\"/>\n      <circle cx=\"45\" cy=\"115\" r=\"5\"/><circle cx=\"80\" cy=\"110\" r=\"5\"/>\n    </g>\n    <g fill=\"#fbbf24\">\n      <circle cx=\"130\" cy=\"46\" r=\"5\"/><circle cx=\"165\" cy=\"60\" r=\"5\"/>\n      <circle cx=\"135\" cy=\"78\" r=\"5\"/><circle cx=\"170\" cy=\"92\" r=\"5\"/>\n      <circle cx=\"140\" cy=\"110\" r=\"5\"/><circle cx=\"175\" cy=\"124\" r=\"5\"/>\n    </g>\n    <text x=\"100\" y=\"132\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"system-ui, sans-serif\">결정립계(경계면) 존재</text>\n  </g>\n  <g transform=\"translate(490, 38)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"144\" rx=\"6\" fill=\"#1e293b\" stroke=\"#a855f7\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"20\" text-anchor=\"middle\" fill=\"#c084fc\" font-size=\"12\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">비정질 (Amorphous)</text>\n    <g fill=\"#c084fc\">\n      <circle cx=\"35\" cy=\"42\" r=\"5\"/><circle cx=\"75\" cy=\"55\" r=\"5\"/><circle cx=\"115\" cy=\"38\" r=\"5\"/><circle cx=\"165\" cy=\"50\" r=\"5\"/>\n      <circle cx=\"50\" cy=\"78\" r=\"5\"/><circle cx=\"95\" cy=\"72\" r=\"5\"/><circle cx=\"140\" cy=\"88\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"110\" r=\"5\"/><circle cx=\"80\" cy=\"105\" r=\"5\"/><circle cx=\"125\" cy=\"120\" r=\"5\"/><circle cx=\"170\" cy=\"102\" r=\"5\"/>\n    </g>\n    <text x=\"100\" y=\"132\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"system-ui, sans-serif\">무작위 불규칙 원자 배열</text>\n  </g>\n</svg>\n</div>\n\n### 📊 [확실한 그림 자료 3] 반도체 물질의 분류 체계 (Semiconductor Materials Hierarchy)\n> 근거 ID: [27:19], [27:48]~[32:28] `중요`\n\n```mermaid\nflowchart TD\n    SEMI[\"반도체 물질군 (Semiconductor Materials)\"]\n    \n    SEMI --> ELEM[\"단일 원소 반도체 (Elemental)<br/>Group 4 (화학 14족)\"]\n    SEMI --> COMP[\"화합물 반도체 (Compound)\"]\n\n    ELEM --> SI[\"★ Silicon (Si)<br/>현대 소자 표준 (Eg 약 1.1 eV)\"]\n    ELEM --> GE[\"Germanium (Ge)<br/>최초 트랜지스터 재료 (Eg 약 0.67 eV)\"]\n    ELEM --> C[\"Carbon (C)<br/>소자 재료 논쟁적 (다이아몬드 등)\"]\n\n    COMP --> C44[\"IV-IV 족 화합물<br/>• Si-Ge, Si-C\"]\n    COMP --> C35[\"III-V 족 화합물<br/>• GaAs, InP, InGaAsP<br/>• SpaceX 위성 태양전지 고효율 셀\"]\n    COMP --> C26[\"II-VI 족 화합물<br/>• CdTe\"]\n    COMP --> C46[\"IV-VI 족 화합물<br/>• PbS\"]\n\n    style SEMI fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style SI fill:#065f46,stroke:#10b981,stroke-width:2px,color:#fff\n    style GE fill:#7c2d12,stroke:#f97316,stroke-width:1.5px,color:#fff\n    style C35 fill:#1e1b4b,stroke:#818cf8,stroke-width:1.5px,color:#fff\n```\n\n#### 3. 왜 실리콘 (Si) 인가? (Si vs Ge 비교)\n*   **근거 ID**: [33:08] ~ [40:00]\n*   **중요도**: `핵심` (시험 빈출)\n\n| 비교 항목 | Silicon (Si) | Germanium (Ge) | 이유 및 영향 |\n| :--- | :--- | :--- | :--- |\n| **밴드갭 ($E_g$)** | $\\approx 1.12 \\text{ eV}$ | $\\approx 0.67 \\text{ eV}$ | Si 가 더 큼 $\\rightarrow$ 열에 의한 누설 전류 (Off-current) 가 적음. 스위칭 명확성 확보. |\n| **오프 전류** | 매우 작음 (Small) | 큼 (Large) | 작은 밴드갭은 자발적인 전하 생성을 유발하여 스위치 'OFF' 상태를 유지하기 어려움. |\n| **내열성** | 높음 | 낮음 | Ge 는 고온에서 결정 구조가 쉽게 파괴됨. |\n| **항복 전압** | 높음 | 낮음 | 고전압에서도 견딤. 신뢰성 높음. |\n| **산화막 형성** | **가능 ($SiO_2$)** | 불가/불안정 | **SiO₂는 우수한 절연체**. 트랜지스터 (Capacitor device) 제작에 필수적. |\n| **가격** | 매우 저렴 | 비쌈 | 대량 생산에 유리. |\n\n> **트랜지스터의 본질**: 저항을 제어 (Transfer Resistance) 하는 소자. $SiO_2$ 절연층을 이용해 게이트 전압으로 채널의 저항을 조절한다.\n\n#### 4. 실리콘의 원자 구조 및 전하 캐리어 생성\n*   **근거 ID**: [43:48] ~ [53:08]\n*   **중요도**: `핵심`\n\n**원자 구성 및 결합**\n*   **전자 배분**: Si 원자는 4 개의 원자가 전자 (Valence electrons) 를 가짐 ($3s^2, 3p^2$).\n*   **혼성 오비탈**: $sp^3$ 혼성 오비탈을 형성하여 4 개의 동등한 결합 방향 생성.\n*   **공유결합 (Covalent Bond)**: 인접한 Si 원자와 전자를 공유하여 격자 구조 (Lattice) 형성.\n    *   **원자 밀도**: $5 \\times 10^{22} \\text{ atoms/cm}^3$\n\n**전하 캐리어 생성 메커니즘**\n1.  **에너지 공급**: 열에너지 등 외부 에너지가 가해짐.\n2.  **결합 파괴**: 공유결합이 끊어지며 전자가 탈출.\n3.  **생성 쌍**:\n    *   **자유 전자 (Free Electron)**: 전도대로 이동 가능한 전자.\n    *   **정공 (Hole)**: 전자가 빠져나간 빈 자리 (양전하처럼 행동).\n4.  **평형 조건**:\n    $$ n = p $$\n    *(여기서 $n$: 자유 전자 농도, $p$: 정공 농도)*\n    *   본질 반도체 (Intrinsic) 에서는 전자와 정공이 항상 쌍으로 생성되므로 농도가 같다.\n\n---\n\n#\n\n\n### 📊 [확실한 그림 자료 4] 실리콘 공유결합 격자 및 전자-정공 쌍(EHP) 생성 메커니즘\n> 근거 ID: [44:28]~[53:08], [50:07] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Step1 [\"(a) 상온 이전: 완전한 공유결합 상태 (Covalent Bonds)\"]\n        S1[\"Si 원자 (최외각 4개 전자, sp³ 혼성 오비탈)<br/>인접한 4개 Si 원자와 2개씩 전자 공유하여 결합<br/>원자 밀도: 5 × 10²² atoms/cm³ | 자유전자 없음\"]\n    end\n\n    subgraph Step2 [\"(b) 외부 에너지 인가 (Thermal Energy / T 상승)\"]\n        S2[\"열 진동에 의해 Si-Si 공유결합 파괴 (Bond Broken)\"]\n    end\n\n    subgraph Step3 [\"(c) 캐리어 쌍 동시 생성 (Carrier Pair Generation)\"]\n        S3A[\"자유 전자 (Free Electron)<br/>결합에서 빠져나와 전도대로 이동<br/>전류 전도 기여\"]\n        S3B[\"정공 (Hole, 빈자리)<br/>전자가 빠져나간 빈 공간<br/>양전하 캐리어로 거동\"]\n    end\n\n    Step1 --> Step2\n    Step2 --> S3A\n    Step2 --> S3B\n\n    style Step1 fill:#0f172a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style Step2 fill:#0f172a,stroke:#f59e0b,stroke-width:1.5px,color:#fff\n    style Step3 fill:#0f172a,stroke:#10b981,stroke-width:1.5px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"230\" viewBox=\"0 0 720 230\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0 : 밴드갭이 매우 크다. 근거에서 약 5 eV 이상으로 언급된다.  \n   - 반도체: 밴드갭이 중간이다. 근거에서 대략 1 eV 수준, 1~3 eV 범위로 언급된다.  \n   - Si 밴드갭: 약 1.1 eV.  \n   근거: [15:08], [15:48], [16:28], [17:08], [17:48]\n\n7. **[핵심]** 저항률 기준 구분  \n   - 낮은 저항률 → 전도체  \n   - 높은 저항률 → 절연체  \n   - 중간 저항률 → 반도체  \n   근거: [20:08]\n\n8. **[핵심]** 집적회로 소자에는 일반적으로 결정성 반도체가 사용된다. 다만 비정질 반도체도 최근 상업적으로 중요해졌다는 예외가 함께 언급된다.  \n   근거: [20:08]\n\n9. **[핵심]** Si은 원자 밀도가 `5 × 10^22 atoms/cm^3`이고, 원자가 전자가 4개이며, 이웃 원자 4개와 공유결합을 만든다.  \n   근거: [50:07]\n\n10. **[핵심]** 온도가 올라가거나 에너지가 공급되면 Si의 공유결합이 끊어질 수 있다. 결합이 끊어지면 자유전자가 생기고, 전자가 빠져나간 빈 자리로서 홀이 생긴다. 자유전자와 홀은 함께 생성되며, 근거에서는 자유전자 수와 홀 수가 같다고 설명한다.  \n    근거: [50:07], [51:08], [51:48], [52:28], [53:08]\n\n11. **[핵심]** Si이 Ge보다 선호되는 주요 이유  \n    - 훨씬 저렴함  \n    - 차단/오프 전류가 훨씬 작음  \n    - 고온에서 더 안정적임  \n    - 항복전압이 더 높음  \n    - 절연체 `SiO₂`를 실리콘 위에 쉽게 형성할 수 있음  \n    근거: [33:48], [34:28], [35:08], [37:08], [38:28], [39:08], [39:48], [40:00]\n\n12. **[중요]** Ge의 밴드갭은 약 0.67 eV이다. 밴드갭이 너무 작으면 전류 제어가 어렵고, 특히 스위칭에서 오프 상태 전류가 문제가 된다.  \n    근거: [33:48], [37:08]\n\n13. **[중요]** 트랜지스터는 “transfer + resistor”의 합성어로, 저항을 변조할 수 있는 소자라고 설명된다.  \n    근거: [41:48], [42:28], [43:08]\n\n---\n\n## 1. 수치·단위·조건 우선 보존 표\n\n| 항목 | 값 / 조건 | 의미 / 직관적 설명 | 근거 | 중요도 |\n|---|---:|---|---|---|\n| 절연체 밴드갭 | 약 5 eV 이상으로 언급 | 밴드갭이 커서 전자를 전도대로 올리기 어렵다. | [16:28], [17:08] | 핵심 |\n| 반도체 밴드갭 | 대략 1 eV 수준, 1~3 eV 범위로 언급 | 전도체와 절연체 사이의 중간 에너지 간격이다. | [17:08], [17:48] | 핵심 |\n| Si 밴드갭 | 약 1.1 eV | 실리콘의 대표 밴드갭 값이다. | [17:48] | 핵심 |\n| Ge 밴드갭 | 약 0.67 eV | Si보다 작아서 전류 제어가 더 어렵다. | [33:48] | 핵심 |\n| 전도체 밴드 구조 | 원자가대와 전도대가 겹침, 에너지 차이 없음 | 작은 에너지로도 전자가 이동하여 전도성이 생긴다. | [17:08], [15:48] | 핵심 |\n| 밴드갭 상태 | 밴드갭에는 전자가 점유 가능한 상태 없음 | 전자는 원자가대 또는 전도대에 존재할 수 있고, 갭 내부에는 허용 상태가 없다. | [18:28], [19:08] | 핵심 |\n| 저항률 기준 | 낮음 → 전도체, 높음 → 절연체, 중간 → 반도체 | 전기 전도성으로 재료를 구분하는 기준이다. | [20:08] | 핵심 |\n| Si 원자 밀도 | `5 × 10^22 atoms/cm^3` | 단위 부피당 실리콘 원자 수이다. | [50:07] | 중요 |\n| Si 원자가 전자 수 | 4개 | 이웃 원자 4개와 공유결합을 형성할 수 있다. | [50:07] | 핵심 |\n| 결정성 필요성 | IC 소자는 일반적으로 결정성 반도체 사용 | 원자 배열이 규칙적이어야 전자 거동을 예측할 수 있다. | [20:08], [25:48], [26:28] | 핵심 |\n| 비정질 반도체 예외 | 비정질 반도체도 상업적으로 중요해졌다고 언급 | 일반적으로는 결정성이 중요하지만 예외가 있다. | [20:08] | 중요 |\n| 공정 규모 예시 | 3 nm 수준, 수~수십 nm 언급 | 근거에서 결정성과 미세 공정의 중요성을 설명하는 과정에서 언급된다. | [25:48] | 참고 |\n| 주기율표 족 표기 | 전기전자 관례에서 14족 대신 4족으로 부른다고 설명 | 반도체 소자 물리에서는 10을 빼고 짧은 족 번호를 사용한다는 취지이다. | [27:48], [28:28] | 참고 |\n\n---\n\n## 2. 에너지 밴드 개념 정리\n\n### 2.1 밴드와 에너지 상태\n\n- **[핵심]** 밴드는 고체 안에서 전자가 점유할 수 있는 허용 에너지 상태들의 집합이다.  \n  근거: [08:28], [09:08]\n\n- **[참고]** 강의에서는 에너지 상태를 전자가 들어갈 수 있는 “자리”처럼 직관적으로 설명한다.  \n  근거: [09:48]\n\n- **[중요]** 전도대는 원자가대보다 높은 에너지에 위치한다.  \n  근거: [10:28]\n\n- **[중요]** 핵 가까이 있는 전자는 인력이 커서 핵에 강하게 묶여 있고, 더 낮은 에너지 상태와 관련된다. 핵에서 먼 전자는 비교적 약하게 묶여 있다.  \n  근거: [10:28], [11:08], [11:48]\n\n### 2.2 원자가대와 전도대\n\n- **[핵심]** 원자가대 전자들은 핵에 상대적으로 강하게 묶여 있으며, 강의에서는 원자가대가 전자로 가득 차 있다고 설명된다.  \n  근거: [11:48], [12:28]\n\n- **[핵심]** 전도대는 전류 흐름과 관련된다. 처음에는 전도대에 전자가 거의 없으므로 전류 흐름이 없다고 설명된다.  \n  근거: [13:08]\n\n- **[핵심]** 고체가 전도성을 가지려면 원자가대의 전자가 전도대로 이동해야 한다. 이를 위해 에너지가 필요하다.  \n  근거: [14:28]\n\n- **[중요]** 전도대에 올라간 전자는 전도대 안에서 자유롭게 움직일 수 있다고 설명된다.  \n  근거: [15:48]\n\n### 2.3 절연체, 반도체, 전도체의 밴드 구조 비교\n\n| 재료 | 밴드 구조 | 전도 조건 | 근거 | 중요도 |\n|---|---|---|---|---|\n| 절연체 | 원자가대와 전도대 사이 밴드갭이 매우 큼 | 큰 에너지가 필요하여 전도시키기 어려움 | [15:08], [16:28] | 핵심 |\n| 반도체 | 밴드갭이 중간 크기 | 적절한 에너지로 전자가 전도대로 이동 가능 | [16:28], [17:48] | 핵심 |\n| 전도체 | 원자가대와 전도대가 겹침 | 작은 에너지로도 전도 가능 | [15:48], [17:08] | 핵심 |\n\n- **[핵심]** 밴드갭은 전도대와 원자가대 사이의 에너지 간격이다. 강의에서는 이 간격을 “energy gap”이라고 부른다.  \n  근거: [17:08]\n\n- **[핵심]** 밴드갭 구간에는 전자가 점유할 수 있는 상태가 없다. 즉, 밴드갭 자체에는 전자가 존재하지 않는다.  \n  근거: [18:28], [19:08]\n\n---\n\n## 3. 개념식 형태 정리: 밴드갭\n\n> 엄밀한 수식이 강의에서 전개되지는 않지만, 근거에서 반복적으로 설명되는 관계를 개념식으로 정리한다.\n\n```\n밴드갭 = 전도대와 원자가대 사이의 에너지 간격\n```\n\n- **변수/의미**\n  - 밴드갭: 전자가 전도대에 참여하기 위해 넘어야 하는 에너지 간격\n- **단위**\n  - eV\n- **근거 값**\n  - 절연체: 약 5 eV 이상으로 언급  \n  - 반도체: 대략 1 eV 수준, 1~3 eV 범위로 언급  \n  - Si: 약 1.1 eV  \n  - Ge: 약 0.67 eV  \n- **적용 조건**\n  - 전도체: 밴드가 겹쳐 에너지 차이가 없음  \n  - 절연체: 밴드갭이 큼  \n  - 반도체: 밴드갭이 중간  \n- **직관적 의미**\n  - 밴드갭이 작을수록 전자가 전도대로 이동하기 쉽지만, 너무 작으면 오프 전류 제어가 어려워질 수 있다.  \n- 근거: [15:08], [15:48], [16:28], [17:08], [17:48], [33:48] | **[핵심]**\n\n---\n\n## 4. 반도체의 결정 구조\n\n### 4.1 재료의 구조 분류\n\n| 구조 | 설명 | 근거 | 중요도 |\n|---|---|---|---|\n| 비정질, amorphous | 원자가 무작위로 배열됨 | [22:28] | 중요 |\n| 단결정/결정질, crystalline | 원자가 규칙적으로 잘 배열됨 | [23:08] | 핵심 |\n| 다결정, polycrystalline | 여러 결정 구조가 붙어 있음. 전체적으로는 완전히 규칙적이지 않고 비정질과 결정질의 중간 성격으로 설명됨 | [23:48] | 중요 |\n\n### 4.2 결정립계\n\n- **[중요]** 다결정 재료에서는 서로 다른 결정이 붙어 있는 경계가 생기며, 이를 결정립계, 즉 grain boundary라고 부른다.  \n  근거: [24:28]\n\n- **[참고]** 각 결정을 하나의 “grain”으로 보고, 두 결정이 만나는 경계이기 때문에 결정립계라고 설명된다.  \n  근거: [24:28]\n\n### 4.3 IC 소자와 결정성\n\n- **[핵심]** 집적회로 소자에는 일반적으로 결정성 반도체 재료가 사용된다.  \n  근거: [20:08]\n\n- **[중요]** 실리콘 원자가 규칙적으로 배열되어 있지 않으면 전자들이 어떻게 행동하는지 예측하기 어렵기 때문에 결정성이 중요하다.  \n  근거: [25:48], [26:28]\n\n- **[중요]** 예외로, 비정질 반도체도 최근 상업적으로 매우 중요해졌다는 점이 언급된다.  \n  근거: [20:08]\n\n---\n\n## 5. 반도체 재료와 주기율표\n\n### 5.1 대표 반도체 원소\n\n- **[중요]** 대표적 원소 반도체는 Si와 Ge이다.  \n  근거: [29:08], [30:28]\n\n- **[참고]** 탄소도 언급되지만, 강의에서는 대표 반도체 소자 재료로 본격적으로 다루지 않는다는 취지로 설명된다.  \n  근거: [29:08]\n\n- **[참고]** 최초의 트랜지스터는 점접촉 트랜지스터였으며, 게르마늄 재료로 만들어졌다고 언급된다. 이후 Ge의 문제 때문에 Si로 전환되었다고 설명된다.  \n  근거: [29:48], [30:28]\n\n### 5.2 족 번호 표기\n\n- **[참고]** 화학에서는 14족으로 부를 수 있지만, 전기전자/반도체 소자 분야에서는 10을 빼고 4족이라고 부른다고 설명된다.  \n  근거: [27:48], [28:28]\n\n### 5.3 화합물 반도체\n\n- **[참고]** 근거 자료에는 다음 화합물 반도체 분류가 나타난다.  \n  - IV-IV: Si-Ge, Si-C  \n  - III-IV: InP, GaAs로 표기됨  \n  - II-VI: CdTe  \n  - IV-VI: PbS  \n  근거: [27:19]\n\n- **[참고]** 음성에서는 “three-five materials” 같은 표현도 등장하여, 근거 내 표기와 음성 인식 사이에 혼동이 있을 수 있다. 본 노트는 근거 캡션 표기를 그대로 기록하되 추가 해석은 하지 않는다.  \n  근거: [27:19], [31:08]\n\n- **[참고]** 주석과 납 계열 재료는 밴드갭이 매우 작아 반도체 소자에 자주 사용되지 않는다고 언급된다.  \n  근거: [32:28]\n\n---\n\n\n\n### 📊 [확실한 그림 자료 3] 반도체 물질의 분류 체계 (Semiconductor Materials Hierarchy)\n> 근거 ID: [27:19], [27:48]~[32:28] `중요`\n\n```mermaid\nflowchart TD\n    SEMI[\"반도체 물질군 (Semiconductor Materials)\"]\n    \n    SEMI --> ELEM[\"단일 원소 반도체 (Elemental)<br/>Group 4 (화학 14족)\"]\n    SEMI --> COMP[\"화합물 반도체 (Compound)\"]\n\n    ELEM --> SI[\"★ Silicon (Si)<br/>현대 소자 표준 (Eg ≈ 1.1 eV)\"]\n    ELEM --> GE[\"Germanium (Ge)<br/>최초 트랜지스터 재료 (Eg ≈ 0.67 eV)\"]\n    ELEM --> C[\"Carbon (C)<br/>소자 재료 논쟁적 (다이아몬드 등)\"]\n\n    COMP --> C44[\"IV-IV 족 화합물<br/>• Si-Ge, Si-C\"]\n    COMP --> C35[\"III-V 족 화합물<br/>• GaAs, InP, InGaAsP<br/>• SpaceX 위성 태양전지 고효율 셀\"]\n    COMP --> C26[\"II-VI 족 화합물<br/>• CdTe\"]\n    COMP --> C46[\"IV-VI 족 화합물<br/>• PbS\"]\n\n    style SEMI fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style SI fill:#065f46,stroke:#10b981,stroke-width:2px,color:#fff\n    style GE fill:#7c2d12,stroke:#f97316,stroke-width:1.5px,color:#fff\n    style C35 fill:#1e1b4b,stroke:#818cf8,stroke-width:1.5px,color:#fff\n```\n\n\n\n### 📊 [확실한 그림 자료 3] 반도체 물질의 분류 체계 (Semiconductor Materials Hierarchy)\n> 근거 ID: [27:19], [27:48]~[32:28] `중요`\n\n```mermaid\nflowchart TD\n    SEMI[\"반도체 물질군 (Semiconductor Materials)\"]\n    \n    SEMI --> ELEM[\"단일 원소 반도체 (Elemental)<br/>Group 4 (화학 14족)\"]\n    SEMI --> COMP[\"화합물 반도체 (Compound)\"]\n\n    ELEM --> SI[\"★ Silicon (Si)<br/>현대 소자 표준 (Eg 약 1.1 eV)\"]\n    ELEM --> GE[\"Germanium (Ge)<br/>최초 트랜지스터 재료 (Eg 약 0.67 eV)\"]\n    ELEM --> C[\"Carbon (C)<br/>소자 재료 논쟁적 (다이아몬드 등)\"]\n\n    COMP --> C44[\"IV-IV 족 화합물<br/>• Si-Ge, Si-C\"]\n    COMP --> C35[\"III-V 족 화합물<br/>• GaAs, InP, InGaAsP<br/>• SpaceX 위성 태양전지 고효율 셀\"]\n    COMP --> C26[\"II-VI 족 화합물<br/>• CdTe\"]\n    COMP --> C46[\"IV-VI 족 화합물<br/>• PbS\"]\n\n    style SEMI fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style SI fill:#065f46,stroke:#10b981,stroke-width:2px,color:#fff\n    style GE fill:#7c2d12,stroke:#f97316,stroke-width:1.5px,color:#fff\n    style C35 fill:#1e1b4b,stroke:#818cf8,stroke-width:1.5px,color:#fff\n```\n\n## 6. Si이 Ge보다 선호되는 이유\n\n| 이유 | 설명 | 근거 | 중요도 |\n|---|---|---|---|\n| 비용 | Si이 Ge보다 훨씬 저렴하다고 설명된다. | [34:28], [40:00] | 핵심 |\n| 밴드갭 | Ge 밴드갭은 약 0.67 eV이다. 밴드갭이 작으면 전류 제어가 어렵다. | [33:48] | 핵심 |\n| 차단/오프 전류 | Si은 차단 전류가 훨씬 작다. 스위치는 오프 상태 전류가 낮을수록 좋다. | [35:08], [37:08], [40:00] | 핵심 |\n| 고온 안정성 | Ge는 고온에서 쉽게 손상될 수 있다고 언급된다. Si은 고온/압력 조건에서 더 안정적이라고 설명된다. | [38:28], [40:00] | 핵심 |\n| 항복전압 | Si의 항복전압이 Ge보다 높다. 높은 전압이 걸려도 쉽게 파괴되지 않는다는 의미로 설명된다. | [38:28], [39:08], [40:00] | 핵심 |\n| 산화막 형성 | `SiO₂`는 절연체이며 실리콘 위에 쉽게 형성될 수 있다\n"},{"name":"Gemini 3.1 Flash-Lite","id":"google/gemini-3.1-flash-lite","slug":"04_gemini_3.1_flash_lite","elapsed":"5.8","charCount":33761,"content":"# Gemini 3.1 Flash-Lite 강의 요약 노트\n\n- 모델 ID: `google/gemini-3.1-flash-lite`\n- 소요 시간: 5.8초\n- 생성 글자 수: 33761자\n- 기준 강의 파일: `electric_circuits_note_example.md`\n- 특징: 확실한 그림 자료(Mermaid + SVG) 적용 완료, 제외 내용 완전 제거\n\n---\n\n# Gemini 3.1 Flash-Lite 강의 요약 노트\n\n- 모델 ID: `google/gemini-3.1-flash-lite`\n- 소요 시간: 5.8초\n- 생성 글자 수: 16895자\n- 기준 강의 파일: `electric_circuits_note_example.md`\n- 특징: 확실한 그림 자료(Mermaid + SVG) 적용 완료, 제외 내용 완전 제거\n\n---\n\n# 학습 노트: 반도체 물리학 기초 (Basic Semiconductor Physics)\n\n## 1. 핵심 결론 및 요약\n*   **반도체란:** 도체와 절연체의 중간적인 전기적 특성(저항률)을 가지며, 현대 전자 기기(D칩, 트랜지스터 등)의 핵심 재료임.\n*   **실리콘(Si)의 우위:** 게르마늄(Ge) 대비 넓은 밴드갭, 저렴한 가격, 낮은 누설 전류, 높은 항복 전압, 양질의 산화막($SiO_2$) 형성 능력으로 인해 현대 반도체 산업의 주류가 됨.\n*   **결정 구조의 중요성:** 원자가 규칙적으로 배열된 결정(Crystalline) 구조여야 전자의 거동을 예측·제어할 수 있어 집적회로 제조에 필수적임.\n*   **전도 메커니즘:** 원자 결합이 깨지면 자유 전자와 정공(Hole)이 생성되어 전류가 흐르게 됨.\n\n---\n\n## 2. 주요 개념 및 구조화\n\n### 2.1. 에너지 밴드 구조와 물질 분류 [07:39]\n| 구분 | 에너지 밴드 특성 | 전기적 성질 |\n| :--- | :--- | :--- |\n| **절연체** | 밴드갭이 매우 큼 (>5eV) | 전류 흐름 어려움 |\n| **반도체** | 밴드갭이 중간 (~1eV) | 에너지 인가 시 전도 가능 |\n| **도체** | 밴드와 컨덕션 밴드 오버랩 | 전류 흐름 용이 |\n\n*   **밴드갭($E_g$):** 전자가 존재할 수 없는 에너지 영역. 원자핵의 구속력에서 벗어난 자유 전자가 되기 위해 필요한 에너지의 최소치.\n\n\n\n### 📊 [확실한 그림 자료 1] 물질별 에너지 밴드 구조 비교 (Energy Band Diagram)\n> 근거 ID: [07:39], [15:08]~[18:28] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Insulator [\"절연체 (Insulator)\"]\n        direction TB\n        CB1[\"전도대 (Conduction Band)<br/>전자가 거의 없음 (비어있음)\"]\n        GAP1[\"에너지 밴드갭 (Bandgap)<br/>Eg > 5 eV (매우 큼: 전자 이동 불가)\"]\n        VB1[\"원자가대 (Valence Band)<br/>원자핵에 강하게 구속, 전자 가득 참\"]\n        CB1 --- GAP1 --- VB1\n    end\n\n    subgraph Semiconductor [\"반도체 (Semiconductor)\"]\n        direction TB\n        CB2[\"전도대 (Conduction Band)<br/>외부 에너지 공급 시 전자 전이\"]\n        GAP2[\"에너지 밴드갭 (Bandgap)<br/>Eg ≈ 1.1 eV (Si) / 0.67 eV (Ge)\"]\n        VB2[\"원자가대 (Valence Band)<br/>상온에서 전자가 쉽게 이탈 가능\"]\n        CB2 --- GAP2 --- VB2\n    end\n\n    subgraph Conductor [\"도체 (Conductor)\"]\n        direction TB\n        OVL[\"전도대 (CB) & 원자가대 (VB)<br/>서로 겹침 (Overlap, Eg = 0 eV)<br/>상온에서도 무수한 자유전자가 이동\"]\n    end\n\n    style Insulator fill:#1e293b,stroke:#ef4444,stroke-width:2px,color:#fff\n    style Semiconductor fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style Conductor fill:#1e293b,stroke:#10b981,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"260\" viewBox=\"0 0 720 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0;\">\n  <!-- 제목 -->\n  <text x=\"360\" y=\"25\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"15\" font-weight=\"bold\">물질별 에너지 밴드 구조 비교 (Energy Band Structure)</text>\n  \n  <!-- 절연체 -->\n  <g transform=\"translate(40, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"13\" font-weight=\"bold\">절연체 (Insulator)</text>\n    <!-- 전도대 -->\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"35\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"12\">전도대 (Conduction Band)</text>\n    <!-- 밴드갭 화살표 & 레이블 -->\n    <line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"128\" stroke=\"#f87171\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n    <polygon points=\"90,52 86,60 94,60\" fill=\"#f87171\"/>\n    <polygon points=\"90,128 86,120 94,120\" fill=\"#f87171\"/>\n    <rect x=\"45\" y=\"80\" width=\"90\" height=\"22\" rx=\"3\" fill=\"#450a0a\" stroke=\"#ef4444\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"95\" text-anchor=\"middle\" fill=\"#fca5a5\" font-size=\"11\" font-weight=\"bold\">Eg > 5 eV (거대함)</text>\n    <!-- 원자가대 -->\n    <rect x=\"10\" y=\"130\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"155\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"12\">원자가대 (Valence Band)</text>\n  </g>\n\n  <!-- 반도체 -->\n  <g transform=\"translate(270, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\">반도체 (Semiconductor)</text>\n    <!-- 전도대 -->\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"35\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"12\">전도대 (Conduction Band)</text>\n    <!-- 밴드갭 화살표 & 레이블 -->\n    <line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"88\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n    <polygon points=\"90,52 86,58 94,58\" fill=\"#38bdf8\"/>\n    <polygon points=\"90,88 86,82 94,82\" fill=\"#38bdf8\"/>\n    <rect x=\"40\" y=\"60\" width=\"100\" height=\"22\" rx=\"3\" fill=\"#082f49\" stroke=\"#38bdf8\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"75\" text-anchor=\"middle\" fill=\"#7dd3fc\" font-size=\"11\" font-weight=\"bold\">Eg ≈ 1.1 eV (Si)</text>\n    <!-- 원자가대 -->\n    <rect x=\"10\" y=\"90\" width=\"160\" height=\"80\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"135\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"12\">원자가대 (Valence Band)</text>\n  </g>\n\n  <!-- 전도체 -->\n  <g transform=\"translate(500, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\">도체 (Conductor)</text>\n    <!-- 겹침 밴드 -->\n    <rect x=\"10\" y=\"20\" width=\"160\" height= center\" style=\"margin: 16px 0; page-break-inside: avoid;\">\n<svg width=\"100%\" height=\"auto\" viewBox=\"0 0 720 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:720px; display:block; margin:0 auto; background:#0f172a; border-radius:8px; border:1px solid #334155;\">\n  <rect width=\"100%\" height=\"100%\" fill=\"#0f172a\" rx=\"8\"/>\n  <text x=\"360\" y=\"26\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"14\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">물질별 에너지 밴드 구조 비교 (Energy Band Structure)</text>\n  <g transform=\"translate(40, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">절연체 (Insulator)</text>\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"33\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (Conduction Band)</text>\n    <line x1=\"90\" y1=\"48\" x2=\"90\" y2=\"122\" stroke=\"#f87171\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n    <polygon points=\"90,48 86,56 94,56\" fill=\"#f87171\"/>\n    <polygon points=\"90,122 86,114 94,114\" fill=\"#f87171\"/>\n    <rect x=\"42\" y=\"75\" width=\"96\" height=\"20\" rx=\"3\" fill=\"#450a0a\" stroke=\"#ef4444\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"89\" text-anchor=\"middle\" fill=\"#fca5a5\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Eg &gt; 5 eV (매우 큼)</text>\n    <rect x=\"10\" y=\"125\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"148\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (Valence Band)</text>\n  </g>\n  <g transform=\"translate(270, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">반도체 (Semiconductor)</text>\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"33\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (Conduction Band)</text>\n    <line x1=\"90\" y1=\"48\" x2=\"90\" y2=\"82\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n    <polygon points=\"90,48 86,54 94,54\" fill=\"#38bdf8\"/>\n    <polygon points=\"90,82 86,76 94,76\" fill=\"#38bdf8\"/>\n    <rect x=\"36\" y=\"56\" width=\"108\" height=\"20\" rx=\"3\" fill=\"#082f49\" stroke=\"#38bdf8\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"70\" text-anchor=\"middle\" fill=\"#7dd3fc\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Eg ≈ 1.1 eV (Si)</text>\n    <rect x=\"10\" y=\"85\" width=\"160\" height=\"76\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"130\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (Valence Band)</text>\n  </g>\n  <g transform=\"translate(500, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">도체 (Conductor)</text>\n    <rect x=\"10\" y=\"15\" width=\"160\" height=\"146\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n    <rect x=\"10\" y=\"55\" width=\"160\" height=\"36\" fill=\"#047857\" opacity=\"0.6\"/>\n    <text x=\"90\" y=\"40\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (CB)</text>\n    <text x=\"90\" y=\"77\" text-anchor=\"middle\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Overlap (Eg = 0 eV)</text>\n    <text x=\"90\" y=\"135\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (VB)</text>\n  </g>\n</svg>\n</div>\n\n### 2.2. 반도체 결정 구조의 종류 [20:28]\n*   **Crystalline (결정질):** 원자가 매우 규칙적으로 배열됨. 반도체 소자(IC) 제조에 필수적.\n*   **Polycrystalline (다결정):** 작은 결정들이 모인 구조. 결정과 결정 사이의 경계를 **Grain Boundary(결정립계)**라 함.\n*   **Amorphous (비결정질):** 원자가 무질서하게 배열됨.\n\n\n\n### 📊 [확실한 그림 자료 2] 반도체 결정 구조의 3가지 형태 (Crystal Structures)\n> 근거 ID: [20:08], [22:28]~[26:28] `핵심`\n\n```mermaid\nflowchart LR\n    subgraph Crystalline [\"단결정 (Crystalline)\"]\n        direction TB\n        C_DESC[\"• 원자들의 완벽한 주기적 배열<br/>• 결함 및 불연속성 없음<br/>• 전자 이동 거동 정확히 예측 가능<br/>• 최신 3nm 집적회로(IC) 제작에 필수\"]\n    end\n\n    subgraph Polycrystalline [\"다결정 (Polycrystalline)\"]\n        direction TB\n        P_DESC[\"• 여러 개의 작은 단결정립(Grain) 집합체<br/>• 결정립 간 경계: 결정립계(Grain Boundary)<br/>• 계면 결합 불완전으로 전송 저항 발생\"]\n    end\n\n    subgraph Amorphous [\"비정질 (Amorphous)\"]\n        direction TB\n        A_DESC[\"• 원자 배열이 무작위(Random)<br/>• 장거리 규칙성(Long-range order) 부재<br/>• 전자 거동 예측 난해 (상업적 특수 응용)\"]\n    end\n\n    style Crystalline fill:#0f172a,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style Polycrystalline fill:#0f172a,stroke:#f59e0b,stroke-width:2px,color:#fff\n    style Amorphous fill:#0f172a,stroke:#a855f7,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"210\" viewBox=\"0 0 720 210\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0;\">\n  <text x=\"360\" y=\"24\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"15\" font-weight=\"bold\">결정 구조 비교: 단결정 vs 다결정 vs 비정질</text>\n\n  <!-- 단결정 격자 -->\n  <g transform=\"translate(30, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"150\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"22\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\">단결정 (Crystalline)</text>\n    <!-- 격자 점들 -->\n    <g fill=\"#38bdf8\">\n      <circle cx=\"40\" cy=\"50\" r=\"6\"/><circle cx=\"80\" cy=\"50\" r=\"6\"/><circle cx=\"120\" cy=\"50\" r=\"6\"/><circle cx=\"160\" cy=\"50\" r=\"6\"/>\n      <circle cx=\"40\" cy=\"80\" r=\"6\"/><circle cx=\"80\" cy=\"80\" r=\"6\"/><circle cx=\"120\" cy=\"80\" r=\"6\"/><circle cx=\"160\" cy=\"80\" r=\"6\"/>\n      <circle cx=\"40\" cy=\"110\" r=\"6\"/><circle cx=\"80\" cy=\"110\" r=\"6\"/><circle cx=\"120\" cy=\"110\" r=\"6\"/><circle cx=\"160\" cy=\"110\" r=\"6\"/>\n      <!-- 결합선 -->\n      <path d=\"M40,50 H160 M40,80 H160 M40,110 H160 M40,50 V110 M80,50 V110 M120,50 V110 M160,50 V110\" stroke=\"#38bdf8\" stroke-width=\"1\" opacity=\"0.4\"/>\n    </g>\n    <text x=\"100\" y=\"138\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">완벽한 규칙적 주기 격자</text>\n  </g>\n\n  <!-- 다결정 격자 -->\n  <g transform=\"translate(260, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"150\" rx=\"6\" fill=\"#1e293b\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"22\" text-anchor=\"middle\" fill=\"#f59e0b\" font-size=\"12\" font-weight=\"bold\">다결정 (Polycrystalline)</text>\n    <!-- Grain boundary line -->\n    <path d=\"M100,30 L95,70 L115,110 L105,145\" stroke=\"#ef4444\" stroke-width=\"2.5\" stroke-dasharray=\"3\"/>\n    <text x=\"105\" y=\"85\" fill=\"#fca5a5\" font-size=\"9\" font-weight=\"bold\">Grain Boundary</text>\n    <!-- 좌측 결정립 -->\n    <g fill=\"#f59e0b\">\n      <circle cx=\"35\" cy=\"55\" r=\"5\"/><circle cx=\"70\" cy=\"50\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"90\" r=\"5\"/><circle cx=\"75\" cy=\"85\" r=\"5\"/>\n      <circle cx=\"45\" cy=\"125\" r=\"5\"/><circle cx=\"80\" cy=\"120\" r=\"5\"/>\n    </g>\n    <!-- 우측 결정립(기울어짐) -->\n    <g fill=\"#fbbf24\">\n      <circle cx=\"130\" cy=\"50\" r=\"5\"/><circle cx=\"165\" cy=\"65\" r=\"5\"/>\n      <circle cx=\"135\" cy=\"85\" r=\"5\"/><circle cx=\"170\" cy=\"100\" r=\"5\"/>\n      <circle cx=\"140\" cy=\"120\" r=\"5\"/><circle cx=\"175\" cy=\"135\" r=\"5\"/>\n    </g>\n    <text x=\"100\" y=\"138\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">결정립계(경계면) 존재</text>\n  </g>\n\n  <!-- 비정질 -->\n  <g transform=\"translate(490, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"150\" rx=\"6\" fill=\"#1e293b\" stroke=\"#a855f7\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"22\" text-anchor=\"middle\" fill=\"#c084fc\" font-size=\"12\" font-weight=\"bold\">비정질 (Amorphous)</text>\n    <!-- 무작위 원자들 -->\n    <g fill=\"#c084fc\">\n      <circle cx=\"35\" cy=\"45\" r=\"5\"/><circle cx=\"75\" cy=\"60\" r=\"5\"/><circle cx=\"115\" cy=\"40\" r=\"5\"/><circle cx=\"165\" cy=\"55\" r=\"5\"/>\n      <circle cx=\"50\" cy=\"85\" r=\"5\"/><circle cx=\"95\" cy=\"80\" r=\"5\"/><circle cx=\"140\" cy=\"95\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"120\" r=\"5\"/><circle cx=\"80\" cy=\"115\" r=\"5\"/><circle cx=\"125\" cy=\"130\" r=\"5\"/><circle cx=\"170\" cy=\"110\" r=\"5\"/>\n    </g>\n    <text x=\"100\" y=\"138\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">무작위 불규칙 원자 배열</text>\n  </g>\n</svg>\n</div>\n\n\n\n### 📊 [확실한 그림 자료 2] 반도체 결정 구조의 3가지 형태 (Crystal Structures)\n> 근거 ID: [20:08], [22:28]~[26:28] `핵심`\n\n```mermaid\nflowchart LR\n    subgraph S_Crys [\"단결정 (Crystalline)\"]\n        direction TB\n        C_DESC[\"• 원자들의 완벽한 주기적 배열<br/>• 결함 및 불연속성 없음<br/>• 전자 이동 거동 정확히 예측 가능<br/>• 최신 3nm 집적회로(IC) 제작 필수\"]\n    end\n\n    subgraph S_Poly [\"다결정 (Polycrystalline)\"]\n        direction TB\n        P_DESC[\"• 여러 개의 작은 단결정립(Grain) 집합체<br/>• 결정립 간 경계: 결정립계(Grain Boundary)<br/>• 계면 결합 불완전으로 전송 저항 발생\"]\n    end\n\n    subgraph S_Amor [\"비정질 (Amorphous)\"]\n        direction TB\n        A_DESC[\"• 원자 배열이 무작위(Random)<br/>• 장거리 규칙성 부재<br/>• 전자 거동 예측 난해 (상업적 특수 응용)\"]\n    end\n\n    style C_DESC fill:#0f172a,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style P_DESC fill:#0f172a,stroke:#f59e0b,stroke-width:2px,color:#fff\n    style A_DESC fill:#0f172a,stroke:#a855f7,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\" style=\"margin: 16px 0; page-break-inside: avoid;\">\n<svg width=\"100%\" height=\"auto\" viewBox=\"0 0 720 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:720px; display:block; margin:0 auto; background:#0f172a; border-radius:8px; border:1px solid #334155;\">\n  <rect width=\"100%\" height=\"100%\" fill=\"#0f172a\" rx=\"8\"/>\n  <text x=\"360\" y=\"24\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"14\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">결정 구조 비교: 단결정 vs 다결정 vs 비정질</text>\n  <g transform=\"translate(30, 38)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"144\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"20\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">단결정 (Crystalline)</text>\n    <g fill=\"#38bdf8\">\n      <circle cx=\"40\" cy=\"46\" r=\"5\"/><circle cx=\"80\" cy=\"46\" r=\"5\"/><circle cx=\"120\" cy=\"46\" r=\"5\"/><circle cx=\"160\" cy=\"46\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"76\" r=\"5\"/><circle cx=\"80\" cy=\"76\" r=\"5\"/><circle cx=\"120\" cy=\"76\" r=\"5\"/><circle cx=\"160\" cy=\"76\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"106\" r=\"5\"/><circle cx=\"80\" cy=\"106\" r=\"5\"/><circle cx=\"120\" cy=\"106\" r=\"5\"/><circle cx=\"160\" cy=\"106\" r=\"5\"/>\n      <path d=\"M40,46 H160 M40,76 H160 M40,106 H160 M40,46 V106 M80,46 V106 M120,46 V106 M160,46 V106\" stroke=\"#38bdf8\" stroke-width=\"1\" opacity=\"0.35\"/>\n    </g>\n    <text x=\"100\" y=\"132\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"system-ui, sans-serif\">완벽한 규칙적 주기 격자</text>\n  </g>\n  <g transform=\"translate(260, 38)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"144\" rx=\"6\" fill=\"#1e293b\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"20\" text-anchor=\"middle\" fill=\"#f59e0b\" font-size=\"12\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">다결정 (Polycrystalline)</text>\n    <path d=\"M100,28 L95,65 L115,102 L105,140\" stroke=\"#ef4444\" stroke-width=\"2\" stroke-dasharray=\"3\"/>\n    <text x=\"108\" y=\"80\" fill=\"#fca5a5\" font-size=\"9\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Grain Boundary</text>\n    <g fill=\"#f59e0b\">\n      <circle cx=\"35\" cy=\"50\" r=\"5\"/><circle cx=\"70\" cy=\"46\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"82\" r=\"5\"/><circle cx=\"75\" cy=\"78\" r=\"5\"/>\n      <circle cx=\"45\" cy=\"115\" r=\"5\"/><circle cx=\"80\" cy=\"110\" r=\"5\"/>\n    </g>\n    <g fill=\"#fbbf24\">\n      <circle cx=\"130\" cy=\"46\" r=\"5\"/><circle cx=\"165\" cy=\"60\" r=\"5\"/>\n      <circle cx=\"135\" cy=\"78\" r=\"5\"/><circle cx=\"170\" cy=\"92\" r=\"5\"/>\n      <circle cx=\"140\" cy=\"110\" r=\"5\"/><circle cx=\"175\" cy=\"124\" r=\"5\"/>\n    </g>\n    <text x=\"100\" y=\"132\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"system-ui, sans-serif\">결정립계(경계면) 존재</text>\n  </g>\n  <g transform=\"translate(490, 38)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"144\" rx=\"6\" fill=\"#1e293b\" stroke=\"#a855f7\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"20\" text-anchor=\"middle\" fill=\"#c084fc\" font-size=\"12\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">비정질 (Amorphous)</text>\n    <g fill=\"#c084fc\">\n      <circle cx=\"35\" cy=\"42\" r=\"5\"/><circle cx=\"75\" cy=\"55\" r=\"5\"/><circle cx=\"115\" cy=\"38\" r=\"5\"/><circle cx=\"165\" cy=\"50\" r=\"5\"/>\n      <circle cx=\"50\" cy=\"78\" r=\"5\"/><circle cx=\"95\" cy=\"72\" r=\"5\"/><circle cx=\"140\" cy=\"88\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"110\" r=\"5\"/><circle cx=\"80\" cy=\"105\" r=\"5\"/><circle cx=\"125\" cy=\"120\" r=\"5\"/><circle cx=\"170\" cy=\"102\" r=\"5\"/>\n    </g>\n    <text x=\"100\" y=\"132\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"system-ui, sans-serif\">무작위 불규칙 원자 배열</text>\n  </g>\n</svg>\n</div>\n\n### 2.3. 반도체 재료의 분류 [27:19]\n*   **원소 반도체:** Si(실리콘), Ge(게르마늄)\n*   **화합물 반도체:** \n    *   IV-IV (Si-Ge, Si-C)\n    *   III-V (InP, GaAs) - 고성능 태양전지 등에 사용\n    *   II-VI (CdTe), IV-VI (PbS)\n\n\n\n### 📊 [확실한 그림 자료 3] 반도체 물질의 분류 체계 (Semiconductor Materials Hierarchy)\n> 근거 ID: [27:19], [27:48]~[32:28] `중요`\n\n```mermaid\nflowchart TD\n    SEMI[\"반도체 물질군 (Semiconductor Materials)\"]\n    \n    SEMI --> ELEM[\"단일 원소 반도체 (Elemental)<br/>Group 4 (화학 14족)\"]\n    SEMI --> COMP[\"화합물 반도체 (Compound)\"]\n\n    ELEM --> SI[\"★ Silicon (Si)<br/>현대 소자 표준 (Eg ≈ 1.1 eV)\"]\n    ELEM --> GE[\"Germanium (Ge)<br/>최초 트랜지스터 재료 (Eg ≈ 0.67 eV)\"]\n    ELEM --> C[\"Carbon (C)<br/>소자 재료 논쟁적 (다이아몬드 등)\"]\n\n    COMP --> C44[\"IV-IV 족 화합물<br/>• Si-Ge, Si-C\"]\n    COMP --> C35[\"III-V 족 화합물<br/>• GaAs, InP, InGaAsP<br/>• SpaceX 위성 태양전지 고효율 셀\"]\n    COMP --> C26[\"II-VI 족 화합물<br/>• CdTe\"]\n    COMP --> C46[\"IV-VI 족 화합물<br/>• PbS\"]\n\n    style SEMI fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style SI fill:#065f46,stroke:#10b981,stroke-width:2px,color:#fff\n    style GE fill:#7c2d12,stroke:#f97316,stroke-width:1.5px,color:#fff\n    style C35 fill:#1e1b4b,stroke:#818cf8,stroke-width:1.5px,color:#fff\n```\n\n\n\n### 📊 [확실한 그림 자료 3] 반도체 물질의 분류 체계 (Semiconductor Materials Hierarchy)\n> 근거 ID: [27:19], [27:48]~[32:28] `중요`\n\n```mermaid\nflowchart TD\n    SEMI[\"반도체 물질군 (Semiconductor Materials)\"]\n    \n    SEMI --> ELEM[\"단일 원소 반도체 (Elemental)<br/>Group 4 (화학 14족)\"]\n    SEMI --> COMP[\"화합물 반도체 (Compound)\"]\n\n    ELEM --> SI[\"★ Silicon (Si)<br/>현대 소자 표준 (Eg 약 1.1 eV)\"]\n    ELEM --> GE[\"Germanium (Ge)<br/>최초 트랜지스터 재료 (Eg 약 0.67 eV)\"]\n    ELEM --> C[\"Carbon (C)<br/>소자 재료 논쟁적 (다이아몬드 등)\"]\n\n    COMP --> C44[\"IV-IV 족 화합물<br/>• Si-Ge, Si-C\"]\n    COMP --> C35[\"III-V 족 화합물<br/>• GaAs, InP, InGaAsP<br/>• SpaceX 위성 태양전지 고효율 셀\"]\n    COMP --> C26[\"II-VI 족 화합물<br/>• CdTe\"]\n    COMP --> C46[\"IV-VI 족 화합물<br/>• PbS\"]\n\n    style SEMI fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style SI fill:#065f46,stroke:#10b981,stroke-width:2px,color:#fff\n    style GE fill:#7c2d12,stroke:#f97316,stroke-width:1.5px,color:#fff\n    style C35 fill:#1e1b4b,stroke:#818cf8,stroke-width:1.5px,color:#fff\n```\n\n### 2.4. 실리콘 vs 게르마늄 비교 [40:00]\n| 비교 항목 | 이유 및 근거 |\n| :--- | :--- |\n| **가격** | 실리콘이 압도적으로 저렴함. |\n| **누설 전류** | 실리콘이 더 작음 (스위칭 성능 우수). |\n| **열적 안정성** | 게르마늄은 고온에서 결정 구조가 쉽게 파괴됨. |\n| **항복 전압** | 실리콘이 더 높음 (고전압에 강함). |\n| **절연막 형성** | 실리콘은 산화막($SiO_2$) 형성이 용이하여 소자 집적에 유리. |\n\n> **중요 참고:** **트랜지스터(Transistor)**의 어원은 **Transfer(전달) + Resistor(저항)**의 합성어임. 전압에 따라 저항을 조절(변조)할 수 있는 소자라는 직관적 의미를 지님.\n\n### 2.5. 원자 결합 및 캐리어 생성 [50:07]\n*   **Si 원자 구성:** 최외각 전자 4개. 인접한 4개의 원자와 공유 결합(Covalent Bond) 형성.\n*   **캐리어 생성:** 열에너지 인가 시 공유 결합이 끊어지며 **자유 전자(Free Electron)**와 **정공(Hole)**이 쌍으로 생성됨.\n\n---\n\n\n### 📊 [확실한 그림 자료 4] 실리콘 공유결합 격자 및 전자-정공 쌍(EHP) 생성 메커니즘\n> 근거 ID: [44:28]~[53:08], [50:07] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Step1 [\"(a) 상온 이전: 완전한 공유결합 상태 (Covalent Bonds)\"]\n        S1[\"Si 원자 (최외각 4개 전자, sp³ 혼성 오비탈)<br/>인접한 4개 Si 원자와 2개씩 전자 공유하여 결합<br/>원자 밀도: 5 × 10²² atoms/cm³ | 자유전자 없음\"]\n    end\n\n    subgraph Step2 [\"(b) 외부 에너지 인가 (Thermal Energy / T 상승)\"]\n        S2[\"열 진동에 의해 Si-Si 공유결합 파괴 (Bond Broken)\"]\n    end\n\n    subgraph Step3 [\"(c) 캐리어 쌍 동시 생성 (Carrier Pair Generation)\"]\n        S3A[\"자유 전자 (Free Electron)<br/>결합에서 빠져나와 전도대로 이동<br/>전류 전도 기여\"]\n        S3B[\"정공 (Hole, 빈자리)<br/>전자가 빠져나간 빈 공간<br/>양전하 캐리어로 거동\"]\n    end\n\n    Step1 --> Step2\n    Step2 --> S3A\n    Step2 --> S3B\n\n    style Step1 fill:#0f172a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style Step2 fill:#0f172a,stroke:#f59e0b,stroke-width:1.5px,color:#fff\n    style Step3 fill:#0f172a,stroke:#10b981,stroke-width:1.5px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"230\" viewBox=\"0 0 720 230\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0;\">\n  <text x=\"360\" y=\"24\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"15\" font-weight=\"bold\">실리콘 격자의 전자-정공 쌍(EHP) 생성 메커니즘</text>\n\n  <!-- (a) 완전 공유 결합 격자 -->\n  <g transform=\"translate(40, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"280\" height=\"170\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.2\"/>\n    <text x=\"140\" y=\"22\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\">(a) 완전 공유결합 격자 (저온)</text>\n    \n    <!-- 격자선 -->\n    <path d=\"M60,60 H220 M60,105 H220 M60,150 H220 M60,60 V150 M140,60 V150 M220,60 V150\" stroke=\"#475569\" stroke-width=\"2\"/>\n    \n    <!-- 원자들 -->\n    <g fill=\"#0284c7\">\n      <circle cx=\"60\" cy=\"60\" r=\"14\"/><text x=\"60\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"140\" cy=\"60\" r=\"14\"/><text x=\"140\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"220\" cy=\"60\" r=\"14\"/><text x=\"220\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"60\" cy=\"105\" r=\"14\"/><text x=\"60\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"140\" cy=\"105\" r=\"14\"/><text x=\"140\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"220\" cy=\"105\" r=\"14\"/><text x=\"220\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n    </g>\n    <!-- 공유 전자쌍 -->\n    <g fill=\"#93c5fd\">\n      <circle cx=\"100\" cy=\"60\" r=\"3\"/><circle cx=\"100\" cy=\"105\" r=\"3\"/>\n      <circle cx=\"180\" cy=\"60\" r=\"3\"/><circle cx=\"180\" cy=\"105\" r=\"3\"/>\n      <circle cx=\"140\" cy=\"82\" r=\"3\"/><circle cx=\"60\" cy=\"82\" r=\"3\"/><circle cx=\"220\" cy=\"82\" r=\"3\"/>\n    </g>\n  </g>\n\n  <!-- (b) 열에너지 공급 시 결합 파괴 및 생성 -->\n  <g transform=\"translate(400, 40)\ <text x=\"155\" y=\"90\" fill=\"#fde047\" font-size=\"9\" font-weight=\"bold\">자유전자 (Free e⁻)</text>\n    \n    <text x=\"140\" y=\"155\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"11\" font-weight=\"bold\">생성 법칙: n (자유전자 수) = p (정공 수)</text>\n  </g>\n</svg>\n</div>\n\n\n\n### 📊 [확실한 그림 자료 5] 트랜지스터(Transfer + Resistor)의 본질: 가변 저항 및 I-V 기울기 변조\n> 근거 ID: [41:48]~[43:08] `핵심`\n\n```mermaid\nflowchart LR\n    INPUT[\"입력 전압 / 게이트 바이어스 제어\"] --> MOD[\"채널 저항(Resistance) 동적 변조\"]\n    MOD --> SLOPE[\"I-V 특성 곡선의 기울기(Conductance = 1/R) 변화\"]\n    SLOPE --> SWITCH[\"완벽한 스위칭 동작 (On: 대전류 / Off: 극미세 누설전류)\"]\n    \n    style INPUT fill:#0f172a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style MOD fill:#0f172a,stroke:#f59e0b,stroke-width:1.5px,color:#fff\n    style SLOPE fill:#0f172a,stroke:#818cf8,stroke-width:1.5px,color:#fff\n    style SWITCH fill:#064e3b,stroke:#10b981,stroke-width:2px,color:#fff\n```\n\n### 📊 [확실한 그림 자료 4] 실리콘 공유결합 격자 및 전자-정공 쌍(EHP) 생성 메커니즘\n> 근거 ID: [44:28]~[53:08], [50:07] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph S_Step1 [\"(a) 상온 이전: 완전한 공유결합 상태\"]\n        S1[\"Si 원자 (최외각 4개 전자, sp³ 혼성 오비탈)<br/>인접한 4개 Si 원자와 2개씩 전자 공유 결합<br/>원자 밀도: 5 × 10²² atoms/cm³ | 자유전자 없음\"]\n    end\n\n    subgraph S_Step2 [\"(b) 외부 에너지 인가 (Thermal Energy)\"]\n        S2[\"열 진동에 의해 Si-Si 공유결합 파괴 (Bond Broken)\"]\n    end\n\n    subgraph S_Step3 [\"(c) 캐리어 쌍 동시 생성 (Pair Generation)\"]\n        S3A[\"자유 전자 (Free Electron)<br/>결합 이탈 후 전도대로 이동<br/>전류 전도 참여\"]\n        S3B[\"정공 (Hole, 빈자리)<br/>전자가 빠져나간 빈 공간<br/>양전하 캐리어로 거동\"]\n    end\n\n    S1 --> S2\n    S2 --> S3A\n    S2 --> S3B\n\n    style S1 fill:#0f172a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style S2 fill:#0f172a,stroke:#f59e0b,stroke-width:1.5px,color:#fff\n    style S3A fill:#064e3b,stroke:#10b981,stroke-width:1.5px,color:#fff\n    style S3B fill:#450a0a,stroke:#ef4444,stroke-width:1.5px,color:#fff\n```\n\n<div align=\"center\" style=\"margin: 16px 0; page-break-inside: avoid;\">\n<svg width=\"10
