or=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Si</text>\n    </g>\n    <g fill=\"#93c5fd\">\n      <circle cx=\"100\" cy=\"56\" r=\"3\"/><circle cx=\"100\" cy=\"100\" r=\"3\"/>\n      <circle cx=\"180\" cy=\"56\" r=\"3\"/><circle cx=\"180\" cy=\"100\" r=\"3\"/>\n      <circle cx=\"140\" cy=\"78\" r=\"3\"/><circle cx=\"60\" cy=\"78\" r=\"3\"/><circle cx=\"220\" cy=\"78\" r=\"3\"/>\n    </g>\n  </g>\n  <g transform=\"translate(400, 36)\">\n    <rect x=\"0\" y=\"0\" width=\"280\" height=\"166\" rx=\"6\" fill=\"#1e293b\" stroke=\"#10b981\" stroke-width=\"1.2\"/>\n    <text x=\"140\" y=\"22\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"12\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">(b) 열에너지 공급 시 EHP 동시 생성</text>\n    <path d=\"M60,56 H220 M60,100 H220 M60,144 H220 M60,56 V144 M140,56 V144 M220,56 V144\" stroke=\"#475569\" stroke-width=\"2\"/>\n    <g fill=\"#0284c7\">\n      <circle cx=\"60\" cy=\"56\" r=\"13\"/><text x=\"60\" y=\"60\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Si</text>\n      <circle cx=\"140\" cy=\"56\" r=\"13\"/><text x=\"140\" y=\"60\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Si</text>\n      <circle cx=\"220\" cy=\"56\" r=\"13\"/><text x=\"220\" y=\"60\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Si</text>\n      <circle cx=\"60\" cy=\"100\" r=\"13\"/><text x=\"60\" y=\"104\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Si</text>\n      <circle cx=\"140\" cy=\"100\" r=\"13\"/><text x=\"140\" y=\"104\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Si</text>\n      <circle cx=\"220\" cy=\"100\" r=\"13\"/><text x=\"220\" y=\"104\ ote_example.md`\n- 특징: 확실한 그림 자료(Mermaid + SVG) 적용 완료, 제외 내용 완전 제거\n\n---\n\n# Claude Haiku 4.5 강의 요약 노트\n\n- 모델 ID: `anthropic/claude-haiku-4.5`\n- 소요 시간: 33.1초\n- 생성 글자 수: 9672자\n- 기준 강의 파일: `electric_circuits_note_example.md`\n- 특징: 확실한 그림 자료(Mermaid + SVG) 적용 완료, 제외 내용 완전 제거\n\n---\n\n# EEE2050 Lecture 3: Basic Semiconductor Physics 학습 자료\n\n## 📌 핵심 결론\n\n| 항목 | 내용 | 근거 |\n|------|------|------|\n| **반도체의 정의** | 절연체와 전도체 사이의 중간 저항성을 가진 물질 | [20:08] |\n| **Si 선택 이유** | Ge보다 저가, 낮은 누설전류, 높은 항복전압, SiO₂ 형성 가능 | [40:00] |\n| **실리콘 원자구조** | 4개 원자가전자(valence electrons) → 공유결합 형성 | [50:07] |\n| **온도 상승 효과** | 열 에너지로 공유결합 파괴 → 자유전자·정공 생성 | [50:07] |\n\n---\n\n## 1️⃣ 반도체 기초 개념\n\n### 1.1 에너지 밴드 구조 (Band Structure)\n**근거: [07:39], [08:28]**\n\n**정의**\n- **밴드(Band)**: 고체 내에서 전자가 점유할 수 있는 허용 에너지 상태의 모임 [09:08] | 핵심\n\n**세 가지 재료 비교**\n\n| 재료 | 밴드갭(Eg) | 특징 | 예시 |\n|------|-----------|------|------|\n| **절연체** | >5 eV | 가전자밴드와 전도밴드 분리 | SiO₂ |\n| **반도체** | 1~3 eV | 중간 갭 → 열/전기로 전자 여기 가능 | Si(1.1 eV), Ge(0.67 eV) |\n| **전도체** | 0 eV | 밴드 겹침(overlap) | Cu, Au |\n\n**정정:** 강의 음성에서 \"절연체 5 eV 초과\"로 표현되었으나 정확한 기준값 미제시 [16:28]\n\n\n\n### 📊 [확실한 그림 자료 1] 물질별 에너지 밴드 구조 비교 (Energy Band Diagram)\n> 근거 ID: [07:39], [15:08]~[18:28] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Insulator [\"절연체 (Insulator)\"]\n        direction TB\n        CB1[\"전도대 (Conduction Band)<br/>전자가 거의 없음 (비어있음)\"]\n        GAP1[\"에너지 밴드갭 (Bandgap)<br/>Eg > 5 eV (매우 큼: 전자 이동 불가)\"]\n        VB1[\"원자가대 (Valence Band)<br/>원자핵에 강하게 구속, 전자 가득 참\"]\n        CB1 --- GAP1 --- VB1\n    end\n\n    subgraph Semiconductor [\"반도체 (Semiconductor)\"]\n        direction TB\n        CB2[\"전도대 (Conduction Band)<br/>외부 에너지 공급 시 전자 전이\"]\n        GAP2[\"에너지 밴드갭 (Bandgap)<br/>Eg ≈ 1.1 eV (Si) / 0.67 eV (Ge)\"]\n        VB2[\"원자가대 (Valence Band)<br/>상온에서 전자가 쉽게 이탈 가능\"]\n        CB2 --- GAP2 --- VB2\n    end\n\n    subgraph Conductor [\"도체 (Conductor)\"]\n        direction TB\n        OVL[\"전도대 (CB) & 원자가대 (VB)<br/>서로 겹침 (Overlap, Eg = 0 eV)<br/>상온에서도 무수한 자유전자가 이동\"]\n    end\n\n    style Insulator fill:#1e293b,stroke:#ef4444,stroke-width:2px,color:#fff\n    style Semiconductor fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style Conductor fill:#1e293b,stroke:#10b981,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"260\" viewBox=\"0 0 720 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0;\">\n  <!-- 제목 -->\n  <text x=\"360\" y=\"25\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"15\" font-weight=\"bold\">물질별 에너지 밴드 구조 비교 (Energy Band Structure)</text>\n  \n  <!-- 절연체 -->\n  <g transform=\"translate(40, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"13\" font-weight=\"bold\">절연체 (Insulator)</text>\n    <!-- 전도대 -->\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"35\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"12\">전도대 (Conduction Band)</text>\n    <!-- 밴드갭 화살표 & 레이블 -->\n    <line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"128\" stroke=\"#f87171\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n    <polygon points=\"90,52 86,60 94,60\" fill=\"#f87171\"/>\n    <polygon points=\"90,128 86,120 94,120\" fill=\"#f87171\"/>\n    <rect x=\"45\" y=\"80\" width=\"90\" height=\"22\" rx=\"3\" fill=\"#450a0a\" stroke=\"#ef4444\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"95\" text-anchor=\"middle\" fill=\"#fca5a5\" font-size=\"11\" font-weight=\"bold\">Eg > 5 eV (거대함)</text>\n    <!-- 원자가대 -->\n    <rect x=\"10\" y=\"130\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"155\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"12\">원자가대 (Valence Band)</text>\n  </g>\n\n  <!-- 반도체 -->\n  <g transform=\"translate(270, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\">반도체 (Semiconductor)</text>\n    <!-- 전도대 -->\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"35\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"12\">전도대 (Conduction Band)</text>\n    <!-- 밴드갭 화살표 & 레이블 -->\n    <line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"88\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n    <polygon points=\"90,52 86,58 94,58\" fill=\"#38bdf8\"/>\n    <polygon points=\"90,88 86,82 94,82\" fill=\"#38bdf8\"/>\n    <rect x=\"40\" y=\"60\" width=\"100\" height=\"22\" rx=\"3\" fill=\"#082f49\" stroke=\"#38bdf8\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"75\" text-anchor=\"middle\" fill=\"#7dd3fc\" font-size=\"11\" font-weight=\"bold\">Eg ≈ 1.1 eV (Si)</text>\n    <!-- 원자가대 -->\n    <rect x=\"10\" y=\"90\" width=\"160\" height=\"80\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"135\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"12\">원자가대 (Valence Band)</text>\n  </g>\n\n  <!-- 전도체 -->\n  <g transform=\"translate(500, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\">도체 (Conductor)</text>\n    <!-- 겹침 밴드 -->\n    <rect x=\"10\" y=\"20\" width=\"160\" height=\"150\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n    <rect x=\"10\" y=\"60\" width=\"160\" height=\"40\" fill=\"#047857\" opacity=\"0.6\"/>\n    <text x=\"90\" y=\"45\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"12\">전도대 (CB)</text>\n    <text x=\"90\" y=\"83\" text-anchor=\"middle\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\">Overlap (Eg = 0 eV)</text>\n    <text x=\"90\" y=\"145\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"12\">원자가대 (VB)</text>\n  </g>\n</svg>\n</div>\n\n\n\n### 📊 [확실한 그림 자료 1] 물질별 에너지 밴드 구조 비교 (Energy Band Diagram)\n> 근거 ID: [07:39], [15:08]~[18:28] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Insulator [\"절연체 (Insulator)\"]\n        direction TB\n        CB1[\"전도대 (Conduction Band)<br/>전자가 거의 없음 (비어있음)\"]\n        GAP1[\"에너지 밴드갭 (Bandgap)<br/>Eg: 5 eV 초과 (거대한 금지대)\"]\n        VB1[\"원자가대 (Valence Band)<br/>원자핵에 구속, 전자 가득 참\"]\n        CB1 --- GAP1\n        GAP1 --- VB1\n    end\n\n    subgraph Semiconductor [\"반도체 (Semiconductor)\"]\n        direction TB\n        CB2[\"전도대 (Conduction Band)<br/>외부 에너지 공급 시 전자 전이\"]\n        GAP2[\"에너지 밴드갭 (Bandgap)<br/>Eg 약 1.1 eV (Si) / 0.67 eV (Ge)\"]\n        VB2[\"원자가대 (Valence Band)<br/>상온에서 전자가 쉽게 이탈 가능\"]\n        CB2 --- GAP2\n        GAP2 --- VB2\n    end\n\n    subgraph Conductor [\"도체 (Conductor)\"]\n        direction TB\n        OVL[\"전도대 (CB) & 원자가대 (VB)<br/>서로 겹침 (Overlap, Eg = 0 eV)<br/>상온에서도 무수한 자유전자 이동\"]\n    end\n\n    style CB1 fill:#1e3a8a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style GAP1 fill:#450a0a,stroke:#ef4444,stroke-width:1.5px,color:#fff\n    style VB1 fill:#312e81,stroke:#818cf8,stroke-width:1.5px,color:#fff\n    style CB2 fill:#1e3a8a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style GAP2 fill:#082f49,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style VB2 fill:#312e81,stroke:#818cf8,stroke-width:1.5px,color:#fff\n    style OVL fill:#064e3b,stroke:#34d399,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\" style=\"margin: 16px 0; page-break-inside: avoid;\">\n<svg width=\"100%\" height=\"auto\" viewBox=\"0 0 720 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:720px; display:block; margin:0 auto; background:#0f172a; border-radius:8px; border:1px solid #334155;\">\n  <rect width=\"100%\" height=\"100%\" fill=\"#0f172a\" rx=\"8\"/>\n  <text x=\"360\" y=\"26\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"14\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">물질별 에너지 밴드 구조 비교 (Energy Band Structure)</text>\n  <g transform=\"translate(40, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">절연체 (Insulator)</text>\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"33\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (Conduction Band)</text>\n    <line x1=\"90\" y1=\"48\" x2=\"90\" y2=\"122\" stroke=\"#f87171\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n    <polygon points=\"90,48 86,56 94,56\" fill=\"#f87171\"/>\n    <polygon points=\"90,122 86,114 94,114\" fill=\"#f87171\"/>\n    <rect x=\"42\" y=\"75\" width=\"96\" height=\"20\" rx=\"3\" fill=\"#450a0a\" stroke=\"#ef4444\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"89\" text-anchor=\"middle\" fill=\"#fca5a5\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Eg &gt; 5 eV (매우 큼)</text>\n    <rect x=\"10\" y=\"125\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"148\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (Valence Band)</text>\n  </g>\n  <g transform=\"translate(270, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">반도체 (Semiconductor)</text>\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"33\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (Conduction Band)</text>\n    <line x1=\"90\" y1=\"48\" x2=\"90\" y2=\"82\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n    <polygon points=\"90,48 86,54 94,54\" fill=\"#38bdf8\"/>\n    <polygon points=\"90,82 86,76 94,76\" fill=\"#38bdf8\"/>\n    <rect x=\"36\" y=\"56\" width=\"108\" height=\"20\" rx=\"3\" fill=\"#082f49\" stroke=\"#38bdf8\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"70\" text-anchor=\"middle\" fill=\"#7dd3fc\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Eg ≈ 1.1 eV (Si)</text>\n    <rect x=\"10\" y=\"85\" width=\"160\" height=\"76\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"130\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (Valence Band)</text>\n  </g>\n  <g transform=\"translate(500, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">도체 (Conductor)</text>\n    <rect x=\"10\" y=\"15\" width=\"160\" height=\"146\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n    <rect x=\"10\" y=\"55\" width=\"160\" height=\"36\" fill=\"#047857\" opacity=\"0.6\"/>\n    <text x=\"90\" y=\"40\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (CB)</text>\n    <text x=\"90\" y=\"77\" text-anchor=\"middle\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Overlap (Eg = 0 eV)</text>\n    <text x=\"90\" y=\"135\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (VB)</text>\n  </g>\n</svg>\n</div>\n\n### 1.2 가전자밴드(Valence Band) vs 전도밴드(Conduction Band)\n\n| 속성 | 가전자밴드 | 전도밴드 |\n|------|----------|--------|\n| **위치** | 낮은 에너지 | 높은 에너지 |\n| **전자 결합** | 원자핵에 강하게 결합 | 느슨하게 결합 |\n| **초기 상태** | 거의 완전히 찬 상태 | 거의 비어있음 |\n| **전류 흐름** | 불가능 | 가능 |\n\n**직관:** 가전자밴드 전자는 핵에 가까워 묶여있고, 전도밴드 전자는 멀어서 자유롭게 이동 가능 [10:28]~[13:48] | 중요\n\n### 1.3 밴드갭(Energy Gap, Eg)\n\n**정의:** 가전자밴드 최대값과 전도밴드 최소값 사이의 에너지 차이 [17:48] | 중요\n\n**특징**\n- 밴드갭 내에는 **전자가 점유할 수 있는 상태가 없음** [18:28]\n- 반도체 특성 결정의 핵심 매개변수\n\n**대표 값**\n- Silicon (Si): **1.1 eV** [17:48]\n- Germanium (Ge): **0.67 eV** [33:48]\n\n---\n\n## 2️⃣ 반도체 재료\n\n### 2.1 반도체 분류\n\n**근거: [27:19]** | 참고\n\n#### (1) 원소 반도체\n- **Group 4** (14족) 재료\n  - Si (실리콘): **가장 광범위 사용** [29:48]\n  - Ge (게르마늄): 초기 트랜지스터 재료 → 현재 거의 미사용 [29:28]\n  - C (탄소): 산업 적용 제한 [29:08]\n\n#### (2) 화합물 반도체\n- III-V족: InP, GaAs\n- II-VI족: CdTe (태양전지 고효율용) [31:48]\n- IV-VI족: PbS\n\n**주석:** 강의에서 \"Group 4\"와 \"Group 14\"의 표기법 차이 설명: 반도체산업은 10을 제거하여 Group 4로 표기 [28:28] | 참고\n\n### 2.2 실리콘이 선호되는 이유\n\n**근거: [40:00]** | 중요\n\n| 순위 | 이유 | 상세 | Ge와 비교 |\n|------|------|------|---------|\n| 1 | **저가** | 풍부한 자원, 생산 용이 | Ge는 고가 |\n| 2 | **낮은 누설전류** | 밴드갭이 큼 (1.1 vs 0.67 eV) → 전류 제어 용이 | Ge는 제어 곤란 |\n| 3 | **고온 안정성** | Ge 결정은 고온/고압에서 쉽게 파괴 | Si는 안정적 |\n| 4 | **높은 항복전압** | 고전압 인가 시 파괴 저항성 우수 | Ge는 저항성 낮음 |\n| 5 | **SiO₂ 형성** | Si 표면에 우수한 절연층 형성 → 트랜지스터/캐패시터 제조 가능 | Ge는 불가능 |\n\n**조건:** 트랜지스터/다이오드는 스위치로 사용될 때 누설전류(off-current) 작아야 함 [37:08] | 중요\n\n---\n\n## 3️⃣ 반도체 결정 구조\n\n### 3.1 구조 유형\n\n**근거: [20:08], [22:28]~[24:28]** | 중요\n\n| 구조 | 원자 배열 | 용도 | 특징 |\n|------|---------|------|------|\n| **결정질(Crystalline)** | 규칙적, 잘 정렬 | IC 소자 (표준) | 전자 거동 예측 가능 |\n| **다결정질(Polycrystalline)** | 여러 결정 영역 연결 | 태양전지 등 | 결정입계(grain boundary) 존재 |\n| **비결정질(Amorphous)** | 무작위 배열 | 최근 상용화 | 전자 거동 예측 불가 |\n\n**결정입계(Grain Boundary):** 서로 다른 결정 영역 사이의 경계 [24:28] | 참고\n\n### 3.2 결정 구조 중요성\n\n**근거: [25:48]~[26:28]** | 핵심\n\n- 현대 반도체 공정(~3nm)에서 Si 원자 배치가 규칙적이어야 전자 거동 예측 가능\n- **비정렬 Si는 내부 전자 거동 계산 불가능**\n- 따라서 **결정질 Si만 사용** [26:28]\n\n---\n\n## 4️⃣ 실리콘 원자 구조\n\n### 4.1 전자 배치 및 원자가전자\n\n**근거: [43:48]~[50:07]** | 중요\n\n**전자 배치:** \n$$\\text{Si: } 1s^2 \\, 2s^2 \\, 2p^6 \\, 3s^2 \\, 3p^2$$\n\n**원자핵**과 에너지 준위:\n- 1s², 2s², 2p⁶: 핵에 강하게 결합 (에너지 차이 큼)\n- **3s², 3p²**: 핵에서 멀리 떨어짐 (에너지 차이 작음) → **원자가전자** [45:08]\n\n**원자가전자의 역할:**\n- 3s²와 3p²는 에너지가 가까워 **sp³ 혼성화(hybridization)** 형성 [47:08] | 중요\n- **총 4개 원자가전자** → 이웃한 4개 원자와 공유결합 형성\n\n$$\\text{원자가전자 수} = 4$$\n\n### 4.2 실리콘 격자 구조\n\n**근거: [47:48]~[50:07]** | 중요\n\n**공유결합(Covalent Bond)**\n- Si 원자의 4개 원자가전자가 이웃 4개 Si 원자와 쌍을 이루어 결합\n- 각 결합 = 한 쌍의 전자 (1 covalent bond)\n- 표기: 직선 = 전자 쌍 (sp³ 혼성궤도에서 생성)\n\n| 상태 | 묘사 |\n|------|------|\n| **상온** | 모든 원자가전자가 공유결합에 참여 (고체 형성) |\n| **고온** | 열 에너지 → 결합 파괴 |\n\n### 4.3 온도 상승에 따른 변화\n\n**근거: [50:28]~[53:08]** | 중요\n\n**공유결합 파괴 메커니즘:**\n\n1. **열에너지 인가** → 공유결합 깨짐 [51:08]\n2. **자유전자(Free Electron) 생성**: \n   - 전자가 결합에서 벗어나 자유롭게 이동 가능 [51:48]\n   - 전도밴드로 여기(excitation)\n\n3. **정공(Hole) 생성**:\n   - 전자가 떠난 자리에 \"비어있는 상태\" 생김 [52:28]\n   - 인접 전자가 채우려고 하면서 정공도 이동 [53:08]\n\n**관계식:**\n$$\\text{자유전자 농도} = \\text{정공 농도}$$\n**조건:** 고순도 반도체에서만 성립 [53:08] | 중요\n\n---\n\n## 5️⃣ 반도체의 기본 성질\n\n### 5.1 저항률(Resistivity)\n\n**근거: [20:08]** | 중요\n\n$$\\text{반도체 저항률} = \\text{저항률}_{\\text{절연체}} \\text{ (높음)} > \\text{반도체 저항률} > \\text{저항률}_{\\text{전도체}} \\text{ (낮음)}$$\n\n| 물질 | 저항률 | 분류 |\n|------|--------|------|\n| 높음 | 절연체 |  |\n| 중간 | **반도체** | ← 산업 사용 |\n| 낮음 | 전도체 |  |\n\n### 5.2 실리콘의 물리 상수\n\n**근거: [50:07]** | 중요\n\n| 성질 | 값 | 단위 |\n|------|-----|------|\n| **원자 밀도** | $5 \\times 10^{22}$ | atoms/cm³ |\n| **원자가전자** | 4 | 개 |\n\n### 5.3 저항 변조(Transistor의 원리)\n\n**근거: [42:28]~[43:08]** | 중요\n\n**Transistor 정의:**\n- **Transfer + Resistor** = 저항 전달/변조 소자\n- **기능**: 외부 신호에 의해 자신의 저항값 변화 가능\n\n$$\\text{저항} \\propto \\text{(제어 신호)}$$\n\n**직관:** I-V 곡선의 기울기(=1/R)가 제어 신호에 따라 변함 [42:28] | 중요\n\n---\n\n## 📋 핵심 공식 및 관계식\n\n| 식 | 명칭 | 적용 조건 | 의미 |\n|-------|------|---------|------|\n| $E_g = E_c - E_v$ | 밴드갭 에너지 | 모든 반도체 | 전도밴드와 가전자밴드 사이 에너지 차이 |\n| $n_i = n_0 = p_0$ | 내재적 반도체 | 고순도 Si, 열평형 상태 | 자유전자 수 = 정공 수 |\n\n---\n\n## 🚫 제외 항목 및 이유\n\n| 내용 | 위치 | 제외 이유 |\n|------|------|---------|\n| \"All right, it's time to get started. All you guys doing...\" | [01:08] | 반복 인사 및 진행 안내 |\n| \"Are you excited? Because we are going to play the real game...\" | [01:48] | 무관한 독려 발언 |\n| 강의 녹음 정책 설명 | [04:53]~[06:28] | 학습 무관 행정 안내 (중요도 FYI 태그) |\n| \"Any questions? Any questions? Yes? Any other questions?\" | [06:28], [07:08] | 명백한 중복 |\n| SpaceX 위성 태양전지 언급 | [31:48] | 응용 사례이나 핵심 내용 아님 (참고 수준) |\n| \"Teacher, can you explain this...\" 형식 반복 | 전체 | 청중 질문 인정하되 장문 재현 제외 |\n\n---\n\n## 📚 Reading 자료\n- **Chapter 2.1** [07:09]\n\n**작성 기준:** 음성 인식 오류 수정하여 반영, 근거 미제시 추론 제외\n"},{"name":"Claude Sonnet 5","id":"anthropic/claude-sonnet-5","slug":"06_claude_sonnet_5","elapsed":"53.1","charCount":14239,"content":"# Claude Sonnet 5 강의 요약 노트\n\n- 모델 ID: `anthropic/claude-sonnet-5`\n- 소요 시간: 53.1초\n- 생성 글자 수: 14239자\n- 기준 강의 파일: `electric_circuits_note_example.md`\n- 특징: 확실한 그림 자료(Mermaid + SVG) 적용 완료, 제외 내용 완전 제거\n\n---\n\n# Claude Sonnet 5 강의 요약 노트\n\n- 모델 ID: `anthropic/claude-sonnet-5`\n- 소요 시간: 53.1초\n- 생성 글자 수: 9000자\n- 기준 강의 파일: `electric_circuits_note_example.md`\n- 특징: 확실한 그림 자료(Mermaid + SVG) 적용 완료, 제외 내용 완전 제거\n\n---\n\n# EEE2050 Lecture 3: 반도체 기초 물리학 — 학습 노트\n\n---\n\n## 🎯 핵심 결론 요약 (시험 중요도 최상)\n\n### 1. 실리콘(Si)이 게르마늄(Ge)보다 선호되는 5가지 이유 [40:00] **핵심**\n> $\\text{Si} > \\text{Ge}$ (소자 재료로서)\n\n| 번호 | 이유 | 세부 내용 |\n|---|---|---|\n| 1 | 가격 | Si가 Ge보다 훨씬 저렴 [34:28] |\n| 2 | Off-current(누설 전류) | Si의 누설 전류가 훨씬 작음 → 스위치 온/오프 구분이 명확함 [35:08]~[37:08] |\n| 3 | 열적 안정성 | Ge 결정은 고온/고압에서 쉽게 파괴됨 [37:48]~[38:28] |\n| 4 | 항복 전압(Breakdown voltage) | Si의 항복 전압이 더 높음 → 고전압에서도 안정적 [38:28]~[39:08] |\n| 5 | SiO₂ 형성 가능 | Si는 산화되어 절연체인 SiO₂를 쉽게 형성 → 캐패시터/트랜지스터 제작에 필수 [39:08]~[41:48] |\n\n- **정정 사항**: Ge은 최초의 접촉식 트랜지스터(point contact transistor) 재료였으나 문제가 많아 Si로 전환됨 [30:28] **참고**\n\n---\n\n### 2. 밴드갭(Band Gap) 수치 — 절연체·반도체·도체 비교 [15:08]~[18:28] **핵심**\n\n$$E_g = \\text{(전도 밴드 최저점)} - \\text{(발렌스 밴드 최고점)}$$\n\n| 물질 | 밴드갭 $E_g$ | 비고 |\n|---|---|---|\n| 절연체(Insulator) | $E_g > 5\\ \\text{eV}$ (약 5 eV 이상) | 큰 에너지 필요 → 부도체 |\n| 반도체(Semiconductor) | $1\\ \\text{eV} < E_g < 3\\ \\text{eV}$ | 실리콘 예외: $E_g \\approx 1.1\\ \\text{eV}$ |\n| 도체(Conductor) | $E_g = 0$ (밴드 오버랩) | 자유전자 이동 용이 |\n| 게르마늄(Ge) | $E_g = 0.67\\ \\text{eV}$ | Si보다 작아 전류제어 어려움 [33:48] |\n\n- **조건/직관적 의미**: 밴드갭이 작을수록 적은 에너지로도 전자를 발렌스 밴드→전도 밴드로 여기(excite) 가능 → 전도성 조절 용이 [13:48]~[17:08] **핵심**\n- 밴드갭 내부에는 \"no state\"(허용된 에너지 상태 없음) — 전자가 존재할 수 없는 구간 [18:28]~[19:48] **중요**\n\n---\n\n\n\n### 📊 [확실한 그림 자료 1] 물질별 에너지 밴드 구조 비교 (Energy Band Diagram)\n> 근거 ID: [07:39], [15:08]~[18:28] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Insulator [\"절연체 (Insulator)\"]\n        direction TB\n        CB1[\"전도대 (Conduction Band)<br/>전자가 거의 없음 (비어있음)\"]\n        GAP1[\"에너지 밴드갭 (Bandgap)<br/>Eg > 5 eV (매우 큼: 전자 이동 불가)\"]\n        VB1[\"원자가대 (Valence Band)<br/>원자핵에 강하게 구속, 전자 가득 참\"]\n        CB1 --- GAP1 --- VB1\n    end\n\n    subgraph Semiconductor [\"반도체 (Semiconductor)\"]\n        direction TB\n        CB2[\"전도대 (Conduction Band)<br/>외부 에너지 공급 시 전자 전이\"]\n        GAP2[\"에너지 밴드갭 (Bandgap)<br/>Eg ≈ 1.1 eV (Si) / 0.67 eV (Ge)\"]\n        VB2[\"원자가대 (Valence Band)<br/>상온에서 전자가 쉽게 이탈 가능\"]\n        CB2 --- GAP2 --- VB2\n    end\n\n    subgraph Conductor [\"도체 (Conductor)\"]\n        direction TB\n        OVL[\"전도대 (CB) & 원자가대 (VB)<br/>서로 겹침 (Overlap, Eg = 0 eV)<br/>상온에서도 무수한 자유전자가 이동\"]\n    end\n\n    style Insulator fill:#1e293b,stroke:#ef4444,stroke-width:2px,color:#fff\n    style Semiconductor fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style Conductor fill:#1e293b,stroke:#10b981,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"260\" viewBox=\"0 0 720 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0;\">\n  <!-- 제목 -->\n  <text x=\"360\" y=\"25\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"15\" font-weight=\"bold\">물질별 에너지 밴드 구조 비교 (Energy Band Structure)</text>\n  \n  <!-- 절연체 -->\n  <g transform=\"translate(40, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"13\" font-weight=\"bold\">절연체 (Insulator)</text>\n    <!-- 전도대 -->\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"35\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"12\">전도대 (Conduction Band)</text>\n    <!-- 밴드갭 화살표 & 레이블 -->\n    <line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"128\" stroke=\"#f87171\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n    <polygon points=\"90,52 86,60 94,60\" fill=\"#f87171\"/>\n    <polygon points=\"90,128 86,120 94,120\" fill=\"#f87171\"/>\n    <rect x=\"45\" y=\"80\" width=\"90\" height=\"22\" rx=\"3\" fill=\"#450a0a\" stroke=\"#ef4444\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"95\" text-anchor=\"middle\" fill=\"#fca5a5\" font-size=\"11\" font-weight=\"bold\">Eg > 5 eV (거대함)</text>\n    <!-- 원자가대 -->\n    <rect x=\"10\" y=\"130\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"155\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"12\">원자가대 (Valence Band)</text>\n  </g>\n\n  <!-- 반도체 -->\n  <g transform=\"translate(270, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\">반도체 (Semiconductor)</text>\n    <!-- 전도대 -->\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"35\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"12\">전도대 (Conduction Band)</text>\n    <!-- 밴드갭 화살표 & 레이블 -->\n    <line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"88\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n    <polygon points=\"90,52 86,58 94,58\" fill=\"#38bdf8\"/>\n    <polygon points=\"90,88 86,82 94,82\" fill=\"#38bdf8\"/>\n    <rect x=\"40\" y=\"60\" width=\"100\" height=\"22\" rx=\"3\" fill=\"#082f49\" stroke=\"#38bdf8\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"75\" text-anchor=\"middle\" fill=\"#7dd3fc\" font-size=\"11\" font-weight=\"bold\">Eg ≈ 1.1 eV (Si)</text>\n    <!-- 원자가대 -->\n    <rect x=\"10\" y=\"90\" width=\"160\" height=\"80\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"135\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"12\">원자가대 (Valence Band)</text>\n  </g>\n\n  <!-- 전도체 -->\n  <g transform=\"translate(500, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\">도체 (Conductor)</text>\n    <!-- 겹침 밴드 -->\n    <rect x=\"10\" y=\"20\" width=\"160\" height=\"150\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n    <rect x=\"10\" y=\"60\" width=\"160\" height=\"40\" fill=\"#047857\" opacity=\"0.6\"/>\n    <text x=\"90\" y=\"45\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"12\">전도대 (CB)</text>\n    <text x=\"90\" y=\"83\" text-anchor=\"middle\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\">Overlap (Eg = 0 eV)</text>\n    <text x=\"90\" y=\"145\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"12\">원자가대 (VB)</text>\n  </g>\n</svg>\n</div>\n\n\n\n### 📊 [확실한 그림 자료 1] 물질별 에너지 밴드 구조 비교 (Energy Band Diagram)\n> 근거 ID: [07:39], [15:08]~[18:28] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Insulator [\"절연체 (Insulator)\"]\n        direction TB\n        CB1[\"전도대 (Conduction Band)<br/>전자가 거의 없음 (비어있음)\"]\n        GAP1[\"에너지 밴드갭 (Bandgap)<br/>Eg: 5 eV 초과 (거대한 금지대)\"]\n        VB1[\"원자가대 (Valence Band)<br/>원자핵에 구속, 전자 가득 참\"]\n        CB1 --- GAP1\n        GAP1 --- VB1\n    end\n\n    subgraph Semiconductor [\"반도체 (Semiconductor)\"]\n        direction TB\n        CB2[\"전도대 (Conduction Band)<br/>외부 에너지 공급 시 전자 전이\"]\n        GAP2[\"에너지 밴드갭 (Bandgap)<br/>Eg 약 1.1 eV (Si) / 0.67 eV (Ge)\"]\n        VB2[\"원자가대 (Valence Band)<br/>상온에서 전자가 쉽게 이탈 가능\"]\n        CB2 --- GAP2\n        GAP2 --- VB2\n    end\n\n    subgraph Conductor [\"도체 (Conductor)\"]\n        direction TB\n        OVL[\"전도대 (CB) & 원자가대 (VB)<br/>서로 겹침 (Overlap, Eg = 0 eV)<br/>상온에서도 무수한 자유전자 이동\"]\n    end\n\n    style CB1 fill:#1e3a8a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style GAP1 fill:#450a0a,stroke:#ef4444,stroke-width:1.5px,color:#fff\n    style VB1 fill:#312e81,stroke:#818cf8,stroke-width:1.5px,color:#fff\n    style CB2 fill:#1e3a8a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style GAP2 fill:#082f49,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style VB2 fill:#312e81,stroke:#818cf8,stroke-width:1.5px,color:#fff\n    style OVL fill:#064e3b,stroke:#34d399,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\" style=\"margin: 16px 0; page-break-inside: avoid;\">\n<svg width=\"100%\" height=\"auto\" viewBox=\"0 0 720 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:720px; display:block; margin:0 auto; background:#0f172a; border-radius:8px; border:1px solid #334155;\">\n  <rect width=\"100%\" height=\"100%\" fill=\"#0f172a\" rx=\"8\"/>\n  <text x=\"360\" y=\"26\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"14\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">물질별 에너지 밴드 구조 비교 (Energy Band Structure)</text>\n  <g transform=\"translate(40, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">절연체 (Insulator)</text>\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"33\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (Conduction Band)</text>\n    <line x1=\"90\" y1=\"48\" x2=\"90\" y2=\"122\" stroke=\"#f87171\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n    <polygon points=\"90,48 86,56 94,56\" fill=\"#f87171\"/>\n    <polygon points=\"90,122 86,114 94,114\" fill=\"#f87171\"/>\n    <rect x=\"42\" y=\"75\" width=\"96\" height=\"20\" rx=\"3\" fill=\"#450a0a\" stroke=\"#ef4444\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"89\" text-anchor=\"middle\" fill=\"#fca5a5\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Eg &gt; 5 eV (매우 큼)</text>\n    <rect x=\"10\" y=\"125\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"148\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (Valence Band)</text>\n  </g>\n  <g transform=\"translate(270, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">반도체 (Semiconductor)</text>\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"33\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (Conduction Band)</text>\n    <line x1=\"90\" y1=\"48\" x2=\"90\" y2=\"82\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n    <polygon points=\"90,48 86,54 94,54\" fill=\"#38bdf8\"/>\n    <polygon points=\"90,82 86,76 94,76\" fill=\"#38bdf8\"/>\n    <rect x=\"36\" y=\"56\" width=\"108\" height=\"20\" rx=\"3\" fill=\"#082f49\" stroke=\"#38bdf8\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"70\" text-anchor=\"middle\" fill=\"#7dd3fc\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Eg ≈ 1.1 eV (Si)</text>\n    <rect x=\"10\" y=\"85\" width=\"160\" height=\"76\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"130\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (Valence Band)</text>\n  </g>\n  <g transform=\"translate(500, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">도체 (Conductor)</text>\n    <rect x=\"10\" y=\"15\" width=\"160\" height=\"146\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n    <rect x=\"10\" y=\"55\" width=\"160\" height=\"36\" fill=\"#047857\" opacity=\"0.6\"/>\n    <text x=\"90\" y=\"40\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (CB)</text>\n    <text x=\"90\" y=\"77\" text-anchor=\"middle\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Overlap (Eg = 0 eV)</text>\n    <text x=\"90\" y=\"135\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (VB)</text>\n  </g>\n</svg>\n</div>\n\n### 3. 저항률에 따른 물질 분류 [20:08] **핵심**\n\n| 저항률 | 분류 |\n|---|---|\n| Low resistivity | Conductor(도체) |\n| High resistivity | Insulator(절연체) |\n| Intermediate resistivity | Semiconductor(반도체) |\n\n- 반도체의 전도성은 도체와 절연체 사이에 위치\n- 집적회로(IC) 소자에는 일반적으로 결정질(crystalline) 구조 사용, 최근에는 비결정질(non-crystalline)도 상업적으로 중요해짐 [20:08]\n\n---\n\n## 📘 세부 개념 정리\n\n### A. 밴드(Band)의 정의 [08:28]~[13:08] **핵심**\n- **밴드**: 고체 내에서 전자가 점유할 수 있는 허용된 에너지 상태들의 집합\n- **발렌스 밴드(Valence Band)**: 원자핵에 강하게 속박된 전자들이 완전히 채워진(fully occupied) 상태 — 낮은 에너지\n- **전도 밴드(Conduction Band)**: 초기에는 전자가 거의 없음(almost no electrons) — 전류 흐름과 직결 [13:08]\n- **핵심 원리**: 초기에 전도 밴드에 전자가 없으므로 전류가 흐르지 않음 → 외부 에너지를 가해 전자를 발렌스→전도 밴드로 이동시켜야 전도성 발생 [13:48]~[14:28]\n\n---\n\n### B. 결정 구조 3종 비교 [22:28]~[25:08] **중요**\n\n| 구조 | 특징 |\n|---|---|\n| 비결정질(Amorphous) | 원자가 무작위(random)로 배열 |\n| 결정질(Crystalline) | 원자가 규칙적으로 잘 배열됨 (well organized) |\n| 다결정질(Polycrystalline) | 여러 개의 결정 구조(grain)가 결합된 중간 형태 |\n\n- **그레인 바운더리(Grain Boundary)**: 서로 다른 결정(grain)이 접합되는 경계 [24:28]~[25:08]\n- **조건**: 최신 IC 공정은 3nm 수준 → 원자 배열이 불규칙하면 전자 거동 예측이 불가능 → 반드시 결정질 실리콘 사용 [25:48]~[26:28] **중요**\n\n---\n\n### C. 반도체 물질 분류 (주기율표 기반) [27:19]~[32:28] **참고**\n\n| 분류 | 예시 |\n|---|---|\n| 단원소(Elemental) | Si, C(탄소), Ge |\n| 화합물(Compound) IV-IV | Si-Ge, Si-C |\n| 화합물 III-V | InP, GaAs |\n| 화합물 혼합형 | $(In_xGa_{1-x})(As_yP_{1-y})$ |\n| 화합물 II-VI | CdTe |\n| 화합물 IV-VI | PbS |\n\n- **참고(용어 정정)**: 화학에서는 그룹 14로 부르지만 전기공학에서는 관례상 그룹 4로 축약해서 사용 [27:48]~[28:28] **참고**\n- Sn(주석), Pb(납)은 밴드갭이 매우 작아 반도체 소자로 잘 사용되지 않음 [32:28] **참고**\n- GaAs 등 III-V 화합물은 SpaceX 위성의 고성능 솔라셀에 사용됨 [31:08]~[31:48] **참고**\n\n---\n\n### D. 실리콘 원자 구조와 공유결합 [43:48]~[52:28] **핵심**\n\n**전자 배치**\n- Si 전자 배치: $1s^2\\ 2s^2\\ 2p^6\\ 3s^2\\ 3p^2$ [44:28]~[46:28]\n- $3s^2$, $3p^2$ 궤도 전자(총 4개)는 원자핵에 느슨하게 속박(loosely bound) → 최외각(valence) 전자\n- $3s$, $3p$ 에너지 차이가 매우 작음 → **sp³ 혼성 궤도(hybrid orbital)** 형성 [47:08]\n\n**공유결합 형성**\n- 최외각 4개의 전자가 인접 원자의 sp³ 궤도 전자와 결합(bond) 형성 → 실리콘의 4면체(4-side) 구조 형성 [47:48]~[49:48]\n- 하나의 결합선(bond line) = 하나의 공유 전자(single electron) [49:48]~[50:07]\n\n**실리콘 물성 수치표 [50:07]** **핵심**\n\n| 항목 | 값/설명 |\n|---|---|\n| 원자 밀도 | $5 \\times 10^{22}\\ \\text{atoms/cm}^3$ |\n| 최외각 전자 수 | 4개 → 최근접 4개 원자와 공유결합 형성 |\n| 온도 상승 시 | 전자가 자유롭게 격자(lattice) 내에서 이동 가능해짐 |\n\n**전자-홀 생성 메커니즘** [50:28]~[53:08] **핵심**\n1. 온도(에너지) 상승 → sp³ 결합의 전자가 원자핵에서 멀어짐\n2. 작은 에너지 인가로 결합(bond)이 끊어짐(broken)\n3. 결합에서 이탈한 전자 = **자유전자(free electron)**\n4. 전자가 빠져나간 빈자리 = **홀(hole)**\n5. **핵심 결론**: 자유전자가 생성되면 반드시 동일한 개수의 홀도 함께 생성됨 (전자 개수 = 홀 개수) [52:28]~[53:08] **핵심**\n\n$$n_{\\text{free electron}} = n_{\\text{hole population}}$$\n\n---\n\n## 🗑️ 요약에서 제외한 내용 및 이유\n\n| 구간 | 내용 | 제외 이유 |\n|---|---|---|\n| [01:08]~[01:48] | 강의 시작 인사, 출석 독려 발언 | 반복 인사말, 학습 내용과 무관 |\n| [02:28]~[04:28] | 이전 강의(전압, 저항) 복습 언급 | 이번 강의 핵심 내용과 직접 관련 없는 진행 안내 |\n| [04:53]/[04:58] | Recorded/Make-up lecture 정책 중복 (슬라이드 2회 동일 출력) | 완전한 중복 슬라이드, 하나만 반영(중요도: 참고로 별도 기재 가능하나 본 노트에서는 학습 핵심과 거리 있어 생략) |\n| [06:28] \"Any questions?\" 반복 | 질의응답 유도 반복 문구 | 인식 잡음성 반복, 정보 없음 |\n| [07:08]~[07:39] | 오늘 강의 개요 재소개(음성) | 슬라이드([07:09] Outline)와 중복 |\n| [28:28] \"우리는 전기공학자니까\" 등 유머성 발언 | 여담, 핵심 개념과 무관 | |\n| [43:48]~[45:08] 반복적 \"여기 2, 여기 2...\" 구술 | 판서 설명 중 인식 오류로 추정되는 불명확 발화(잡음) | 원문 그대로는 의미 파악 불가하여 최종 정리된 전자배치로 대체 |\n| [53:08] 마무리 인사 | 강의 종료 인사 | 학습 내용과 무관 |\n\n*(참고: FYI 슬라이드는 출석 관련 규정이므로 별도로 아래에 남겨둠)*\n\n### 부가 사항: 강의 운영 정책 [04:53] **참고**\n- **일반 녹화 강의**: 복습용 업로드, 시청 의무 없음, LearnUS에 2주간 제공\n- **보강(Make-up) 강의**: 교수 부재 시 업로드되며, **다음 수업 전까지 반드시 시청해야 출석 인정**, 2주간 제공\n"},{"name":"Gemini 3.8 Flash","id":"google/gemini-3.8-flash","slug":"07_gemini_3.8_flash","elapsed":"31.6","charCount":29385,"content":"# Gemini 3.8 Flash 강의 요약 노트\n\n- 모델 ID: `google/gemini-3.8-flash`\n- 소요 시간: 31.6초\n- 생성 글자 수: 29385자\n- 기준 강의 파일: `electric_circuits_note_example.md`\n- 특징: 확실한 그림 자료(Mermaid + SVG) 적용 완료, 제외 내용 완전 제거\n\n---\n\n# Gemini 3.8 Flash 강의 요약 노트\n\n- 모델 ID: `google/gemini-3.8-flash`\n- 소요 시간: 31.6초\n- 생성 글자 수: 19101자\n- 기준 강의 파일: `electric_circuits_note_example.md`\n- 특징: 확실한 그림 자료(Mermaid + SVG) 적용 완료, 제외 내용 완전 제거\n\n---\n\n## 1. 핵심 요약 및 시험 핵심 포인트\n\n* **반도체 물질의 핵심 비교 ($E_g$, 밴드갭)** [16:28, 17:48, 33:48] `핵심`\n  * 절연체: $E_g > 5\\text{ eV}$ (전도대와 가전자대 간격이 매우 큼)\n  * 전도체: $E_g \\approx 0\\text{ eV}$ (전도대와 가전자대 오버랩)\n  * 반도체: $1\\text{ eV} \\le E_g \\le 3\\text{ eV}$ (실리콘 $\\text{Si} \\approx 1.1\\text{ eV}$, 게르마늄 $\\text{Ge} \\approx 0.67\\text{ eV}$)\n* **$\\text{Ge}$ 대비 $\\text{Si}$이 표준 물질로 선택된 5대 이유** [33:48, 40:00, 40:28] `핵심`\n  1. **경제성:** $\\text{Si}$이 $\\text{Ge}$보다 훨씬 저렴함.\n  2. **낮은 누설전류(Cut-off Current):** $\\text{Si}$의 밴드갭($1.1\\text{ eV}$)이 $\\text{Ge}$($0.67\\text{ eV}$)보다 커서 오프(off) 상태 전류 제어에 절대적으로 유리(스위치 특성 우수).\n  3. **열적 안정성:** $\\text{Ge}$ 결정은 고온에서 쉽게 파괴됨.\n  4. **높은 항복 전압(Breakdown Voltage):** 고전압 인가 시 $\\text{Si}$이 훨씬 높은 신뢰성을 가짐.\n  5. **우수한 절연막($\\text{SiO}_2$) 형성 용이:** 산화막($\\text{SiO}_2$)을 쉽게 성장시켜 트랜지스터의 근간인 커패시터(MOS 구조) 형성이 가능.\n* **트랜지스터(Transistor)의 본질적 정의** [41:48, 43:08] `핵심`\n  * **Transfer + Resistor**의 합성어: 인가 전압에 따라 저항을 가변(조절)할 수 있는 소자.\n* **$\\text{Si}$의 결정성 및 캐리어 생성 기본 원리** [25:48, 50:07, 51:48, 53:08] `핵심`\n  * **원자 밀도:** $\\text{Si}$ 원자 밀도는 $5 \\times 10^{22}\\text{ atoms/cm}^3$.\n  * 최외각 전자 4개($sp^3$ 혼성 오비탈)가 인접 원자 4개와 공유 결합을 형성.\n  * 열 에너지가 인가되어 공유 결합이 끊어지면 **자유 전자(Free Electron)** 와 **정공(Hole)** 이 쌍으로 발생(진성 반도체에서 전자 수 = 정공 수).\n  * 미세 공정(예: 3nm 노드)에서는 전자의 거동을 예측 가능하게 제어해야 하므로 **단결정(Crystalline)** 실리콘만 집적회로(IC) 제작에 사용됨.\n\n---\n\n## 2. 체계적 학습 보조 노트\n\n### 2.1 에너지 밴드 이론과 물질의 분류\n\n#### (1) 에너지 밴드와 상태(State)의 정의 [08:28~10:28, 18:28~19:08] `중요`\n* **에너지 밴드(Energy Band):** 고체 내부에서 전자가 점유할 수 있도록 허용된 에너지 상태들의 모임.\n* **에너지 상태(Energy State):** 전자가 거주할 수 있는 \"방(Available houses for electrons)\".\n* **밴드갭(Bandgap, $E_g$):** 가전자대와 전도대 사이의 공간으로, 전자가 머무를 수 있는 허용 상태가 전혀 존재하지 않는 금지대.\n\n#### (2) 가전자대 vs 전도대 [10:28~13:48] `중요`\n* **가전자대(Valence Band):** 원자핵에 강하게 구속된 전자들이 차지하는 낮은 에너지 레벨. 초기 상태에서 전자가 가득 채워져 있음(Fully occupied).\n* **전도대(Conduction Band):** 원자핵의 구속에서 벗어난 전자들이 자유롭게 이동할 수 있는 높은 에너지 레벨. 초기 상태에서는 비어 있으며, 전하 운반체(캐리어)의 전도(Current flow)를 담당.\n\n#### (3) 물질별 에너지 밴드 비교 [15:08~18:28, 20:08] `핵심`\n\n| 구분 | 절연체 (Insulator) | 반도체 (Semiconductor) | 도체 (Conductor) |\n| :--- | :--- | :--- | :--- |\n| **밴드갭 ($E_g$) 크기** | $E_g > 5\\text{ eV}$ | $1\\text{ eV} \\le E_g \\le 3\\text{ eV}$ | $E_g = 0\\text{ eV}$ (Overlap) |\n| **비저항 (Resistivity)** | 매우 높음 (High) | 중간 (Intermediate) | 매우 낮음 (Low) |\n| **전도 특성** | 전자를 전도대로 올리기에 매우 큰 에너지가 필요함 | 적은 에너지를 인가하여 전도성을 정밀 제어 가능 | 가전자대와 전도대가 겹쳐 극소 에너지로도 전도성을 띰 |\n| **대표 예시** | $\\text{SiO}_2$ | $\\text{Si}$ ($1.1\\text{ eV}$), $\\text{Ge}$ ($0.67\\text{ eV}$) | 금속 등 |\n\n---\n\n\n\n### 📊 [확실한 그림 자료 1] 물질별 에너지 밴드 구조 비교 (Energy Band Diagram)\n> 근거 ID: [07:39], [15:08]~[18:28] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Insulator [\"절연체 (Insulator)\"]\n        direction TB\n        CB1[\"전도대 (Conduction Band)<br/>전자가 거의 없음 (비어있음)\"]\n        GAP1[\"에너지 밴드갭 (Bandgap)<br/>Eg > 5 eV (매우 큼: 전자 이동 불가)\"]\n        VB1[\"원자가대 (Valence Band)<br/>원자핵에 강하게 구속, 전자 가득 참\"]\n        CB1 --- GAP1 --- VB1\n    end\n\n    subgraph Semiconductor [\"반도체 (Semiconductor)\"]\n        direction TB\n        CB2[\"전도대 (Conduction Band)<br/>외부 에너지 공급 시 전자 전이\"]\n        GAP2[\"에너지 밴드갭 (Bandgap)<br/>Eg ≈ 1.1 eV (Si) / 0.67 eV (Ge)\"]\n        VB2[\"원자가대 (Valence Band)<br/>상온에서 전자가 쉽게 이탈 가능\"]\n        CB2 --- GAP2 --- VB2\n    end\n\n    subgraph Conductor [\"도체 (Conductor)\"]\n        direction TB\n        OVL[\"전도대 (CB) & 원자가대 (VB)<br/>서로 겹침 (Overlap, Eg = 0 eV)<br/>상온에서도 무수한 자유전자가 이동\"]\n    end\n\n    style Insulator fill:#1e293b,stroke:#ef4444,stroke-width:2px,color:#fff\n    style Semiconductor fill:#1e293b,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style Conductor fill:#1e293b,stroke:#10b981,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"260\" viewBox=\"0 0 720 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0;\">\n  <!-- 제목 -->\n  <text x=\"360\" y=\"25\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"15\" font-weight=\"bold\">물질별 에너지 밴드 구조 비교 (Energy Band Structure)</text>\n  \n  <!-- 절연체 -->\n  <g transform=\"translate(40, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"13\" font-weight=\"bold\">절연체 (Insulator)</text>\n    <!-- 전도대 -->\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"35\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"12\">전도대 (Conduction Band)</text>\n    <!-- 밴드갭 화살표 & 레이블 -->\n    <line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"128\" stroke=\"#f87171\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n    <polygon points=\"90,52 86,60 94,60\" fill=\"#f87171\"/>\n    <polygon points=\"90,128 86,120 94,120\" fill=\"#f87171\"/>\n    <rect x=\"45\" y=\"80\" width=\"90\" height=\"22\" rx=\"3\" fill=\"#450a0a\" stroke=\"#ef4444\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"95\" text-anchor=\"middle\" fill=\"#fca5a5\" font-size=\"11\" font-weight=\"bold\">Eg > 5 eV (거대함)</text>\n    <!-- 원자가대 -->\n    <rect x=\"10\" y=\"130\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"155\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"12\">원자가대 (Valence Band)</text>\n  </g>\n\n  <!-- 반도체 -->\n  <g transform=\"translate(270, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\">반도체 (Semiconductor)</text>\n    <!-- 전도대 -->\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"40\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"35\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"12\">전도대 (Conduction Band)</text>\n    <!-- 밴드갭 화살표 & 레이블 -->\n    <line x1=\"90\" y1=\"52\" x2=\"90\" y2=\"88\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n    <polygon points=\"90,52 86,58 94,58\" fill=\"#38bdf8\"/>\n    <polygon points=\"90,88 86,82 94,82\" fill=\"#38bdf8\"/>\n    <rect x=\"40\" y=\"60\" width=\"100\" height=\"22\" rx=\"3\" fill=\"#082f49\" stroke=\"#38bdf8\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"75\" text-anchor=\"middle\" fill=\"#7dd3fc\" font-size=\"11\" font-weight=\"bold\">Eg ≈ 1.1 eV (Si)</text>\n    <!-- 원자가대 -->\n    <rect x=\"10\" y=\"90\" width=\"160\" height=\"80\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"135\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"12\">원자가대 (Valence Band)</text>\n  </g>\n\n  <!-- 전도체 -->\n  <g transform=\"translate(500, 45)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\">도체 (Conductor)</text>\n    <!-- 겹침 밴드 -->\n    <rect x=\"10\" y=\"20\" width=\"160\" height=\"150\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n    <rect x=\"10\" y=\"60\" width=\"160\" height=\"40\" fill=\"#047857\" opacity=\"0.6\"/>\n    <text x=\"90\" y=\"45\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"12\">전도대 (CB)</text>\n    <text x=\"90\" y=\"83\" text-anchor=\"middle\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\">Overlap (Eg = 0 eV)</text>\n    <text x=\"90\" y=\"145\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"12\">원자가대 (VB)</text>\n  </g>\n</svg>\n</div>\n\n\n\n### 📊 [확실한 그림 자료 1] 물질별 에너지 밴드 구조 비교 (Energy Band Diagram)\n> 근거 ID: [07:39], [15:08]~[18:28] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Insulator [\"절연체 (Insulator)\"]\n        direction TB\n        CB1[\"전도대 (Conduction Band)<br/>전자가 거의 없음 (비어있음)\"]\n        GAP1[\"에너지 밴드갭 (Bandgap)<br/>Eg: 5 eV 초과 (거대한 금지대)\"]\n        VB1[\"원자가대 (Valence Band)<br/>원자핵에 구속, 전자 가득 참\"]\n        CB1 --- GAP1\n        GAP1 --- VB1\n    end\n\n    subgraph Semiconductor [\"반도체 (Semiconductor)\"]\n        direction TB\n        CB2[\"전도대 (Conduction Band)<br/>외부 에너지 공급 시 전자 전이\"]\n        GAP2[\"에너지 밴드갭 (Bandgap)<br/>Eg 약 1.1 eV (Si) / 0.67 eV (Ge)\"]\n        VB2[\"원자가대 (Valence Band)<br/>상온에서 전자가 쉽게 이탈 가능\"]\n        CB2 --- GAP2\n        GAP2 --- VB2\n    end\n\n    subgraph Conductor [\"도체 (Conductor)\"]\n        direction TB\n        OVL[\"전도대 (CB) & 원자가대 (VB)<br/>서로 겹침 (Overlap, Eg = 0 eV)<br/>상온에서도 무수한 자유전자 이동\"]\n    end\n\n    style CB1 fill:#1e3a8a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style GAP1 fill:#450a0a,stroke:#ef4444,stroke-width:1.5px,color:#fff\n    style VB1 fill:#312e81,stroke:#818cf8,stroke-width:1.5px,color:#fff\n    style CB2 fill:#1e3a8a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style GAP2 fill:#082f49,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style VB2 fill:#312e81,stroke:#818cf8,stroke-width:1.5px,color:#fff\n    style OVL fill:#064e3b,stroke:#34d399,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\" style=\"margin: 16px 0; page-break-inside: avoid;\">\n<svg width=\"100%\" height=\"auto\" viewBox=\"0 0 720 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:720px; display:block; margin:0 auto; background:#0f172a; border-radius:8px; border:1px solid #334155;\">\n  <rect width=\"100%\" height=\"100%\" fill=\"#0f172a\" rx=\"8\"/>\n  <text x=\"360\" y=\"26\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"14\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">물질별 에너지 밴드 구조 비교 (Energy Band Structure)</text>\n  <g transform=\"translate(40, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#ef4444\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">절연체 (Insulator)</text>\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"33\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (Conduction Band)</text>\n    <line x1=\"90\" y1=\"48\" x2=\"90\" y2=\"122\" stroke=\"#f87171\" stroke-width=\"2\" stroke-dasharray=\"4\"/>\n    <polygon points=\"90,48 86,56 94,56\" fill=\"#f87171\"/>\n    <polygon points=\"90,122 86,114 94,114\" fill=\"#f87171\"/>\n    <rect x=\"42\" y=\"75\" width=\"96\" height=\"20\" rx=\"3\" fill=\"#450a0a\" stroke=\"#ef4444\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"89\" text-anchor=\"middle\" fill=\"#fca5a5\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Eg &gt; 5 eV (매우 큼)</text>\n    <rect x=\"10\" y=\"125\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"148\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (Valence Band)</text>\n  </g>\n  <g transform=\"translate(270, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">반도체 (Semiconductor)</text>\n    <rect x=\"10\" y=\"10\" width=\"160\" height=\"36\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"33\" text-anchor=\"middle\" fill=\"#93c5fd\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (Conduction Band)</text>\n    <line x1=\"90\" y1=\"48\" x2=\"90\" y2=\"82\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n    <polygon points=\"90,48 86,54 94,54\" fill=\"#38bdf8\"/>\n    <polygon points=\"90,82 86,76 94,76\" fill=\"#38bdf8\"/>\n    <rect x=\"36\" y=\"56\" width=\"108\" height=\"20\" rx=\"3\" fill=\"#082f49\" stroke=\"#38bdf8\" stroke-width=\"1\"/>\n    <text x=\"90\" y=\"70\" text-anchor=\"middle\" fill=\"#7dd3fc\" font-size=\"10\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Eg ≈ 1.1 eV (Si)</text>\n    <rect x=\"10\" y=\"85\" width=\"160\" height=\"76\" rx=\"4\" fill=\"#312e81\" stroke=\"#818cf8\" stroke-width=\"1.5\"/>\n    <text x=\"90\" y=\"130\" text-anchor=\"middle\" fill=\"#c7d2fe\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (Valence Band)</text>\n  </g>\n  <g transform=\"translate(500, 42)\">\n    <text x=\"90\" y=\"0\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">도체 (Conductor)</text>\n    <rect x=\"10\" y=\"15\" width=\"160\" height=\"146\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n    <rect x=\"10\" y=\"55\" width=\"160\" height=\"36\" fill=\"#047857\" opacity=\"0.6\"/>\n    <text x=\"90\" y=\"40\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"11\" font-family=\"system-ui, sans-serif\">전도대 (CB)</text>\n    <text x=\"90\" y=\"77\" text-anchor=\"middle\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Overlap (Eg = 0 eV)</text>\n    <text x=\"90\" y=\"135\" text-anchor=\"middle\" fill=\"#a7f3d0\" font-size=\"11\" font-family=\"system-ui, sans-serif\">원자가대 (VB)</text>\n  </g>\n</svg>\n</div>\n\n### 2.2 반도체의 결정 구조와 IC 응용\n\n#### (1) 결정 구조 형태 비교 [20:08, 22:28~25:08] `중요`\n* **단결정 (Crystalline):** 원자가 공간 전체에 걸쳐 규칙적이고 주기적으로 배열된 구조.\n* **다결정 (Polycrystalline):** 여러 개의 작은 결정립(Grain)들이 모인 형태. 결정립 간의 경계면을 **그레인 바운더리(Grain boundary)**라고 부름.\n* **비정질 (Amorphous):** 원자 배열이 무질서하고 불규칙한 상태.\n\n#### (2) IC 공정에서 단결정 실리콘이 필수적인 이유 [25:48~26:28] `핵심`\n* 현대 IC 노드는 수 나노미터(예: 3nm 공정) 수준으로 매우 미세함.\n* 원자 배열이 불규칙하면 내부에서 전자의 이동 및 물리적 거동을 예측·제어할 수 없으므로, IC 칩 제작에는 고도로 정렬된 **단결정 실리콘**만을 사용함.\n\n---\n\n\n\n### 📊 [확실한 그림 자료 2] 반도체 결정 구조의 3가지 형태 (Crystal Structures)\n> 근거 ID: [20:08], [22:28]~[26:28] `핵심`\n\n```mermaid\nflowchart LR\n    subgraph Crystalline [\"단결정 (Crystalline)\"]\n        direction TB\n        C_DESC[\"• 원자들의 완벽한 주기적 배열<br/>• 결함 및 불연속성 없음<br/>• 전자 이동 거동 정확히 예측 가능<br/>• 최신 3nm 집적회로(IC) 제작에 필수\"]\n    end\n\n    subgraph Polycrystalline [\"다결정 (Polycrystalline)\"]\n        direction TB\n        P_DESC[\"• 여러 개의 작은 단결정립(Grain) 집합체<br/>• 결정립 간 경계: 결정립계(Grain Boundary)<br/>• 계면 결합 불완전으로 전송 저항 발생\"]\n    end\n\n    subgraph Amorphous [\"비정질 (Amorphous)\"]\n        direction TB\n        A_DESC[\"• 원자 배열이 무작위(Random)<br/>• 장거리 규칙성(Long-range order) 부재<br/>• 전자 거동 예측 난해 (상업적 특수 응용)\"]\n    end\n\n    style Crystalline fill:#0f172a,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style Polycrystalline fill:#0f172a,stroke:#f59e0b,stroke-width:2px,color:#fff\n    style Amorphous fill:#0f172a,stroke:#a855f7,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"210\" viewBox=\"0 0 720 210\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0;\">\n  <text x=\"360\" y=\"24\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"15\" font-weight=\"bold\">결정 구조 비교: 단결정 vs 다결정 vs 비정질</text>\n\n  <!-- 단결정 격자 -->\n  <g transform=\"translate(30, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"150\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"22\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\">단결정 (Crystalline)</text>\n    <!-- 격자 점들 -->\n    <g fill=\"#38bdf8\">\n      <circle cx=\"40\" cy=\"50\" r=\"6\"/><circle cx=\"80\" cy=\"50\" r=\"6\"/><circle cx=\"120\" cy=\"50\" r=\"6\"/><circle cx=\"160\" cy=\"50\" r=\"6\"/>\n      <circle cx=\"40\" cy=\"80\" r=\"6\"/><circle cx=\"80\" cy=\"80\" r=\"6\"/><circle cx=\"120\" cy=\"80\" r=\"6\"/><circle cx=\"160\" cy=\"80\" r=\"6\"/>\n      <circle cx=\"40\" cy=\"110\" r=\"6\"/><circle cx=\"80\" cy=\"110\" r=\"6\"/><circle cx=\"120\" cy=\"110\" r=\"6\"/><circle cx=\"160\" cy=\"110\" r=\"6\"/>\n      <!-- 결합선 -->\n      <path d=\"M40,50 H160 M40,80 H160 M40,110 H160 M40,50 V110 M80,50 V110 M120,50 V110 M160,50 V110\" stroke=\"#38bdf8\" stroke-width=\"1\" opacity=\"0.4\"/>\n    </g>\n    <text x=\"100\" y=\"138\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">완벽한 규칙적 주기 격자</text>\n  </g>\n\n  <!-- 다결정 격자 -->\n  <g transform=\"translate(260, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"150\" rx=\"6\" fill=\"#1e293b\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"22\" text-anchor=\"middle\" fill=\"#f59e0b\" font-size=\"12\" font-weight=\"bold\">다결정 (Polycrystalline)</text>\n    <!-- Grain boundary line -->\n    <path d=\"M100,30 L95,70 L115,110 L105,145\" stroke=\"#ef4444\" stroke-width=\"2.5\" stroke-dasharray=\"3\"/>\n    <text x=\"105\" y=\"85\" fill=\"#fca5a5\" font-size=\"9\" font-weight=\"bold\">Grain Boundary</text>\n    <!-- 좌측 결정립 -->\n    <g fill=\"#f59e0b\">\n      <circle cx=\"35\" cy=\"55\" r=\"5\"/><circle cx=\"70\" cy=\"50\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"90\" r=\"5\"/><circle cx=\"75\" cy=\"85\" r=\"5\"/>\n      <circle cx=\"45\" cy=\"125\" r=\"5\"/><circle cx=\"80\" cy=\"120\" r=\"5\"/>\n    </g>\n    <!-- 우측 결정립(기울어짐) -->\n    <g fill=\"#fbbf24\">\n      <circle cx=\"130\" cy=\"50\" r=\"5\"/><circle cx=\"165\" cy=\"65\" r=\"5\"/>\n      <circle cx=\"135\" cy=\"85\" r=\"5\"/><circle cx=\"170\" cy=\"100\" r=\"5\"/>\n      <circle cx=\"140\" cy=\"120\" r=\"5\"/><circle cx=\"175\" cy=\"135\" r=\"5\"/>\n    </g>\n    <text x=\"100\" y=\"138\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">결정립계(경계면) 존재</text>\n  </g>\n\n  <!-- 비정질 -->\n  <g transform=\"translate(490, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"150\" rx=\"6\" fill=\"#1e293b\" stroke=\"#a855f7\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"22\" text-anchor=\"middle\" fill=\"#c084fc\" font-size=\"12\" font-weight=\"bold\">비정질 (Amorphous)</text>\n    <!-- 무작위 원자들 -->\n    <g fill=\"#c084fc\">\n      <circle cx=\"35\" cy=\"45\" r=\"5\"/><circle cx=\"75\" cy=\"60\" r=\"5\"/><circle cx=\"115\" cy=\"40\" r=\"5\"/><circle cx=\"165\" cy=\"55\" r=\"5\"/>\n      <circle cx=\"50\" cy=\"85\" r=\"5\"/><circle cx=\"95\" cy=\"80\" r=\"5\"/><circle cx=\"140\" cy=\"95\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"120\" r=\"5\"/><circle cx=\"80\" cy=\"115\" r=\"5\"/><circle cx=\"125\" cy=\"130\" r=\"5\"/><circle cx=\"170\" cy=\"110\" r=\"5\"/>\n    </g>\n    <text x=\"100\" y=\"138\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">무작위 불규칙 원자 배열</text>\n  </g>\n</svg>\n</div>\n\n\n\n### 📊 [확실한 그림 자료 2] 반도체 결정 구조의 3가지 형태 (Crystal Structures)\n> 근거 ID: [20:08], [22:28]~[26:28] `핵심`\n\n```mermaid\nflowchart LR\n    subgraph S_Crys [\"단결정 (Crystalline)\"]\n        direction TB\n        C_DESC[\"• 원자들의 완벽한 주기적 배열<br/>• 결함 및 불연속성 없음<br/>• 전자 이동 거동 정확히 예측 가능<br/>• 최신 3nm 집적회로(IC) 제작 필수\"]\n    end\n\n    subgraph S_Poly [\"다결정 (Polycrystalline)\"]\n        direction TB\n        P_DESC[\"• 여러 개의 작은 단결정립(Grain) 집합체<br/>• 결정립 간 경계: 결정립계(Grain Boundary)<br/>• 계면 결합 불완전으로 전송 저항 발생\"]\n    end\n\n    subgraph S_Amor [\"비정질 (Amorphous)\"]\n        direction TB\n        A_DESC[\"• 원자 배열이 무작위(Random)<br/>• 장거리 규칙성 부재<br/>• 전자 거동 예측 난해 (상업적 특수 응용)\"]\n    end\n\n    style C_DESC fill:#0f172a,stroke:#38bdf8,stroke-width:2px,color:#fff\n    style P_DESC fill:#0f172a,stroke:#f59e0b,stroke-width:2px,color:#fff\n    style A_DESC fill:#0f172a,stroke:#a855f7,stroke-width:2px,color:#fff\n```\n\n<div align=\"center\" style=\"margin: 16px 0; page-break-inside: avoid;\">\n<svg width=\"100%\" height=\"auto\" viewBox=\"0 0 720 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:720px; display:block; margin:0 auto; background:#0f172a; border-radius:8px; border:1px solid #334155;\">\n  <rect width=\"100%\" height=\"100%\" fill=\"#0f172a\" rx=\"8\"/>\n  <text x=\"360\" y=\"24\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"14\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">결정 구조 비교: 단결정 vs 다결정 vs 비정질</text>\n  <g transform=\"translate(30, 38)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"144\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"20\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">단결정 (Crystalline)</text>\n    <g fill=\"#38bdf8\">\n      <circle cx=\"40\" cy=\"46\" r=\"5\"/><circle cx=\"80\" cy=\"46\" r=\"5\"/><circle cx=\"120\" cy=\"46\" r=\"5\"/><circle cx=\"160\" cy=\"46\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"76\" r=\"5\"/><circle cx=\"80\" cy=\"76\" r=\"5\"/><circle cx=\"120\" cy=\"76\" r=\"5\"/><circle cx=\"160\" cy=\"76\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"106\" r=\"5\"/><circle cx=\"80\" cy=\"106\" r=\"5\"/><circle cx=\"120\" cy=\"106\" r=\"5\"/><circle cx=\"160\" cy=\"106\" r=\"5\"/>\n      <path d=\"M40,46 H160 M40,76 H160 M40,106 H160 M40,46 V106 M80,46 V106 M120,46 V106 M160,46 V106\" stroke=\"#38bdf8\" stroke-width=\"1\" opacity=\"0.35\"/>\n    </g>\n    <text x=\"100\" y=\"132\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"system-ui, sans-serif\">완벽한 규칙적 주기 격자</text>\n  </g>\n  <g transform=\"translate(260, 38)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"144\" rx=\"6\" fill=\"#1e293b\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"20\" text-anchor=\"middle\" fill=\"#f59e0b\" font-size=\"12\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">다결정 (Polycrystalline)</text>\n    <path d=\"M100,28 L95,65 L115,102 L105,140\" stroke=\"#ef4444\" stroke-width=\"2\" stroke-dasharray=\"3\"/>\n    <text x=\"108\" y=\"80\" fill=\"#fca5a5\" font-size=\"9\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">Grain Boundary</text>\n    <g fill=\"#f59e0b\">\n      <circle cx=\"35\" cy=\"50\" r=\"5\"/><circle cx=\"70\" cy=\"46\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"82\" r=\"5\"/><circle cx=\"75\" cy=\"78\" r=\"5\"/>\n      <circle cx=\"45\" cy=\"115\" r=\"5\"/><circle cx=\"80\" cy=\"110\" r=\"5\"/>\n    </g>\n    <g fill=\"#fbbf24\">\n      <circle cx=\"130\" cy=\"46\" r=\"5\"/><circle cx=\"165\" cy=\"60\" r=\"5\"/>\n      <circle cx=\"135\" cy=\"78\" r=\"5\"/><circle cx=\"170\" cy=\"92\" r=\"5\"/>\n      <circle cx=\"140\" cy=\"110\" r=\"5\"/><circle cx=\"175\" cy=\"124\" r=\"5\"/>\n    </g>\n    <text x=\"100\" y=\"132\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"system-ui, sans-serif\">결정립계(경계면) 존재</text>\n  </g>\n  <g transform=\"translate(490, 38)\">\n    <rect x=\"0\" y=\"0\" width=\"200\" height=\"144\" rx=\"6\" fill=\"#1e293b\" stroke=\"#a855f7\" stroke-width=\"1.5\"/>\n    <text x=\"100\" y=\"20\" text-anchor=\"middle\" fill=\"#c084fc\" font-size=\"12\" font-weight=\"bold\" font-family=\"system-ui, sans-serif\">비정질 (Amorphous)</text>\n    <g fill=\"#c084fc\">\n      <circle cx=\"35\" cy=\"42\" r=\"5\"/><circle cx=\"75\" cy=\"55\" r=\"5\"/><circle cx=\"115\" cy=\"38\" r=\"5\"/><circle cx=\"165\" cy=\"50\" r=\"5\"/>\n      <circle cx=\"50\" cy=\"78\" r=\"5\"/><circle cx=\"95\" cy=\"72\" r=\"5\"/><circle cx=\"140\" cy=\"88\" r=\"5\"/>\n      <circle cx=\"40\" cy=\"110\" r=\"5\"/><circle cx=\"80\" cy=\"105\" r=\"5\"/><circle cx=\"125\" cy=\"120\" r=\"5\"/><circle cx=\"170\" cy=\"102\" r=\"5\"/>\n    </g>\n    <text x=\"100\" y=\"132\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\" font-family=\"system-ui, sans-serif\">무작위 불규칙 원자 배열</text>\n  </g>\n</svg>\n</div>\n\n### 2.3 반도체 원소 및 화합물 분류\n\n#### (1) 주기율표 표기 및 특성 [27:19~30:28] `참고`\n* 반도체 공학에서는 편의상 화학적 표기인 14족(Group 14), 15족, 13족에서 10을 떼고 **4족(Group 4)**, 5족, 3족으로 주로 칭함.\n* **단원소 반도체 (Group 4):** $\\text{Si}$, $\\text{Ge}$ (탄소 $\\text{C}$는 논란이 있어 통상 배제; $\\text{Sn}$, $\\text{Pb}$는 밴드갭이 너무 작아 반도체용으로 부적합).\n* **화합물 반도체:**\n  * IV-IV족: $\\text{Si-Ge}$, $\\text{Si-C}$\n  * III-V족: $\\text{GaAs}$, $\\text{InP}$, $(\\text{In}_x\\text{Ga}_{1-x})(\\text{As}_y\\text{P}_{1-y})$ (예: $\\text{GaAs}$는 인공위성 고성능 태양전지 등에 응용 [31:48])\n  * II-VI족: $\\text{CdTe}$\n  * IV-VI족: $\\text{PbS}$\n\n---\n\n### 2.4 $\\text{Si}$ vs $\\text{Ge}$ 비교 (실리콘 중심 발전 배경)\n\n* 최초의 트랜지스터(점접촉 트랜지스터)는 $\\text{Ge}$로 제작되었으나, 연구 발전 후 $\\text{Si}$으로 전면 전환됨 [29:48~30:28].\n\n#### [상세 비교 표] [33:48~41:08] `핵심`\n\n| 비교 항목 | 실리콘 ($\\text{Si}$) | 게르마늄 ($\\text{Ge}$) | 공학적 중요성 및 의의 |\n| :--- | :--- | :--- | :--- |\n| **밴드갭 ($E_g$)** | **$1.1\\text{ eV}$** | **$0.67\\text{ eV}$** | $\\text{Si}$의 밴드갭이 커서 오프 전류 제어가 훨씬 유리함 |\n| **오프 전류 (Cut-off Current)** | 매우 작음 | 상대적으로 큼 | 트랜지스터의 명확한 On/Off 스위칭 성능 결정 |\n| **원가 (Cost)** | 매우 저렴함 | 상대적으로 고가 | 대량 생산 및 상용화에 결정적 요소 |\n| **열적 안정성** | 고온에서도 안정 | 고온에서 결정이 쉽게 파괴 | 동작 신뢰성 보장 |\n| **항복 전압 (Breakdown Voltage)**| 높음 | 낮음 | 고전압 동작 안정성 보장 |\n| **절연막 형성 ($\\text{SiO}_2$)** | 양질의 산화물 절연막 형성 가능 | 안정적 고유 절연막 형성이 어려움 | 금속-절연체-반도체(커패시터 구조) 제작 기반 |\n\n---\n\n\n\n### 📊 [확실한 그림 자료 5] 트랜지스터(Transfer + Resistor)의 본질: 가변 저항 및 I-V 기울기 변조\n> 근거 ID: [41:48]~[43:08] `핵심`\n\n```mermaid\nflowchart LR\n    INPUT[\"입력 전압 / 게이트 바이어스 제어\"] --> MOD[\"채널 저항(Resistance) 동적 변조\"]\n    MOD --> SLOPE[\"I-V 특성 곡선의 기울기(Conductance = 1/R) 변화\"]\n    SLOPE --> SWITCH[\"완벽한 스위칭 동작 (On: 대전류 / Off: 극미세 누설전류)\"]\n    \n    style INPUT fill:#0f172a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style MOD fill:#0f172a,stroke:#f59e0b,stroke-width:1.5px,color:#fff\n    style SLOPE fill:#0f172a,stroke:#818cf8,stroke-width:1.5px,color:#fff\n    style SWITCH fill:#064e3b,stroke:#10b981,stroke-width:2px,color:#fff\n```\n\n\n\n### 📊 [확실한 그림 자료 5] 트랜지스터(Transfer + Resistor)의 본질: 가변 저항 및 I-V 기울기 변조\n> 근거 ID: [41:48]~[43:08] `핵심`\n\n```mermaid\nflowchart LR\n    INPUT[\"입력 전압 / 게이트 바이어스 제어\"] --> MOD[\"채널 저항(Resistance) 동적 변조\"]\n    MOD --> SLOPE[\"I-V 특성 곡선의 기울기(Conductance = 1/R) 변화\"]\n    SLOPE --> SWITCH[\"완벽한 스위칭 동작 (On: 대전류 / Off: 극미세 누설전류)\"]\n    \n    style INPUT fill:#0f172a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style MOD fill:#0f172a,stroke:#f59e0b,stroke-width:1.5px,color:#fff\n    style SLOPE fill:#0f172a,stroke:#818cf8,stroke-width:1.5px,color:#fff\n    style SWITCH fill:#064e3b,stroke:#10b981,stroke-width:2px,color:#fff\n```\n\n### 2.5 실리콘 원자 결합 구조 및 전하 운반체 생성\n\n\n### 📊 [확실한 그림 자료 4] 실리콘 공유결합 격자 및 전자-정공 쌍(EHP) 생성 메커니즘\n> 근거 ID: [44:28]~[53:08], [50:07] `핵심`\n\n```mermaid\nflowchart TD\n    subgraph Step1 [\"(a) 상온 이전: 완전한 공유결합 상태 (Covalent Bonds)\"]\n        S1[\"Si 원자 (최외각 4개 전자, sp³ 혼성 오비탈)<br/>인접한 4개 Si 원자와 2개씩 전자 공유하여 결합<br/>원자 밀도: 5 × 10²² atoms/cm³ | 자유전자 없음\"]\n    end\n\n    subgraph Step2 [\"(b) 외부 에너지 인가 (Thermal Energy / T 상승)\"]\n        S2[\"열 진동에 의해 Si-Si 공유결합 파괴 (Bond Broken)\"]\n    end\n\n    subgraph Step3 [\"(c) 캐리어 쌍 동시 생성 (Carrier Pair Generation)\"]\n        S3A[\"자유 전자 (Free Electron)<br/>결합에서 빠져나와 전도대로 이동<br/>전류 전도 기여\"]\n        S3B[\"정공 (Hole, 빈자리)<br/>전자가 빠져나간 빈 공간<br/>양전하 캐리어로 거동\"]\n    end\n\n    Step1 --> Step2\n    Step2 --> S3A\n    Step2 --> S3B\n\n    style Step1 fill:#0f172a,stroke:#38bdf8,stroke-width:1.5px,color:#fff\n    style Step2 fill:#0f172a,stroke:#f59e0b,stroke-width:1.5px,color:#fff\n    style Step3 fill:#0f172a,stroke:#10b981,stroke-width:1.5px,color:#fff\n```\n\n<div align=\"center\">\n<svg width=\"720\" height=\"230\" viewBox=\"0 0 720 230\" xmlns=\"http://www.w3.org/2000/svg\" style=\"background:#0f172a; border-radius:8px; border:1px solid #334155; margin:12px 0;\">\n  <text x=\"360\" y=\"24\" text-anchor=\"middle\" fill=\"#f8fafc\" font-size=\"15\" font-weight=\"bold\">실리콘 격자의 전자-정공 쌍(EHP) 생성 메커니즘</text>\n\n  <!-- (a) 완전 공유 결합 격자 -->\n  <g transform=\"translate(40, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"280\" height=\"170\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"1.2\"/>\n    <text x=\"140\" y=\"22\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\">(a) 완전 공유결합 격자 (저온)</text>\n    \n    <!-- 격자선 -->\n    <path d=\"M60,60 H220 M60,105 H220 M60,150 H220 M60,60 V150 M140,60 V150 M220,60 V150\" stroke=\"#475569\" stroke-width=\"2\"/>\n    \n    <!-- 원자들 -->\n    <g fill=\"#0284c7\">\n      <circle cx=\"60\" cy=\"60\" r=\"14\"/><text x=\"60\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"140\" cy=\"60\" r=\"14\"/><text x=\"140\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"220\" cy=\"60\" r=\"14\"/><text x=\"220\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"60\" cy=\"105\" r=\"14\"/><text x=\"60\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"140\" cy=\"105\" r=\"14\"/><text x=\"140\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"220\" cy=\"105\" r=\"14\"/><text x=\"220\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n    </g>\n    <!-- 공유 전자쌍 -->\n    <g fill=\"#93c5fd\">\n      <circle cx=\"100\" cy=\"60\" r=\"3\"/><circle cx=\"100\" cy=\"105\" r=\"3\"/>\n      <circle cx=\"180\" cy=\"60\" r=\"3\"/><circle cx=\"180\" cy=\"105\" r=\"3\"/>\n      <circle cx=\"140\" cy=\"82\" r=\"3\"/><circle cx=\"60\" cy=\"82\" r=\"3\"/><circle cx=\"220\" cy=\"82\" r=\"3\"/>\n    </g>\n  </g>\n\n  <!-- (b) 열에너지 공급 시 결합 파괴 및 생성 -->\n  <g transform=\"translate(400, 40)\">\n    <rect x=\"0\" y=\"0\" width=\"280\" height=\"170\" rx=\"6\" fill=\"#1e293b\" stroke=\"#10b981\" stroke-width=\"1.2\"/>\n    <text x=\"140\" y=\"22\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"12\" font-weight=\"bold\">(b) 열에너지(kT) 공급 시 EHP 생성</text>\n    \n    <!-- 격자선 -->\n    <path d=\"M60,60 H220 M60,105 H220 M60,150 H220 M60,60 V150 M140,60 V150 M220,60 V150\" stroke=\"#475569\" stroke-width=\"2\"/>\n\n    <!-- 원자들 -->\n    <g fill=\"#0284c7\">\n      <circle cx=\"60\" cy=\"60\" r=\"14\"/><text x=\"60\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"140\" cy=\"60\" r=\"14\"/><text x=\"140\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"220\" cy=\"60\" r=\"14\"/><text x=\"220\" y=\"64\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"60\" cy=\"105\" r=\"14\"/><text x=\"60\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"140\" cy=\"105\" r=\"14\"/><text x=\"140\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n      <circle cx=\"220\" cy=\"105\" r=\"14\"/><text x=\"220\" y=\"109\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\">Si</text>\n    </g>\n    <!-- 결합 파괴 및 전자 이탈 -->\n    <circle cx=\"100\" cy=\"60\" r=\"6\" fill=\"none\" stroke=\"#ef4444\" stroke-width=\"2\" stroke-dasharray=\"2\"/>\n    <text x=\"100\" y=\"50\" text-anchor=\"middle\" fill=\"#f87171\" font-size=\"9\" font-weight=\"bold\">정공(Hole)</text>\n    \n    <!-- 이탈한 전자 -->\n    <circle cx=\"115\" cy=\"85\" r=\"6\" fill=\"#fbbf24\"/>\n    <text x=\"115\" y=\"89\" text-anchor=\"middle\" fill=\"#000\" font-size=\"8\" font-weight=\"bold\">e⁻</text>\n    <path d=\"M102,64 Q108,75 115,82\" stroke=\"#fbbf24\" stroke-width=\"1.5\" stroke-dasharray=\"2\"/>\n    <text x=\"155\" y=\"90\" fill=\"#fde047\" font-size=\"9\" font-weight=\"bold\">자유전자 (Free e⁻)</text>\n    \n    <text x=\"140\" y=\"155\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"11\" font-weight=\"bold\">생성 법칙: n (자유전자 수) = p (정공 수)</text>\n  </g>\n</svg>\n</div>\n\n\n#### (1) 원자 구조 및 공유 결합 [44:28~50:07] `중요`\n* $\\text{Si}$ 원자 번호 14의 전자 배치: $1s^2 2s^2 2p^6 3s^2 3p^2$\n* 최외각 전자 4개($3s^2 3p^2$)가 결합하여 $sp^3$ 혼성 오비탈을 형성하고, 인접한 4개의 $\\text{Si}$ 원자와 공유 결합(Covalent bond)을 이룸.\n* $\\text{Si}$의 원자 밀도: **$5 \\times 10^{22}\\text{ atoms/cm}^3$** [50:07].\n\n#### (2) 전자-정공 쌍(EHP) 생성 메커니즘 [50:07~53:08] `핵심`\n* **열 에너지 공급 시:** 격자에 진동 에너지가 전달되어 공유 결합이 끊어짐.\n* **자유 전자 (Free Electron):** 구속에서 이탈하여 전도대로 진입, 자유롭게 이동하며 전도에 기여.\n* **정공 (Hole):** 전자가 탈출하고 남은 가전자대의 빈 공간(Empty spot).\n* **기본 관계 (진성 반도체 조건):**\n  $$\\text{자유 전자 수 (Free Electron Population)} = \\text{정공 수 (Hole Population)}$$\n  * 실리콘 고체 격자에서 단일 전자가 여기될 때마다 반드시 1개의 정공이 동시에 생성됨.\n\n---\n"}];

    function renderMathAndMermaid(targetEl) {
      if (window.renderMathInElement) {
        renderMathInElement(targetEl, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
      targetEl.querySelectorAll('pre code.language-mermaid').forEach((block) => {
        const pre = block.parentElement;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = block.textContent;
        pre.replaceWith(div);
      });
      mermaid.run({ nodes: targetEl.querySelectorAll('.mermaid') });
    }

    const overviewBtn = document.createElement('button');
    overviewBtn.className = 'tab-btn active';
    overviewBtn.innerHTML = '<strong>📊 종합 비교 및 그림 갤러리</strong><span class="meta">7개 모델 성능 & 시각 마스터</span>';
    overviewBtn.onclick = () => selectTab(-1, overviewBtn);
    tabList.appendChild(overviewBtn);

    models.forEach((m, idx) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.innerHTML = '<strong>' + m.name + '</strong><span class="meta">' + m.elapsed + '초 | ' + m.charCount + '자</span>';
      btn.onclick = () => selectTab(idx, btn);
      tabList.appendChild(btn);
    });

    function selectTab(index, activeBtn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      activeBtn.classList.add('active');

      if (index === -1) {
        pageTitle.innerText = "종합 비교 매트릭스 & 시각 자료 마스터";
        pageSubtitle.innerText = "7개 모델 요약 품질 및 반도체 핵심 그림 자료(Mermaid+SVG)";
        let html = "<h2>1. 모델별 실행 지표 요약</h2><table><thead><tr><th>순번</th><th>모델명</th><th>모델 ID</th><th>응답 시간</th><th>글자 수</th><th>상태</th></tr></thead><tbody>";
        models.forEach((m, i) => {
          html += "<tr><td>" + (i+1) + "</td><td><strong>" + m.name + "</strong></td><td><code>" + m.id + "</code></td><td>" + m.elapsed + "초</td><td>" + m.charCount + "자</td><td>✅ 완료</td></tr>";
        });
        html += "</tbody></table>";
        html += "<h2>2. 핵심 특징</h2><ul><li><strong>그림 자료 시각화</strong>: 에너지 밴드갭, 결정 구조(단결정/다결정/비정질), 화학 원소 체계, 공유결합 및 전자-정공 쌍 생성을 Mermaid와 고해상도 SVG로 완벽 구현.</li><li><strong>순수 핵심 보존</strong>: 반복 인사, 강의 공지, 오독 잡음 등 '제외된 내용'에 대한 언급이나 목록을 일체 남기지 않고 순수 학습 및 시험 핵심만을 남김.</li></ul>";
        container.innerHTML = html;
      } else {
        const m = models[index];
        pageTitle.innerText = m.name;
        pageSubtitle.innerText = "ID: " + m.id + " | 응답시간: " + m.elapsed + "초 | 글자 수: " + m.charCount + "자";
        container.innerHTML = marked.parse(m.content);
        renderMathAndMermaid(container);
      }
    }

    selectTab(-1, overviewBtn);
  </script>
</body>
</html>
