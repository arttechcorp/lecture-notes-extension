<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 노트</title>
<style>
  :root{--canvas:#F7F7F4;--surface:#FFFFFF;--ink:#18181B;--muted:#64646D;--line:#DCDCD8;--accent:#FF5600;--accentText:#A63700;--sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Pretendard,"Apple SD Gothic Neo",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 var(--sans);color:var(--ink);background:var(--canvas)}
  .page-head{max-width:960px;margin:0 auto;padding:18px 20px 14px}
  .back{display:inline-flex;align-items:center;min-height:36px;color:var(--accentText);text-decoration:none;font-size:13px}
  .back:hover{text-decoration:underline}
  .page-head h1{margin:.1em 0 0;font-size:20px;font-weight:600}
  .toolbar{max-width:960px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
  .toolbar label{display:inline-flex;align-items:center;gap:6px;min-height:36px;font-size:13px;cursor:pointer}
  .toolbar select{min-height:36px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:13px var(--sans)}
  .toolbar input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent)}
  .toolbar .spacer{flex:1}
  button{min-height:36px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:13px var(--sans);cursor:pointer}
  button:hover{border-color:var(--accentText)}
  button.primary{color:var(--accentText);border-color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .notice{max-width:960px;margin:12px auto;padding:0 20px;font-size:12px;color:var(--muted)}
  #missing,#error{max-width:960px;margin:40px auto;padding:0 20px;text-align:center;color:var(--muted)}
  #error{color:var(--accentText)}
  iframe{display:block;width:100%;border:0;background:var(--canvas)}
</style>
</head>
<body>
<header class="page-head">
  <a class="back" href="library.html">← 보관함</a>
  <h1 id="title">강의 노트</h1>
</header>
<div class="toolbar" id="toolbar" hidden>
  <label>정답 위치
    <select id="answersSel">
      <option value="end">끝에 모아 보기</option>
      <option value="inline">문항 아래</option>
    </select>
  </label>
  <label><input type="checkbox" id="examCb"> 시험 모드</label>
  <label><input type="checkbox" id="writingCb"> 필기 공간</label>
  <span class="spacer"></span>
  <button id="mdBtn" type="button">Markdown 내보내기</button>
  <button id="pdfBtn" type="button" class="primary">PDF로 저장</button>
</div>
<p class="notice" id="warnCount" hidden></p>
<p class="notice" id="recogNote" hidden>요약 없이 인식만 끝난 강의입니다.</p>
<p id="missing" hidden>이 노트를 찾을 수 없습니다.</p>
<p id="error" role="alert" hidden></p>
<iframe id="renderFrame" src="sandbox.html" title="노트 서식 미리보기" sandbox="allow-scripts allow-forms allow-popups allow-modals" hidden></iframe>
<script src="lib/package-store.js"></script>
<script src="lib/library.js"></script>
<script src="lib/note-export.js"></script>
<script src="note-page.js"></script>
</body>
</html>
