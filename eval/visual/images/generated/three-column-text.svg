<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="100%" height="100%" fill="white"/><text x="45" y="70" font-family="Malgun Gothic,sans-serif" font-size="33" fill="#111">강의 요약</text><text x="45" y="145" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#222">정의</text><text x="45" y="200" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">이차방정식은</text><text x="45" y="255" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">최고 차수가 이인</text><text x="45" y="310" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">방정식입니다.</text><text x="45" y="365" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">계수를 확인하고</text><text x="45" y="420" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">해를 구합니다.</text><text x="335" y="145" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#222">예시</text><text x="335" y="200" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">문제를 읽고</text><text x="335" y="255" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">주어진 조건을</text><text x="335" y="310" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">차례로 정리합니다.</text><text x="335" y="365" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">부호와 순서를</text><text x="335" y="420" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">다시 확인합니다.</text><text x="625" y="145" font-family="Malgun Gothic,sans-serif" font-size="25" fill="#222">질문</text><text x="625" y="200" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">부호가 바뀌면</text><text x="625" y="255" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">해가 달라질까요?</text><text x="625" y="310" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">근의 개수는</text><text x="625" y="365" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">어떻게 알까요?</text><text x="625" y="420" font-family="Malgun Gothic,sans-serif" font-size="22" fill="#222">근거를 적어 봅니다.</text></svg>
