<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Screen Notes</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; color: #1a1a1a; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  button { font: inherit; padding: 8px 12px; border: 1px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: #1a5fb4; color: #fff; border-color: #1a5fb4; }
  select { font: inherit; width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
  label { font-size: 12px; color: #555; }
  #status { margin: 12px 0; padding: 8px; background: #f4f4f4; border-radius: 6px; min-height: 1.5em; white-space: pre-wrap; }
  #result { width: 100%; height: 300px; box-sizing: border-box; margin-top: 8px; font: 13px/1.5 ui-monospace, monospace; }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .note { color: #666; font-size: 12px; margin-top: 12px; }
  .banner { font-size: 12px; padding: 8px; border-radius: 6px; margin-bottom: 10px; }
  .banner.ok { background: #e7f3ea; color: #1a5c33; }
  .banner.warn { background: #fdf1e0; color: #7a4b00; }
  #cropWrap { position: relative; display: none; margin-top: 8px; user-select: none; }
  #cropWrap img { width: 100%; display: block; border-radius: 4px; }
  #cropBox { position: absolute; border: 2px solid #1a5fb4; background: rgba(26,95,180,.15); display: none; }
</style>
</head>
<body>
  <h1>Screen Notes</h1>
  <div class="note" style="margin: 0 0 10px;">화면 이미지는 기기 안에서만 처리되고 어디에도 저장되지 않습니다. 패널을 닫으면 모두 사라집니다.</div>

  <div id="engineBanner" class="banner warn">엔진 확인 중...</div>

  <label for="tabSelect">영상이 열린 탭</label>
  <div class="row">
    <select id="tabSelect"></select>
    <button id="refreshTabsBtn" title="탭 목록 새로고침">↻</button>
  </div>

  <label for="modeSelect" style="display: block; margin-top: 8px;">캡처 영역</label>
  <select id="modeSelect">
    <option value="region">영역 지정 (권장 — 강사 화면을 제외하고 슬라이드만)</option>
    <option value="slide">전체 화면</option>
    <option value="caption">하단 자막 띠</option>
  </select>

  <label for="langSelect" style="display: block; margin-top: 8px;">음성 인식 언어</label>
  <select id="langSelect">
    <option value="auto">자동 감지</option>
    <option value="korean">한국어</option>
    <option value="english">영어</option>
  </select>

  <div class="row" id="cropRow" style="display:none;">
    <button id="previewBtn">현재 화면 불러오기</button>
    <span class="note" id="cropHint" style="margin:0;">불러온 뒤 드래그해서 영역을 지정하세요</span>
  </div>
  <div id="cropWrap"><img id="cropImg" alt="" /><div id="cropBox"></div></div>

  <div class="row">
    <button id="startBtn" class="primary">캡처 시작</button>
    <button id="stopBtn" disabled>중지 후 노트 생성</button>
  </div>

  <div id="status">영상을 재생한 뒤 탭을 고르고 시작을 누르세요.</div>
  <div id="tokenUsage" style="font: 12px/1.4 monospace; color: #555; white-space: pre-wrap;"></div>

  <textarea id="result" placeholder="노트가 여기 표시됩니다. 자동 생성 초안이니 반드시 직접 검토하세요." readonly></textarea>
  <div class="row">
    <button id="copyBtn" disabled>복사</button>
    <button id="downloadBtn" disabled>.md 저장</button>
  </div>
  
  <div style="margin-top: 12px; background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #ddd;">
    <label for="outputFormat" style="display: block; font-weight: bold; margin-bottom: 4px;">출력 형태 선택</label>
    <select id="outputFormat" style="margin-bottom: 8px;">
      <option value="summary">핵심 요약본</option>
      <option value="reflection">강의 소감문</option>
      <option value="custom">직접 입력</option>
    </select>
    <textarea id="customPrompt" placeholder="원하는 조건을 입력하세요 (예: 표 형식으로 정리해줘)" style="display:none; width:100%; height:60px; box-sizing: border-box; font:inherit; margin-bottom: 8px;"></textarea>
    <button id="notesBtn" disabled title="재캡처 없이 선택한 형태로 노트를 다시 만듭니다" style="width: 100%;">이 형태로 (다시) 생성</button>
  </div>

  <details style="margin-top: 12px;">
    <summary style="cursor: pointer;">인식된 텍스트 (메모리에만 존재)</summary>
    <pre id="rawScript" style="font: 11px/1.4 monospace; white-space: pre-wrap; max-height: 240px; overflow-y: auto; background: #f4f4f4; padding: 6px; border-radius: 4px;"></pre>
  </details>
  <details style="margin-top: 8px;">
    <summary style="cursor: pointer;">디버그 로그</summary>
    <pre id="debugLog" style="font: 11px/1.4 monospace; white-space: pre-wrap; max-height: 200px; overflow-y: auto; background: #f4f4f4; padding: 6px; border-radius: 4px;"></pre>
  </details>

  <div class="note">
    개인 학습용 도구입니다. 소속 기관의 원격수업 지침·이용약관을 먼저 확인하세요. 캡처물의 보관·재배포는 하지 마세요.
    <a href="#" id="optionsLink">설정 열기</a>
  </div>

  <script src="lib/mergeLines.js"></script>
  <script src="lib/settings.js"></script>
  <script src="lib/audio.js"></script>
  <script src="lib/ai.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
